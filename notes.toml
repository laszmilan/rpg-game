# Haldvik - notes. Standing facts: the world, the ground, practice, people, laws and treaties. Player-readable.

_ = "Standing facts, true until play changes them. The present (numbers, health, work, clocks) is current.toml; what happened is log.toml; how to run the game is CLAUDE.md. Player-readable."

# ================= THE WORLD =================

[setting]
_ = "Standing facts about the world. Events are in log.toml, numbers in current.toml."
folk = "The Skeldfolk of Vardmark: fjord-people of a cold coast of black stone and thin soil, under jarls who answer to no one but each other. Names take -son and -dis. Places take -mark, -vik, -holt, -fell, -grind, -stead."
the_long_cold = "Nine winters running, each worse; sea ice where there was none, barley failing two years in three. The old wisdom says winters run in nines and the ninth is the last. The priests say Hald's ember dims and Skarn wakes. The ember-wives say something else, carefully."
the_exile = "Hakvarr counted stores against mouths and called the answer a settling expedition: four hulls, 108 expendable souls, a coast no Skeld ship had reached - possible because the ice shortened the crossing and Osvi brought home the Needle."
the_ships = "Four hulls sailed Y1 W6. THE GREY MARE is the Keel, hauled up over a pit as a dwelling, un-rigged; her cordage came Y3 W15. OTTERSNOUT and WIDOW'S PROMISE lie on the sand, seagoing. HALD'S COAL works the strand."

[setting.gods]
_ = "The Nine at the Fire. Six still named, three not."
"Ormegga the Coiled" = "Sea and deep water. Gives the catch, takes the crew. First fish of a voyage goes back over the side."
"Hald the Ember" = "Hearth, warmth, the sworn oath. Every fire descends from an older fire; a hearth lit from nothing has no god in it."
"Skarn Long-Hunger" = "Winter, wolf, famine. Not evil. Owed."
"Vetta of the Nine Doors" = "Birth, death, thresholds. Midwives and grave-diggers share her."
"Brann Redhand" = "War, feud, blood-price. The only god who keeps accounts."
"Aldra Sheaf-Mother" = "The field and the grain. First sheaf to her, last sheaf left standing. A farmer's god in a land where the barley fails two years in three; Aud prays to her quietly."
"The Struck Name" = "Chiselled out of every standing stone in Vardmark in a generation nobody can date. Saying it is worse than oathbreaking. Nobody knows it; some claim to."
"The Two at the Back of the Fire" = "Nine places are set round the fire at every feast in Vardmark, and two are always left empty. Their names were not struck; they were lost, so long ago nobody remembers losing them. The priests argue whether they left or were forgotten; the ember-wives say that is the same thing. Bad luck to sit in their places, worse to name them; children dare each other to do both. With the Struck Name, they are the three not named (Y3 W17)."

[setting.customs]
"oath over ember" = "Hand over a live coal. Breaking it earns cold-tongue: nobody need hear, feed or avenge you."
by-names = "Given by the folk, never taken, and can change."
"the Standing" = "Any assembly. Stand to speak, sit to yield. A man who will not sit is making a threat."
guest-right = "Three nights, bread and salt, no blade drawn under the roof; the third morning the guest goes or becomes something else. Binds host and guest. It has a SENDING as well as a welcoming (Vigmar, Y2 W45): THIS HEARTH IS ANSWERED; WALK ON TO YOUR OWN FIRE - turns a guest away without breaking guest-right."
sea-burial = "Into the shallows under a stone where Ormegga can reach them. If the bay is iced, the ice is cut."
reckoning = "Winters, not years. Ages turn at the Feast of Turning."
marriage = "VARDMARK CUSTOM, held under law 10 (set Y3 W17). Both of fifteen winters or more; not parent and child, brother and sister, or milk-kin. The man's side asks the woman's kin (father or eldest brother; failing kin, the jarl or the lawspeaker speaks for her), and HER OWN YES IS NEEDED - a woman given against her word is a theft her kin can be made to answer for. A BRIDE-GIFT from his side stays hers if it ends; HER PORTION stays hers too; in Haldvik both are small. THE RITE: before two witnesses at least, each brings a coal from their own fire, laid on one hearth and blown into one flame - one hearth from then (law 20: one plot back). Ale if there is any. ENDING IT: either declares it ended at the door before two witnesses, saying why; each takes back portion and gifts; the plot the jarl judges (law 20)."
milk-kin = "A child put to another woman's breast makes kinship: it bars marriage between the two and with each other's brothers, and makes a fostering claim both ways. It does not touch inheritance."
"the first hearth words" = "Fenn's, at Haldvik's first hearth, Y1 W11 D6, lit from the Skalgrind ember: HALD, HERE IS YOUR FIRE. IT CAME FROM THE HALL AT SKALGRIND, AND BEFORE THAT FROM THE HALL BEFORE IT, BACK TO THE FIRST FIRE, WHICH NOBODY LIT. WE CARRIED IT OVER THE SEA, AND IT DID NOT ASK WHERE IT WAS GOING. NEITHER DID WE. BURN HERE NOW. BE WARM TO WHOEVER SITS AT YOU, AND OWE NOBODY. WHILE YOU BURN, THIS IS A HOUSE. The folk answer: WHILE IT BURNS. Said again whenever a new hearth is lit from the main one."
"Feast of Turning" = "Midwinter, W46, the longest night; the new winter is counted from it. Every hearth banked to one coal and relit before dawn - if it goes out, the household's luck goes with it."

[setting.magic]
_ = "Rare, expensive, real."
ember-wives = "Read live coals, lay small wardings. Every working takes something that does not come back: warmth, a memory, winters off the end."
"laid wardings and cut marks" = "A laid warding is ember-wife craft and wants renewing. A cut mark does not, but only works cut true - by a hand that knows what it says. Very few living hands can; most marks are decoration."
"out past the settled land" = "Hollow-men that wear the drowned. Grey walkers on the high ground. Whatever fishermen will not name over deep water. Rare, survivable if careful and lucky, none of it interested in a fair fight."

[setting.homeland]
region = "Vardmark, seat Skalgrind, Jarl Hakvarr Ormsson. About 340 in the town and 600 in the fjord steadings, less the 108 he put on boats."
condition = "Nine cold winters, failing barley, unrest. About five weeks' sail by the ice road in good weather."
the_crossing = "WEST from Skalgrind, by the Needle and the sun, running the edge of the sea ice for the long middle of it - the ice road, why it was shorter than anyone expected. Haldvik lies somewhat north of home: midwinter days are shorter here, and everyone who has kept two Turnings knows it. Winters are harsher than Skalgrind's even in the Long Cold. Osvi can put a number on it from the noon sun at an equinox (Y3 W5)."
truth_of_it = "Officially a settling venture, actually a culling, and Erik said so in front of two hundred people."

[known_world]
_ = "What Haldvik has learned about this coast. How and when is in the chronicle."
the_broken_hulls = "Worked Hessa hardwood comes ashore in the windrow, thickening northward - the same wood as Skelva's token. Two fresh pieces, tar still black; Bruni reads the second as PULLED, not rotted, as if something pushed the boat. Hessa hulls have been coming apart north of here for thirty years and twice in the last two. And nobody at Kolvenn tells the story of a hull that did not come home."
threats_known = [
  "The Long Cold.",
  "Hakvarr, who will want to know whether this worked, and who now has a rival title on his coast.",
  "Whatever put out three fires on two hulls on the same still night.",
  "Whatever emptied this land four hundred winters ago.",
  "The hollow.",
  "Whatever is breaking Hessa hulls north of here.",
  "The thing that stands at the door and takes nothing.",
  "Whatever walked straight off the high moor to Nagholt and back (Y3 W1).",
]

[known_world.the_land]
shape = "Haldvik and Kolvenn sit on a long arm running north, bending hard west at the top and joining something much bigger four days' sail on. At its root a marsh neck that cannot be walked. Not an island. Gest: we are on a thumb."
walked_to = "The bay; the shoulder above it; the strand five km south-west; the bird cliffs at the south cape; the moor; the cairn line - eleven man-high stones on a straight six km NNE, ending at the hollow; the near edge of the south-west bog; the salmon river to its head; Ylva's black ridge in the basin past the moor's crown, about 22 km north (Y3 W16)."
the_bay = "Inside the bar, about 700 m from beach to bar and 1 km across, 5-10 m deep; the cod ground 300 m out; the seal reef under the north shoulder; one withied channel through the bar that moves every gale. Outside, the bottom falls away. VARDMARK CUSTOM (Hjalti): nobody owns the sea; a steading owns its shore to the net-lay; and a landing is the steading's - a ship drops sail outside and waits to be looked at. A find on your own shore is yours, like a whale."
the_water_road = "The salmon river rises in three loughs at the moor's southern edge and runs 11 km to the bay. The valley stream runs east from the old steading and dies in the bog. Between them 2.5 km of flat wet ground, and the old road crosses exactly there. Valley pine can be floated to Haldvik with one haul between two waters - but a four-metre pine is 300 kg, six men skid two a day, and timber floats only on the spring and autumn spates."
seen_not_walked = "The valley nine km south-west: pine 12-15 m; twelve grassed-over longhouses 22-26 m long; a sunken road a metre deep running east; a midden two men deep - cattle, sheep, pig, fish, seal, and six-row barley fatter than Aud's - whose top third goes from cattle to fish and stops. No graves anywhere. The last house's threshold slab is called Skalgrind."
unexplored = "Everything north of the moor. The whole west and north coast. Whatever the cairn line fences."
gives = "Peat and turf without limit. Grey building stone. Driftwood. Four springs. Grazing. Withies, bast, sealskin. Seaweed, shellfish, crowberry, teeth-grass, rosehip, pine needle. Salmon, cod, seal, seabirds. Bog ore in the peat."
does_not_give = "Standing timber within reach. Grain beyond one sowing. Flax. No kiln fired. No hiving bees seen."
weather = "First snow about W37-38; the terrace freezes a spade deep from W38; the bay ices about W46; the thaw about W8. Nothing dries in still air; cold moving air dries best. The bar re-cuts itself every winter of gales, so the channel is re-sounded after every blow, for ever."

[known_world.the_cairns_and_the_hollow]
the_marks = "A boundary formula cut at ten of the eleven cairns over six km: the ground beyond this is not yours. The eleventh says the same and three marks more. Vigmar can read one of the three and will not say it."
"Vigmar's_claim" = "The marks are ancestral to Skeld cut-marks, four hundred years older: this land is the old country and Vardmark the colony, and whatever the forefathers left here for had its name chiselled off every stone on the far side. His evidence: Skalgrind's old tally-stick, a list of what a storm-blown crew saw on this coast two generations back, with a mark on it that should not exist. His own objection: a century he has never accounted for."
the_pattern_of_names = "Twice a name read out of the ground here is a place in Vardmark: SKALGRIND, the valley threshold slab; NAGHOLT, the door post under the shoulder and a strip of Vardmark ground."
iron_in_the_stones = "There is iron in the cairns. The Needle swings near one and points a different way each time; two hundred paces off it behaves, and the line cannot be sighted."
the_hollow = "Where the line ends: a lipped basin about 400 paces across, bare peat, a black mass a man's height in the middle. No animal track goes in. Old small bones, and one long bone Ylva swears was not deer. Two paces inside the lip on a still morning her head went thin. FENN: a prison, walled by people who wanted the thing kept in and were still afraid of it four hundred winters on. ERIK: metal fallen from the sky that melted the stone. Fenn: might be both."
the_straight_tracks = [
  "WHAT: two-footed prints, long, narrow and shallow, no claw, toe or heel, a stride longer than a running man's, dead straight over drifts and stones. Not Ivven, not snowshoes (Ylva). The dogs will not pass the cuttings. Ossur's grandmother's grey walkers go where something was left unfinished.",
  "Y3 W1: off the high moor north-east to the peat cuttings over Nagholt, where it stood a long time, and back up the same line. Lost on scoured peat 3 km past the edge.",
  "Y3 W5: IT CAME BACK on fresh snow, the same line to the same place, stood longer, the patch twice as wide; the dogs would not settle about the fourth hour. Followed, it ran dead straight 5 km past the edge to a second smaller trodden patch on open moor with nothing there, then lost to the wind.",
  "Y3 W6, THE NIGHT AFTER THE LAYING: it came down over the laid house without stopping to THE UPPER EDGE OF THE FIELDS and stood looking at the roofs - SEEN in starlight, tall, grey-pale, narrow, too still for a man; it stood while watched and TURNED WHEN MEN WALKED UP, like a man done looking, and went back up its line without hurry, not gained on at a walk.",
  "INGRA'S READING (Y3 W6): it goes home, north onto the high moor, further than Ylva went, to something heavy and cold that pulls like iron pulls (a guess). Not a god - gods leave no footprints - and not the one in her door, which does not walk.",
  "Y3 W11: to the laid house and no further.",
  "Y3 W15, THE NIGHT OF THE LAND STANDING: straight across Aud's new strips, over the side ditch without a break, to the river bank, stood at the water, and back up the same line; not seen. Aud: nothing is buried in her field that she knows of - she dug a spade and a half. Aki's rods down the line found nothing, soil then gravel (W16).",
  "Y3 W16: ITS LINE RUNS STRAIGHT INTO YLVA'S BLACK RIDGE past the moor's crown, prints hours old leading off north-east.",
  "KOLVENN'S OLD WOMEN (Y3 W16): when the oldest's mother was a girl one came down to the spit for a winter and stood in the snow at the houses; a young man threw a spear; found in the morning on his back in its tracks, no mark, eyes open; the spear upright ten paces past where it stood, head clean; it never came again. Her mother said he did not miss. The old ones' ground does not take Haldvik, it comes to look at it.",
]

[known_world.the_needle]
what = "A dark iron needle floating in oil in a sealed brass case of foreign make. Osvi's, given freely; kept in Erik's chest (lent to Ylva Y3 W15-16)."
what_it_does = "Points north underneath, and at iron in the ground when close enough - why it swings on this coast and why Ketil's knife stood out from his hip at the second cairn."
loose_ends = [
  "It drifted a hand's width off true in a hut in Skalgrind with nothing there to pull it.",
  "IT WALKS: seven clean sightings off the north headland, the seventh Y2 W51, each further east than the last, about a finger each time, never back. Even, not in jumps (Osvi): a failing needle sticks and wanders; this moves like something steady pulling. Cut on two sticks that agree, Osvi's and Aki's.",
  "IT SHIFTS AS YOU WALK (Y3 W5): laid against the dead-straight track of the walker at the moor edge and again 5 km out, the angle opened by a good hand. Aki and Osvi drew the two lines in ash: they crossed north on the high moor, about 20 km from the storehouse gable, give or take 10. Osvi: if it points at one thing, that is where it is, and a needle that points north does not behave so.",
  "Y3 W12-14, OSVI'S BOARD AND NOON STAKE at the tower and the head of the salmon river (11 km), Ylva taking the far sighting twice: THE LINES CROSS NORTH, ABOUT 22 KM FROM THE STOREHOUSE GABLE, GIVE OR TAKE 2 - blank ground beyond the high moor's crown. Osvi, aloud: if it points at a thing, his seven notches say the thing moves east a finger a month - or something else pulls.",
  "Y3 W16, YLVA AT THE CROSSING: past the crown a wide wet basin, and in it A RIDGE OF BLACK STONE lying in the peat, heavy, rust-red where broken, no cairns or marks; the Needle went round in circles over it.",
]
what_the_folk_believe = "That it turned toward this land because this is where they were meant to come. Erik said it; Fenn repeats it."

[known_world.neighbours]
the_Hessa = "Allied by treaty. Four places, about 400 people, west and south-west; one has more people than Skalgrind. KOLVENN, 61 souls, four days' sail north: eleven plank-walled sunk-floor houses behind a shingle spit, a boatwright's shed twice any house and the middle of the place, three hardwood ships, about 150 years there - the far end of their world. Forest, grain, peas, fat, cooperage, barrels of birch tar, a master boatwright. NO SMITH in four places; their iron comes hand to hand from the far south-west, old and twice worked. They will not talk about the cairn stones in a house or after dark, and walk out of a room where the old ones are spoken of. ILMO (Y3 W6): the marks were cut by the dead; where the line ends is THE SLEEPING GROUND, which takes someone from Kolvenn every few years; THE DEAD SLEEP WHEN THE WIND SLEEPS - nobody goes near it on a still day. The Hessa came up the coast from the south-west following trees and salmon; the stones were already old and the houses grass - THE ONES BEFORE; green humps behind Kolvenn and down the coast, never dug or built on; THE OLD WOMEN AT KOLVENN WHO KEEP THE NAMES know more. A man named at Kolvenn as lost who walks home stands at the door as a stranger, and the house decides."
the_Ivven = "Deer people, two or three hundred, inland and north-east, on the coast some years and not others. Hide shelters moved every three days, pale lean dogs and dog-sleds, bone and antler for everything and no iron. Full white teeth. Will not go under a roof. Trade through Hessa via the scarred man: TEN HIDES FOR A KNIFE; in winter, meat at THREE DEER A KNIFE (Y3 W2), delivered by their own dogs. They come when the deer do. THE HERD IS THEIRS WHEREVER IT WALKS (Ilmo) - Kolvenn took six off the shore once in a hard winter and the Ivven stayed away three springs. In winter they are not hungry. Y3 W6 they came unasked with meat to the edge: TWENTY-FOUR DEER FOR EIGHT USED KNIVES off Haldvik belts, each tried and chosen; the scarred man carries the jarl's own. He keeps Vigmar's counted stick in his coat."
the_west_people = "Far south-west down the mainland: many, living in stone, a market where things are bought with metal. They never come here. Osvi's brass case came up that chain. An old woman at Kolvenn: they do not need us."
Skalgrind = "Five weeks of open water east. Hakvarr does not know whether anyone lives. Halvar: a hull from the north is the Hessa and we get a day; a hull from the open sea east is Skalgrind and we get an hour."

# ================= THE GROUND =================

[ground]
_ = "Haldvik's ground by zone. Updated whenever something is built, moved or cut."

[ground.the_bay_and_beach]
the_ground = "A barred bay, the withied channel moving with every gale; a sand beach below the terrace; the salmon river at the head; the seal reef under the north shoulder; the north headland beyond."
built = "The drying racks and Sigra's stack, the smokehouse, the forge, the Keel, the boats hauled up, the low bar-mark post, the weir. The burial ground - fourteen stones in the shallows."
"the smokehouse" = "Double size, about 500 kg a week, day and night through the cod; since W14 smoke, salt and racks are the ceiling, not the catch. Ingra's first warding goes here, then a season of watching."
"the forge" = "Stone and turf, sealskin bellows, anvil and kit. No door and no lock. Hafli's smelting shaft against the wall."
"the Keel" = "The Grey Mare upside down over a metre-deep pit, turf to the keel, skins over her back, a stern door. Holds twenty, warmer than longpit 1."
"the channel" = "The bar marks on Skelva's method: an in-line from a low post on the shingle to a high one on the terrace edge, and a turning pair on the north shoulder. Re-sounded after every blow, and the back post moved."

[ground.the_terrace]
the_ground = "About 300 m along the bay and 40 m deep, about 1.2 ha - the only flat, dry, sheltered ground. The grey stone band at its back; the wet south end floods."
built = "Longpits 1-3, longpit 4 (roofed Y3 W18, the middle wall to come), the storehouse, the washhouse and ward, the byre, the tower, Ranvi's lean-to, the peat walls, the three fermenting pits, the high bar-mark post. About a third of it."
free = "About 0.8 ha - the wet south end and the strip along the edge."
"the tower" = "22 sticks on four proven holes, hooded, the night post, a horn on the platform. Sees past the north headland and over the shoulder to the moor edge."
"longpit 1" = "12 x 8 m aisled, turf and stone, driftwood frame. The main hearth; everyone passes through it."
"longpit 2" = "Same build. The byre against its east gable; the hens by its hearth."
"longpit 3" = "12 x 8 m. Aki's bench, Vigmar's corner and the lesson board. The clean room."
"longpit 4" = "Forty-two holes proved and dry: thirty-four at the thaw and the eight of the east row dug again a pace upslope (W11), clear of the spring. Framed from W12: both rows of posts, the wall-plates and the tie-beams. Walls up W17, ROOFED W18 D5, doors hung W18 D6; the middle wall waits while the whale meat hangs in the through-draught. Two halves walled apart, a door at each end: the future ward and washhouse."
storehouse = "10 x 10 m dressed stone, the whole sealed store, a door and the reeve's beam. Nobody sleeps in it. The map, the tusks and the seed under the beam."
"washhouse and ward" = "One building, a wall between, a door at each end, one hearth in the middle wall. Enna's design."
"the byre" = "27 stalls against longpit 2. Peat litter doubles the dung heap."
"Ranvi's lean-to" = "The old birth-house; births go to the ward now."

[ground.the_shoulder]
the_ground = "The slope above the terrace to the moor edge about 4 km out: turf, grazing, peat two spades deep, the barley ground, the stone band at its foot. Haldvik's to the moor edge by law 17. The planned village and walls are here."
built = "Aud's fields and kitchen crops, the peat cuttings, the fire ring, the quarry, the turning pair of bar marks. Nothing lived in."
"the fields" = "About 1.5 ha sown Y3 W11 (200 kg barley, 100 kg peas): 1.1 inside the ring and 0.4 of new strips on the south face under the stone band, raised. Aud's top ditch across the first field and the side ditch to the river (Y3 spring); the lower third of the first field drains for the first time. Kale stands through the frost."
"the peat cuttings" = "Where the bog ore is, and where Nagholt lies - a burned house 24 m long under 60 cm of peat, traced by rod and recorded on three sticks in different buildings. REOPENED AND CLOSED Y3 W6 D5 under law 18: the bones, the charcoal and the door post laid on its own floor; no mark on the ground. THE ORE is the crust and lumps where the orange water sits at the bottom of the cuttings; dug from Y3 W18 WELL CLEAR OF THE HOUSE, and any worked wood or stone stops the spade and comes to council (the jarl). The post's marks are on three sticks (Vigmar, Vigmar, Tova). THE STRAIGHT TRACKS STOOD HERE (Y3 W1). Every peat face opened is a dig."
"the fire ring" = "A 45 x 30 m trench round the underground peat fire, drowned Y2 W26 and cold since. Walked every morning."
grazing = "Sheep, goats, the cow. PLENTY OF IT on the shoulder outside the ring, to the moor edge; the grazing inside the ring is the plots' reserve. Ylva's reindeer ground and Aud's barley ground are the same field and nobody has settled it. The Ivven have not agreed law 17; they deliver to the edge and not a step over."

[ground.the_strand]
the_ground = "Five km south-west: two km of shingle under a wooded shoulder, springs, the driftwood windrow of about three hundred sound trunks. The sea comes over its low end in a gale."
built = "Three salt pans (one cracked and strapped), the charcoal clamp ground."
status = "Worked since Y3 W10 by Hovard's eight: three pans on peat, about 40 kg of salt a week, all to Sigra; the clamps to burn till the frost (the jarl, W17). Hald's Coal carries the peat."
[land_plan]
_ = "Laws 6-9 and 19-21: private ground, no pegging, survey and settlement first, the jarl allots. THE SURVEY DONE Y3 W14, every road and lane pegged; the land laws and the drawing for the order of choosing Y3 W15 D4; claims cut in the drawn order (current.toml clocks)."
kept_for_haldvik = "Vigmar's list: the beach and the terrace edge, the burial stones, the weir and the river mouth, the four springs, the tower's ground, the grey stone band, the peat cuttings (every hearth, and Nagholt under them)."
homes = "Given by hearth, sized by head. Thirty-eight hearths in winter: fourteen couples, nine widowed with children, fifteen who came alone. CLAIMS Y3 W15: 55 - 33 of the old 38, 19 grown sons and daughters off their parents' fires, 3 who turn fifteen at the Turning; Fenn, Gest and three other old ones do not claim. Cut, and proof given, as people have time and means. Nobody moves out in Y3."
area_inside_the_ring = "The 150 m ring is the wall's line, not the edge of Haldvik: law 17 holds the shoulder to the moor edge about 4 km out. Inside the ring, 3.5 ha; one plot is about 127 m2 (a block of six with gardens and its share of the gap, about 760 m2; the six homes share a 10 x 20 m roof). ROADS PEGGED (Gate Road, Wall Line, the lanes across the village side) 0.55 ha, about 43 plots' worth. HOME PLOTS PEGGED: 46 in seven blocks of six and four spare, 0.58 ha; PLUS TWO BLOCKS OF SIX drawn Y3 W15 D4 on the grazing at the north ends of Grip and Egg Line, 0.15 ha - 58 plots. RESERVED (Market Line blocks for market, storage and workshops; Egg Line pits and peat) 0.46 ha, about 36 plots' worth. AUD'S FIELDS inside the ring 1.1 ha, about 87 plots' worth. EMPTY (grazing) about 0.65 ha after the two new blocks, room for six or seven blocks more once edges and the ground by Wall Line are left."
blocks = "Blocks of four to six homes, each about 10 x 20 m, built in the middle along shared walls with 5 m of garden round; blocks 3 m apart. Ormar: turf walls do not burn, roofs do - lanes kept clear, a water butt at each block end, gaps along the wind. Aki: 38 hearths in blocks of six is seven blocks and four spare, about a hectare."
streets = "GATE ROAD, 5 m, straight from the beach up through the terrace to the gate. Lanes east-west about every 25 m, blocks between, end-on to the westerlies. From the shore up: SALT LINE (the beach), IRON LINE (the terrace and forge), then up the shoulder WHALE, GRIP, EGG (the fermenting and ash egg pits and the peat), MARKET, BARLEY, and WALL LINE, 5 m, about 150 m up, a bare lane just inside the wall with the wall a little further out. NOTHING BUILT AGAINST THE WALL, EVER (Halvar). Not named for the dead or the ships."
proof = "Drawn on the map in spring before anything is built: every road named, every plot numbered, every hearth a plot. Two sticks per plot, the hearth's and Haldvik's, and a copy kept elsewhere. Plain unmarked stones at the corners."
waste = "Enna: never into the harbour. Latrines and waste below the weir or out past the rocks, downstream of everything eaten or drunk."
the_longpits = "When people move out: LONGPIT 1 THE GREAT HALL; LONGPITS 2 AND 3 barracks and homes for those who will not build, and guests; LONGPIT 4 THE WARD AND WASHHOUSE, two halves walled apart with a door at each end, and the present ward comes down. Ranvi's lean-to, the peat walls and the fermenting pits move up to the shoulder."
fields = "THE FIRST LAND CLAIMED IN SPRING, common for years yet, Aud to site them. About 1.5 ha sown Y3, 1.1 inside the ring and 0.4 of top strips above it. NEW STRIPS GO UP THE SOUTH SLOPE OUTSIDE THE RING, not into the plots' ground; the limits there are shelter and aspect, peat that wants ditching and seaweed, the carry, no wall, and the reindeer ground - never area. The fields can wait (the jarl, Y3 W15). TARGET next harvest: 300 KG BARLEY AND 300 KG PEAS IN STORE beyond the seed. AUD'S PLAN: a ditch across the top of the first field to catch the shoulder's water and one down the side to the river; strips raised a spade high; seaweed off the beach for dung; the ground where the stone band breaks the westerly, facing south; dug the week the spade goes in, ditches first, sown the moment it dries and not a day later. A HERB AND SPICE STRIP by the ward, Enna's and Solvi's; Aud's crew works it with the fields from W17, and the henbane seed goes in it."
the_walls = "The jarl's four, for many years from now: (1) a ditch and bank across the terrace, a summer for thirty men; (2) about 470 m round the shoulder, a half circle 150 m out, about 3.5 ha inside; (3) about 300 m between terrace and shoulder against the wind; (4) a wall at the shore. Halvar: give land inside the line the wall will take, and walk it with him in spring."
the_forge_site = "Against the quarry's cut face at the back of the terrace, earth banked on two sides; a hood for the smoke; nothing within 10 m. Brek tells Ormar what is wrong before it is built. THE BLOOMERY goes up BESIDE THE SMOKEHOUSE, not behind the forge (Brek, Y3 W17); outside, never under a roof."
terrace = "No house plots on the terrace; the old and lame live in the longpits or the hall."
build_order = "THE JARL (Y3 W16-17): longpit 4, the smoke tunnel, the fermenting pits, then the forge (current.toml build_plan). One block staked at the gate end - most likely only cut, not built, in Y3 (Ormar)."
promises = "LAWS 19-21 (Y3 W15 D4). HALVAR's plot by the gate is marked. The order of choosing is cut: the council (Halvar, Vigmar - Fenn does not claim), then the heads of work 1 Hjalti, 2 Ylva, 3 Ormar, 4 Sigra, 5 Brek, 6 Enna, 7 Aud, 8 Hovard, 9 Solvi, 10 Ingra (Solvi chooses Ingra's beside her own, as keeper), then the nine widowed hearths for the closest unclaimed block and the second-closest (Gudny 2, Ingunn 9), then the common stones 1-33 (Tova 33). THE JARL DRAWS NO PLOT: longpit 1 is his by law 21. Nobody moves out in Y3."

# ================= PRACTICE =================

[practice]
_ = "STANDING PRACTICE, learned in play. It holds until play changes it. Numbers are in current.toml."

[practice.health]
the_coughing_measures = "Law. Separate messes by pit, boiled cloths over the mouth, two or three fixed carriers who stay away from the clean pit, vents open at night. The clean room is the one fewest walk through - longpit 3."
the_fresh_rule = "Enna calls it the most important thing anyone told her. Fresh food all winter: fish and meat eaten fresh, raw or barely warmed. Raw liver, seal and fish - THE CHILDREN FIRST, NURSING MOTHERS NEXT (Y2 W32). Berries packed whole in fat keep a year."
the_custom = "Two in the room at any birth or death."
frostbite = "Warm a frozen hand in cool water, never hot. Enna watches a week before she says what will be lost."

[practice.food]
the_units = "The ledger runs in STORE KG. Eaten is about 1.5 kg a head a day; store draw at full ration 0.65. Income is reported gross. Fresh income counts at half its raw weight against the store (Y2 W39). Oil and fat count like any other kg (W40). ONE NUMBER FOR THE PLAYER (Y2 W48): every figure shown is store kg; raw weights are GM-internal."
the_standing_order = "Salt, smoke, dry the rest. A dead-air week goes to the smokehouse, not the salt barrel. Counted every week."
how_it_is_caught = "Long-lines off two ship's boats, the strand lines, the racks, Sigra's stack, the weir in season, the cliffs in season. THE WINTER FISHERY is cod inside the bar until about W37, back on the offshore bank about W12. ON THE ICE, KOLVENN'S WAY (Ilmo): holes in a line and a net pushed under on a pole for flatfish and small cod; seal at the breathing hole with a barbed harpoon; basking seal stalked under white cover, crawling, freezing when one lifts its head. Always roped in pairs, an axe to test every step. The ice at Kolvenn takes somebody every winter, nearly always somebody who knew better."
the_harvest_first = "The jarl's standing priority (Y2 W31): cutting before construction; eggs and greens first because a crop needs no salt. Grain that will not dry outside is dried by the longpit hearths."
a_small_whale = "ILMO'S WAY, KOLVENN'S (Y3 W18): above the tide with a rope on the tail before the water turns; the fat off first in hand-wide strips while the morning is cool, to the pots for oil; the dark meat cut palm-thin and DRIED IN THE WIND, not smoked, about three weeks under a roof with no walls - rain on it before it is dry sours it from the inside; liver and heart eaten the same day; the guts out past the rocks by boat, never left on the sand."
the_ceiling = "Weather. A good drying week with twenty-five hands hangs five or six hundred kilos; a still wet week almost none. Salting takes about 100 kg of salt per 500 of fish."

[practice.building]
"riving, not sawing" = "Bruni's way: a wedge in the end, follow the grain, hew flat with an axe. Twenty men at once, about 26 sticks a week. It wants short, hard iron wedges - long soft ones jump and break faces."
ormars_rule = "From about W38 the terrace freezes a spade deep. Every hole wanted before the thaw is dug in W35-36, stone-lined, stuffed with bracken and turfed. And a hole dug before the frost holds ice all winter and is a well at the thaw: open it, watch a fortnight, prove it, then set the post."
night_work = "Fire baskets of offcuts, not peat. Two hours at each end of the day, for hauling, carrying, dressing timber and cutting sod - never setting a post or cutting a joint."
labour_baseline = "Post hole dry: 0.5 man-day; in wet spring ground 1-1.5. Turf: 8-10 m2 per person-day. Spade-turned ground: 45 m2 per person-day. Riven sticks: 26 a week. Timber tower of 22 sticks: 48 man-days. Longpit 12x8 aisled: 350-400 man-days. Dressed stone building 10x10: six weeks."

# ================= PEOPLE =================

[people]
_ = "Everyone, once: standing character, capability and unspent promises. What happened is in log.toml, numbers and present condition in current.toml. How anyone feels about Erik shows in the fiction, not in a score."
winters = "w is winters. Ages turn at the Feast of Turning (W46); everyone moved on one at the Y2 Turning. Erik, Aki, Hafli, Tova and Kelda are exact; others may be a winter behind."

[people.player]
name = "Erik Karrsson"
w = 23
title = "Jarl of Haldvik, made Y1 W22 d1 on the ember-stone. Chosen once, not un-chosen; a jarl's son is a jarl."
look = "Copper hair, neck-long, braided. Heavy through the shoulders and arms from oars and hauling. A crooked white scar through the right brow, one back tooth gone, the old ribs - all from three days in Hakvarr's cell. A burn across the right palm from the ember-stone."
condition = "Ribs broken once in the cell and two cracked again Y2 W36 under a Hessa hull, hauling again from Y2 W40. Palms rope-burned from the whale rope (Y2 W50)."
blood = "Son of Karr, who stood against Hakvarr at a Standing eleven winters ago and lost, and drowned six winters back on a run Hakvarr ordered out in weather nobody should have sailed. Nothing provable."
why_he_leads = "He called the expedition a culling in front of two hundred people and gave Hakvarr the reason he had wanted for a decade. Three days in a cell, then the ships. He has killed."
the_oath = "Whose fire is this - mine to keep, never mine to own. Who is at your door - every soul of Haldvik, three nights and three nights and three nights, until I am dead; fire, food, and no weapon drawn. Who is under your hull - all of them, the living and the eight. And when it goes down - I come off it last. Bound over ember, penalty cold-tongue."
by_name = "None yet."

[people.offices]
Jarl = "Erik Karrsson"
Shield = "Halvar Grimsson. Second: Ulf Ivarsson, from Y2 W11."
Reeve = "Vigmar Stenn, who also rations. Apprentice: Aki Arnasson."
Lawspeaker = "Auld Fenn. Apprentice: Tova."
Ember-wife = "Ingra Karrsdis, from Y2 W9. Sits on the council wall in Ranvi's place."
"Second reckoning" = "Sigra Hallvesdis"
heads_of_work = "Sigra (salt and preserving), Hjalti (fishing, and the ice), Ylva (hunt, weir and fowling; second Ossur), Solvi (foraging and shellfish), Ormar (building), Aud (seed and tillage), Brek (smith), Hovard (strand yard), Enna (healer and midwife), Ingra (ember-wife). Aki attends with the reeve."
taught_without_title = "Ulf, by Halvar, evenings, at Ulf's own asking - no name, no oath, nothing cut."

[[people.kin]]
name = "Gest One-Ear"
w = 52
role = "Erik's uncle, brother to Karr. Three wars."
note = "Got Erik out of the cell and will not say what it cost. Splices rope constantly, advises sideways, usually right. Ninety Hessa words; one of the two interpreters with Aki. Planted the idea of lending a shipwright in Vask's head and declared that interest before Erik answered. Reads an absence as evidence - his hole in the Kolvenn count turned the planks into a question. AT KOLVENN WITH INGRA from Y3 W16 until the autumn boat: she keeps me, not the other way."

[[people.kin]]
name = "Ingra Karrsdis"
w = 27
role = "Elder sister, widow. Ember-wife from Y2 W9."
note = "Best head for numbers here; has not raised her voice in two years. SEES THE DOOR, nearer each time. Can LAY a warding (four done under Ranvi) but will not cut a mark she does not understand; the smokehouse first, then a season of watching. Two coals left, and Ranvi said touch neither. Has paid nothing for any of it, which Ranvi could not sleep for. Her ask of Erik: do not be careful with me - what made Ranvi strange was thirty years of nobody sitting beside her. Names her guesses as guesses. Read a live coal for the walker at the jarl's leave (Y3 W6) and did not say stop; her hands came back cold. Wants the jarl beside her at the fire where people can see it. AT KOLVENN FROM Y3 W16 until the autumn boat; the coals stay sealed in Fenn's keeping. Wants a plot on a lane with children going past; Solvi chooses it and keeps it for her."

[[people.kin]]
name = "Solvi Karrsdis"
w = 20
role = "Younger sister. Heads foraging and shellfish."
note = "Asked to lead alone rather than be a favour. Took Kelda into her keeping on three conditions. The most observant person here, and the one who finds the move that takes the jarl out of a thing. Watching Vigmar, on her condition that Erik acts on nothing without looking himself; says she is the worst witness he has. KEEPER OF INGRA'S PLOT until Ingra is home, and chooses it beside her own."

[[people.council]]
name = "Halvar Grimsson"
w = 34
role = "Shield. Best fighter here."
note = "Sworn over ember Y1 W12: may say no once, out loud, on any one matter; it stops the thing and costs him the office. UNSPENT. Promised first pick of land, unsaid until the day - his pick is the plot nearest the gate on the shoulder, where a Shield ought to sleep. Refused the seat and would again. Reads weather well enough that nobody argues, and was wrong once and said so first. Teaches Ulf. Nothing is ever to be built against the wall."

[[people.council]]
name = "Vigmar Stenn"
w = 41
role = "Reeve. Tally, rationing, the law on his stick."
note = "No kin; the only adult who came alone, and nobody sent him - he asked. Stole Skalgrind's old tally-stick out of the roof. Believes this land is the old country and Vardmark the colony, and argues his own century-shaped hole against himself. Weighs every portion in public, checked by Sigra. Argues the other half of his own proposals, on everything but the stones. Reads the archaic marks and will not say the third aloud. Ran the Ivven and Hessa trades faultlessly; the scarred man knows his face. Teaches Tova the old marks in the evenings."

[[people.council]]
name = "Auld Fenn"
w = 69
role = "Lawspeaker and ember-keeper. Priest when it matters."
note = "Half-blind. Told Erik about the ember and got his honour back; owes Erik everything and nobody knows it. Named Haldvik. Will speak the law against Erik in public if ever asked to bend it. Built the jarl-rite out of the ember-oath, the guest-formula and the shipmaster's words. Has kept exactly one thing off the stick and told Erik he noticed. Names what a thing will look like in fifty winters."

[[people.settlement]]
name = "Sigra Hallvesdis"
w = 42
role = "Salt and preserving, second reckoning, head of the largest kin-group (13)."
note = "Had the no-pegging clause cut hardest so it binds whoever comes after her. Worked out the fish-stack. Asks Vigmar how the tally is kept, not just what it says. Argued for a headman, lost, and closed the crack herself: SHE BINDS THE OFFICE, NOT THE MAN. Said Erik's name last at the Standing and added: and I'll hold him to it. Her daughter has been told privately she should not carry again."

[[people.settlement]]
name = "Ulf Ivarsson"
w = 25
role = "Sigra's eldest surviving son. Second to the Shield from Y2 W11."
note = "Big, mild, no enemies. Was two paces from Rekk and could not reach him. Refused the seat four times so his mother's house would not have a hand on the hilt; said yes only when Sigra said in open council her house has no claim on it. Went through the ice Y2 W47 and kept his toes."

[[people.settlement]]
name = "Osvi Crook-leg"
w = 37
role = "Trader and navigator."
note = "Found the channel, the reef and the sounding method that reads a moved bar. Worked out the Needle with Erik and gave it freely. Burned both arms to the elbow in Y1 W15; long healed, but the skin healed tight and he cannot pull an oar, the left least of all. Designs methods that do not need anyone to trust him. Will not mark a channel in the dark or put a loaded hull down a guess. Keeps the Needle's sightings on his own stick, and Aki keeps a second."

[[people.settlement]]
name = "Ormar"
w = 48
role = "Master builder."
note = "Thirty roofs in Skalgrind, never turf and driftwood, and said so first. Found the grey stone band. Owns his errors out loud, the tower footings included; Erik has never absolved him and Ormar knows it. His diagnosis holds: never short of hands, short of throughput. Proves every hole dug before the frost for a fortnight before a post goes in. Has the quern bedstone and not the runner."

[[people.settlement]]
name = "Aud Vessdis"
w = 46
role = "Seed and tillage."
note = "Barley her whole life. A settlement can eat fish for a winter and cannot sow fish. Lost the Y1 barley waiting two days against Halvar's sky and took it on herself; leads with what she got wrong. Fenn's warning stands: not-blaming is not the same as using her - give her something to be right about. Keeps the seed and let nobody else plant the Hessa seed. Made the Y1 Turning ale and calls it an accident. Has a plan for the fields (land_plan)."

[[people.settlement]]
name = "Brek Ironarm"
w = 45
role = "Smith."
note = "Drank, and stopped the day the forge was lit; built it in twelve days. Never served an apprenticeship - Ottar's striker twenty-two winters. Can make a nail, hook, knife or hinge until he dies; CANNOT LOFT A PLATE OR FORGE-WELD A BIG PIECE, and says so first. Names his workarounds and their costs. Paying threefold for the ale in unasked work through the reeve's tally, and told Erik he does not get to stop him."

[[people.settlement]]
name = "Hafli"
w = 18
role = "Smith's apprentice."
note = "Carried the anvil up the beach twice unasked; held the Y1 W23 clamp alone. Found the roasting trick and can smelt a bloom about half the time; keeps his own shaft against the forge wall. Has never seen a real bloomery. Lost the last two fingers of his left hand, his tong hand, Y2 W38; says he will hold it again inside Brek's year. Will be the better smith within three years, and Brek knows it."

[[people.settlement]]
name = "Aki Arnasson"
w = 19
role = "Reeve's apprentice."
note = "Leg healed short and turned: crutch, thirty paces, never a field or an oar - but a hip-high bench in longpit 3. Found a real error in the ration tally and said so; revises targets early and unasked. Invents methods: rod-probing a wall, counting where the stranger can see, two sticks that agree. 120 Hessa words. LEARNING THE ARCHAIC MARKS FROM VIGMAR alongside Tova (behind her); reads the cairn boundary formula, cuts nothing Vigmar has not checked. Made Aki's map. Carves with Erik in the evenings and holds him to a promise from Y1 W38."

[[people.settlement]]
name = "Arna"
w = 41
role = "Aki's mother. Dresses sealskin and reindeer hide, makes combs and the winter suits; teaches four girls."

[[people.settlement]]
name = "Ylva Two-Knife"
w = 20
role = "Heads the hunt and the weir crew from Y2 W11. Second: Ossur."
note = "Named on merit, Halvar's name kept out of it. Found the cairns, the hollow, the reindeer road and the Ivven. Reads a herd better than anyone. A hunt is not a raid on somebody's larder. Her own terms: no surprises - if she wants to go somewhere she was not sent, she stands in front of Erik and asks and wears the answer. Fenced off from a question she has asked six times, she will go alone. Led the Y3 W1 party that traded ten knives for thirty deer. CARRIED THE NEEDLE to its crossing with two (Y3 W15-16): the place, not the thing. Found the black ridge, did not follow the prints, and brought all three home, Kolbein carried the last stretch."

[[people.settlement]]
name = "Hjalti"
w = 39
role = "Heads the fishing and the ice."
note = "Fishing since he was six. Found the winter cod by accident and took it as being robbed. It's a place, not a promise. Would rather admit doubt early than late. Asks for hands, not boats. Keeper of Vardmark sea custom: the net-lay, and the landing."

[[people.settlement]]
name = "Enna Softhand"
w = 39
role = "Midwife and healer."
note = "Opened Aki's leg twice and says she got it wrong the first time. Took Ketil's arm and lost him. Honest about what she cannot fix; watches how people walk. Works a birth for the week before it. Refuses the jarl in open council over a child's growth, and wins. Came off Ottersnout changed in Y1 W10 and has never said why. Hild is her second. Beat the coughing twice. Will say a thing twice, unprompted, when a man is about to carry the wrong guilt."

[[people.settlement]]
name = "Kelda"
w = 13
role = "Orphan, in Solvi's keeping since Y1 W14."
note = "Saw Vigmar with his hand over the infant's face and told Solvi, once. Will not work, sleep or be in a room alone. Good with the dogs, and GRIP is hers (Grip Line is named for it); the small children come to her for the pups. Brings Erik marked pieces off the tideline and keeps it their secret. Knows her letters. Left her own fish on the laid house for the walker (Y3 W11) - whatever stands that long in the cold must be hungry; told the jarl when asked, promised not again. Gathered him fifty-three flat stones."

[[people.settlement]]
name = "Gudny"
w = 31
role = "Widow, three children under seven. Works the drying racks."
note = "Four mouths and no hands on Hakvarr's list, one hand on Vigmar's tally. Voted headman out loud without looking away, then said Erik's name. Learning her marks; beat Aki at tafl. Pride's for people whose children aren't hungry."

[[people.settlement]]
name = "Hild"
w = 23
role = "Enna's second. A living girl, Y2 W30."
note = "Lost her first child in Y1 W10, as far as she knows. Her man digs. Stood at three births without faltering, including the one that killed the mother."

[[people.settlement]]
name = "Ingunn"
w = 21
role = "Bjarn's widow. Mother of Ketil, the first child born in Haldvik, and of Bjarn (Y2 W18)."
note = "Narrow, and everyone knew it. Named the second boy for his father, which nobody expected."

[[people.settlement]]
name = "Ossur"
w = 26
role = "Widower (Y1 W27). Second to Ylva; runs the snares day to day."
note = "Held Thora while she died and has said little since. Dug longpit 3's footings alone for three weeks. Needs a man to stand beside and a thing to be good at. Sleeps in the Keel. Does the decent thing without being asked or explaining, and does not ask for hands. Found the straight tracks at Nagholt; walks that line's snares twice a day."

[[people.settlement]]
name = "Ranulf"
w = 23
role = "Ropemaker."
note = "Spliced the Grey Mare's rigging into 130 paces of doubled hemp in two days, sitting down. Makes rope with the elders and children in the evenings. Gives a number, then takes a sample away for two hours before he will stand behind it."

[[people.settlement]]
name = "Tova"
w = 15
role = "Lawspeaker's apprentice. Grown at the Y2 Turning; votes and may stand."
note = "No kin. A memory like a nail; forty customs word-perfect and argues two of them with Fenn. Asked the milk-kin question before anyone brought it. Learning the archaic marks from Vigmar in the evenings, with Aki: the strokes, the boundary words, the house-names. ONE MARK VIGMAR WILL NOT TEACH HER: not while I am alive, and after that it is yours and Fenn's to decide (Y2 W34). FENN'S RULING: knowing is no crime; saying is worse than oathbreaking; teaching is saying."

[[people.settlement]]
name = "Herdis"
w = 25
role = "Potter. Rough hand-built pots and lids for the store."
note = "Her daughter (Y2 W14) is well and STILL UNNAMED. Walked to Sigrid herself and asked."

[[people.settlement]]
name = "Sigrid"
role = "Of Sigra's kin. Mother of Thora (Y1 W41)."
note = "Feeds both girls; they are milk-sisters, and nobody has asked Fenn out loud what that means in law."

[[people.settlement]]
name = "Runa"
w = 27
role = "Of Sigra's thirteen. A living boy Y2 W27, turned and turned back by Enna; not yet named."

[[people.settlement]]
name = "Leif"
w = 21
role = "Works the Widow's Promise every day with Steinn, since Y2 W24."
note = "Kept turning up at the hull on his own evenings after Bruni's first crew. Three fingertips of his right hand frostbitten Y3 W4 on the headland seal: two kept, and the ring finger's tip taken at the first knuckle (Y3 W9). Called the jarl a kind liar by one fingertip."

[[people.settlement]]
name = "Steinn"
role = "One of Ormar's framers; the Widow's Promise's steam box, with Leif."
note = "Watched Bruni steam strakes for a week and asked Ormar before the jarl did."

[[people.settlement]]
name = "Ilmo"
role = "HESSA of Kolvenn, helmsman of the six driven in by the Y2 W36 gale; lived the winter on the jarl's word; home with Skelva Y3 W15 D5. SWORN A HALDVIKER under law 19, Y3 W17 D2. On Hjalti's boats."
note = "Grey, older, hands like knotted rope. Knows the winter sea better than anyone here; taught the ice, the whale and the seal stalk. We will not sit by your fire and eat your winter for nothing. At Kolvenn the names are said, and a named man who walks home stands at the door as a stranger; the jarl told him once there is a place here if the door stays shut. Lent one of his men as tongue to the Ivven. HIS DOOR STAYED SHUT at Kolvenn (Y3 W16) - his wife took another man after the names; CAME TO HALDVIK WITH THE JARL to become something. Reads the offshore bank better than Hjalti, by Hjalti's own word."

[[people.settlement]]
name = "Oski"
role = "HESSA of Kolvenn, about 25, of Ilmo's six; the leg Enna set. His brother's house said the name is said; came to Haldvik with Ilmo (Y3 W16). SWORN A HALDVIKER under law 19, Y3 W17 D2; stumbled on answered and said it again. On Hjalti's boats."
note = "Broad and quiet; laughs at the back of other people's stories. His leg will ache every winter where the healer can hear him complain, and the jarl told him to ask her how she is."

[[people.settlement]]
name = "Geir"
role = "The man with the crushed hand, permanently weak; one good hand. Named in play Y3 W18 D1."
note = "Off every crew since the thaw, mending nets on an upturned basket outside longpit 1. Brek sent him to the cuttings with Hafli to watch the ground while the boy digs ore, and to come down and say so if a spade hits anything that isn't rust."

[[people.strand]]
name = "Hovard"
w = 36
role = "Runs the strand yard."
note = "Was at the cliff when Aki went over; gentle with the hurt. His wife Bersa and two children stayed in Skalgrind. When Erik said revenge out loud: then you'll want ships. Will not ask men to sleep on a beach in the snow for a building they will not sleep in. Counts the walk."

[[people.strand]]
name = "Torgest Sourmouth"
w = 30
role = "Steers Hald's Coal from this year, off the pans at his own asking."
note = "Lit the Skalgrind lantern himself and complained for five weeks. Given honest credit and never knows where to put it. Spotted the worked timbers. Will not run a loaded hull over an unread bar twice. Sings. Went quiet when his name went unsaid and came round when the jarl sat with him - heard is enough. Would not sell his silence for a road."

[[people.elsewhere]]
name = "Bruni"
w = 21
role = "HESSA, the master boatwright's apprentice at Kolvenn. Here Y1 W34 to Y2 W28; went home by his own choice. Comes back in Y4 with the master for the iron."
note = "Skelva's sister's son. Can caulk, steam and set a strake, shape a rib, cut out rot, build a faering; cannot loft a seagoing hull. Finished the Ottersnout. Taught twenty men to rive. Notices being asked rather than told. Gest's read: in ten years there is a master at Kolvenn who spent a year of his youth here, treated well or badly. THE MASTER PUT THE JARL'S ADZE, HALDVIK, IN HIS HANDS (Y3 W16) - the first tool of his own in twelve years. The jarl called him boatwright."

[[people.elsewhere]]
name = "Tavi"
role = "HESSA of Kolvenn, about twenty. Off a wreck Y2 W25; home Y2 W28."
note = "Will not say what broke the boat, beyond north of Kolvenn. His father's brother makes nets with Bruni's mother."

[[people.elsewhere]]
name = "the silent man"
role = "HESSA of Kolvenn, about fifty. Off the same wreck; the jarl's charge by Fenn's ruling; home Y2 W28."
note = "Never said a word to anybody. Sat against the washhouse wall facing the sea."

[[people.elsewhere]]
name = "Jarl Hakvarr Ormsson"
role = "Skalgrind, five weeks of open water. Called a culling a settling expedition. Wanted the Karrssons gone for a decade. Does not know whether anyone is alive."

[[people.elsewhere]]
name = "Bersa"
role = "Hovard's wife, in Skalgrind with two small children."

[[people.elsewhere]]
name = "Skelva"
role = "HESSA, about thirty, Vask's kin. Led the Y1 W34 and Y2 W22 ships. About 400 Vardmark words."
note = "The best ear for a strange tongue her people have. Would not trade on her own authority - not me, him. Gives away her reasoning once given the same courtesy. Wipes the cairn mark away with the heel of her hand without noticing. Came Y3 W15 with her hair cropped for a death in her house; said at the landing she had said Ilmo's name at the Turning. Will not talk of the stones in a house or at night, nor of the old people at all: I am not the one who knows these things. The other woman in the room Ingra saw in a cooking fire."

[[people.elsewhere]]
name = "Aili"
role = "HESSA of Kolvenn, young. Has the craft. The woman Ingra saw in a fire, and the reason she goes north."
note = "Drew Ingra aside and said what she had to in few words. The Hessa do not talk about these things."

[[people.elsewhere]]
name = "Vask"
role = "Runs Kolvenn, about fifty. Cautious, slow, not a fool. Sends kin rather than come himself."

[[people.elsewhere]]
name = "Atti"
role = "Hessa boy of about fourteen. White teeth, no bleeding at the gum. Laughed out loud when the counting matched."

[[people.elsewhere]]
name = "the scarred man"
role = "IVVEN. About forty-five, split lip badly healed, a red-dyed band at the collar, forty Hessa words. Their tongue to the outside."
note = "Asked for repetition before a price. Understood a counted stick in four heartbeats and kept it. Will not go under a roof. Traded thirty deer for ten knives in Y3 W2 - three a knife, meat dearer than skins in winter - and brought them on his own dogs to a pace short of the moor edge. Came unasked in Y3 W6 with meat before Haldvik had to ask, and took eight used knives for twenty-four deer. Keeps Vigmar's counted stick in his coat. CARRIES THE JARL'S OWN KNIFE. Knows the jarl's face."

[people.dead]
list = [
  "Kolli - over the side of the Widow's Promise in a squall, Y1 W8. Not found.",
  "Ref - the same squall, Y1 W8. Not found.",
  "Hoskuld, 66 - the boatwright. Did not wake on the Grey Mare, Y1 W9. He had taught nobody.",
  "An old woman - the coughing, Y1 W10. Tova's grandmother.",
  "Hild's infant son - Y1 W10, smothered by Vigmar; four people know, and none of them is Hild.",
  "Rekk Ivarsson, 17 - drowned under a bull seal at the reef, Y1 W11 d7, in water knee-deep.",
  "Ketil, 24 - seal-bitten at the reef; died Y1 W12 d3 when Enna took the arm.",
  "Halli the Elder, 71 - the coughing, Y1 W13.",
  "Thora - Bjarn's sister, Ossur's wife. Eleven hours in childbed, the child turned, the bleeding after. Y1 W27 d7.",
  "Thora's son - born dead Y1 W27 d6.",
  "Bjarn, 22 - Ingunn's man. Drowned Y1 W35 when Hjalti's boat went over, the only one of five lost.",
  "Groa, about 70 - her heart, Y1 W49. Buried through forty centimetres of ice.",
  "Ranvi Ashwife, 59 - ember-wife. Spent her fourth coal unasked Y2 W9 and it cost her sight and hours. Sea-buried Y2 W9 d7; Fenn held a live coal over the water till it went out: hers went back, that is all that is, don't make more of it.",
  "Torbrand, 29 - head of the hunt, best bow here. Off the tower frame Y2 W10; died Y2 W11 d7. His last word was a correction: two hundred snares, and walk the line twice.",
