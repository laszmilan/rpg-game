  "Ref - over the side of the Widow's Promise in the same squall, Y1 W8. Not found.",
  "Hoskuld, 66 - the boatwright. Did not wake on the Grey Mare, Y1 W9. On Hakvarr's list because his hands had gone. HE HAD TAUGHT NOBODY.",
  "an old woman - the coughing, Y1 W10. Tova's grandmother.",
  "Hild's infant son - Y1 W10, smothered by Vigmar, which four people know and none of them are Hild.",
  "Rekk Ivarsson, 17 - drowned under a bull seal at the reef Y1 W11 d7, in water no deeper than a knee.",
  "Ketil, 24 - seal-bitten at the reef, died Y1 W12 d3 when Enna took the arm. No kin on these ships; the settlement buried him.",
  "Halli the Elder, 71 - the coughing, Y1 W13 d2. No kin either.",
  "Thora - Bjarn's sister, Ossur's wife. Eleven hours in childbed, the child turned wrong, both doses of henbane spent, and the bleeding after. Died before dawn Y1 W27 d7.",
  "Thora's son - born dead Y1 W27 d6.",
  "Bjarn, 22 - Ingunn's man. Drowned Y1 W35 d5 when Hjalti's boat went over four hundred paces off the beach, the only one of five lost.",
  "Groa, about 70 - her heart, Y1 W49. Buried through forty centimetres of ice cut by sixteen men over most of a day.",
  "Ranvi Ashwife, 59 - EMBER-WIFE. Spent her fourth coal unasked on Y2 W9 d6 on the question Erik released her from, and it cost the last of her sight and some hours off the end and she knew it. Sea-buried Y2 W9 d7, and Fenn carried a live coal down the sand and held it over the water until it went out: HERS WENT BACK, THAT IS ALL THAT IS, DON'T MAKE MORE OF IT.",
  "Torbrand, 29 - head of the hunt and the weir crew, Shield's apprentice from Y1 W27, best bow in Haldvik. Off the tower frame Y2 W10 d5 when a footing walked; four ribs, the arm twice, the hip driven. The chest filled over twelve days and he went before dawn Y2 W11 d7. HE NEVER CAUGHT THE COUGHING. His last word was a correction: three hundred snares was too many, make it two hundred and walk the line twice.",
]
