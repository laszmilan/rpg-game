resident_strangers = "None. The Kolvenn hull went home W30 d4."
away = "Nobody. The faering came home W30 d3 with Halvar, his three oarsmen, Ingra and Gest."
born_here = "Nine. Three to women who were carrying at the landing, all delivered in Y1. Then KETIL Bjarnsson Y1 W20; THORA, daughter of Sigrid, Y1 W41; HERDIS'S DAUGHTER Y2 W14, still unnamed; BJARN, son of Ingunn and of Bjarn who drowned before he was born, Y2 W18; RUNA'S SON Y2 W27, not yet named; HILD'S DAUGHTER Y2 W30 d6."
the_reconciliation = "108 sailed, 14 dead, 9 born here. That is 103, and all of them Haldvik's own. All of them home."

[food]
in_store_kg = 5590
what_it_is = "Dried and smoked fish and seal are the bulk. Then about 500 kg of salted whale meat and 150 kg smoked, about 1,050 kg of W25 eggs in ash, birds, greens and berries and seaweed and sprouted grain, rendered fat, ABOUT 400 KG OF SALTED SEAL off the W30 cull, about 680 l seal oil and ABOUT 350 L OF WHALE OIL, AND MILK from the cow that calved. And from the W22 trade: 300 kg six-row barley, 200 kg dried peas, 80 kg rendered fat."
sealed_and_not_food = "150 kg of the W22 barley held back as seed and Aud has it, AND VASK'S 30 KG given W30 d3. THE JARL HOLDS 200 KG OF BARLEY SEED (W30 d7) - 180 in hand and twenty more off the harvest. 40 kg Hessa peas, 60 kg Haldvik peas. SEED. Eating it is theft from the colony, said by the jarl in those words."
ale = "None."
the_ration = "FULL, from Y2 W11 d1, cut on the stick as the jarl's word and not the reeve's arithmetic. About 465 a week at 103 souls, two of them at the breast. Weighed in public by Vigmar, checked by Sigra. Vigmar's condition, granted: the day it goes back down is named when it comes, not left to drift."
the_target = "FIFTEEN THOUSAND KILOS BY FIRST FROST. Aki's breakdown: cod five, salmon two and a half with the weir standing and twelve hands, seal two, birds and eggs three, everything else two. Fifteen and a half, and every line assumes nothing goes wrong. IT IS NOT THE FISH, IT IS THE HANDS."

[resources]
salt = "ABOUT 100 KG at W31 d1, after about 80 kg into the seal and some into the salmon. THE THREE STRAND PANS BURN DAY AND NIGHT from W29 d3 with ten on the strand - about 18 kg a day at best. Salting takes about 100 kg per 500 of fish, so the salmon peak goes to fresh eating and the smokehouse first."
charcoal = "About 350 kg with a clamp burning, plus about 50 kg lifted off the Nagholt floor. TARGET 1000 BY FROST - three more clamps - and the forge then runs all winter down to 200, which has never been done here because they were always too poor in coal to burn it when nobody was watching."
peat = "About 200 m3 once dry: 95 dry and stacked, about 35 of last year's sound and drying, and about 70 cut in W21, the walls restacked loose and open in W23. RECKONED ENOUGH in W23 on last winter's burn, and no more cutting planned. The danger is wet, not quantity - it must be dry before the autumn rains at about W33."
iron = "About 10 kg of bar. PLUS 3-4 kg of corroded lumps off the Nagholt floor, of which Brek reckons half comes back under the hammer, so call it 2 kg usable. PLUS one fist-sized bloom of Hafli's. PLUS TWO CRACKED SAW PLATES, which are better hard steel than anything in the bar. THE Y4 BOATWRIGHT PRICE IS 25 KG OF WORKED IRON, which wants about 33 kg of bar. IT CANNOT BE PAID OUT OF WHAT EXISTS."
hooks = "About 700, enough for four long-lines, after a hundred went to the Ivven in W24."
"rivets and nails" = "A keg of each."
"rope and line" = "Eight coils of ship's rigging, plus the Grey Mare's standing rigging spliced into 130 paces of doubled and served hemp - THE CLIFF LINE. Sixty paces of sealskin-and-bast spare. There is no cordage on this coast and 400 paces are coming at Y3 W14."
"hides and cloth" = "41 sealskins, ten of them off the W30 cull, fifteen sets dressed by Arna. Six bolts of wool. Almost no linen. AND FORTY-FOUR REINDEER HIDES - fourteen from Y2 W15, two of them white, and thirty traded W24 d5 at the standing rate - hollow-haired, warmer than sealskin at a third the weight. Nine bundles of dried sinew: bowstring, and thread that does not rot. Two folded pieces of hide worked so thin and soft they hang like cloth, which nobody here can yet reproduce."
barrels = "Five ships' casks, two coopered Hessa kegs from Y1, and four more kegs and two barrels traded W22, and TWO MORE KEGS given by Vask W30 d3. THE VESSEL PROBLEM IS MORE THAN HALVED. They want scalding, ash lye, rinsing and scalding again over three days before use."
"lamp oil" = "A third of a cask, plus the seal oil and the whale oil."
"birch tar" = "About 2 litres from the Ivven, AND A SMALL BARREL given by Vask W30 d3. Glue, waterproofing, seam-sealing. Kolvenn has barrels of it and Haldvik has five casks that leak and three hulls on a beach."
hardwood = "Twelve squared lengths and two stem-knees traded W22, on top of six lengths and one knee given in Y1. It is two-metre stock and will not make a long post."
tools = "THREE IVVEN KNIVES held back by Vigmar for the next visit. Anvil and full smith's kit. Six axes, four adzes, three augers, nine spades, and IRON WEDGES. Gear for three boats and two nets. AND A REINDEER-BONE HIDE SCRAPER, given with the Ivven hides on purpose, because you do not give a man skins and no way to work them."
arms = "19 spears, 11 axes, 4 swords, 22 shields, 6 mail, 9 helms, 5 bows. Fourteen men who have been in a real fight. NO DEFENCE BUILT."
boats = "Ottersnout and Widow's Promise on the sand in the bay, seagoing hulls and not fishing boats; the Ottersnout is sound again and the Widow's Promise is in hand. The Grey Mare is the Keel. Two ship's boats work the lines, tide-limited by the bar, and one of them is just back off a two-week repair. Hald's Coal at the strand. One faering, home from Kolvenn W30 d3. AND THE HESSA WRECK on the sand, W25 d3: faering-sized, mast gone, two starboard strakes torn off the frames."
missing = "NO SAW AT ALL AND NO WAY TO MAKE ONE. No cooperage. No quern yet - Ormar has the bedstone, not the runner. No plough, though there are two ploughshares and nothing to pull them. No kiln. No boatwright who can loft a hull."

