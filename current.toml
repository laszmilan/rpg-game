# Haldvik - current. The present state; update every week. Player-readable.

_ = "THE PRESENT, AND ONLY THE PRESENT. What is true or owed now, brought up to date every week. Nothing dated, nothing historical - that is log.toml. People are in people.toml; the laws and treaties in laws_and_treaties.toml; the world, rules and standing practice in readme.toml. Player-readable."
date = { year = 2, week = 22, day = 7, season = "summer" }
morale = 7
mood = "Fat and unsettled at once. The store is 2440 and climbing two hundred a week, there is grain and cordage coming and milk for the first time ever, and thirty people watched the jarl stand in a five-hundred-year-old doorway and say this is our motherland. And a Hessa hull touched the bar in front of everybody, and Skelva sailed an hour early with her hand still wiping the sand, and the ember-wife and the interpreter are four days north until week twenty-nine."
where_people_sleep = "Thirty-four to a pit in longpits 1, 2 and 3, twenty in the Keel under the Grey Mare, and nobody outside. Byre against longpit 2's east gable and the warm end is fought over in jokes."
clocks = [
  "W23 - the tower goes up, posts into holes Ormar proved for a fortnight.",
  "W24 - SECOND HAY CUT, and it may want W24 and W26 both.",
  "W24-25 - eggs fresh from W24, cliff trips from W25. Early is worth about double. AND IT IS THE MOST DANGEROUS WORK HALDVIK DOES: undercut rock, a man hanging free with the cliff leaning over him, loose basalt at the lip, birds coming off a ledge into a face, and tired men late in a run.",
  "W27 - Runa delivers. Two in the room.",
  "to about W28 - the peat cutting window. 120-150 m3 wanted, about 70 cut, and it must dry before the rains at W33.",
  "W28 - the faering goes north for Ingra and Gest.",
  "W28-34 - the salmon run. Twelve hands through the peak is worth nearly double six, and it falls in the same three weeks as the cull.",
  "W29 - Ingra and Gest home.",
  "W30 - the seal cull, bulls only, from seaward, ONE MORNING ONLY. AND HILD DELIVERS.",
  "W33 - autumn equinox and the autumn spates, the only weeks besides spring when the river floats a stick.",
  "W34 - Bruni's year is up and nobody has been apprenticed to him.",
  "W36 - after this nobody sails.",
  "W38 - first frost. FIFTEEN THOUSAND KILOS wanted. Store 2440.",
  "by frost - 1000 kg of charcoal banked, three more clamps.",
  "Y3 W14 - the Hessa, with cordage and wood, and a new deal cut as one.",
  "Y4 W14 to W39 - THE MASTER AND BRUNI, for 25 kg of worked iron, which does not exist and cannot be made without a bloomery.",
]

