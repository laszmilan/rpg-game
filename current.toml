pigs = "None. No pigs unless got from the Hessa."
chickens = "13 hens in a basket by longpit 2's hearth, laying better for it. No cock."
dogs = 3
in_the_byre = "Seventeen head in twenty-seven stalls, gaps stuffed with peat; three cuts of hay carry them. Kept for next year's births - both rams, every hen - and not eaten, by the jarl's word in open council (Y3 W1)."

[health]
carrying = "One woman, whom Enna will not name until she shows by midsummer; DUE ABOUT THE HARVEST. Runa's boy and Hild's girl well."
standing = "THE JARL: ribs mended enough to haul; palms rope-burned from the whale; THREE FINGERTIPS OF THE RIGHT HAND BURNED on a live coal (W6 D6), scabbed over. INGRA: both hands frost-white to the wrist from a reading (W6 D6); whole, nothing lost, but COLD TO THE TOUCH since - Enna has never seen frost do that; Ingra says it was the frost. HAFLI: last two fingers of the left hand gone, the stumps closed; right hand only until Enna says. LEIF: frostbite W4 - two fingertips kept, nails coming off; THE RING FINGER'S TIP TAKEN AT THE FIRST KNUCKLE (W9), healing clean; back at the steam box. ULF: back on his feet, toes kept. ONE HESSA LEG knitted. Sigra's daughter mending, told not to carry again. The two Ivven-trip haulers' frost-nip peeling. One crushed hand permanently weak; one strand man with a mended jaw."
henbane = "ABOUT ONE DOSE LEFT after the Ivven boy's leg (W12), which took two. The seed goes in the herb strip this spring; another wild patch to be sought in summer. Willow bark tea as well, bitter and plentiful."
ennas_five = "Bedding enough to throw out and replace twice; greens and pine tea twice a week; latrines downstream, used in the dark, no exceptions; combs and hot water; roof vents. Lye handwashing at every door by law, and soap."

[work]
_ = "Winter. The strand is shut and the ground frozen; food and upkeep first."
the_ice = "Hjalti's: he picks the twelve with Ilmo, and the working portion follows his word. Six roped pairs under Ilmo's five, an axe to test every step. The pole net for flatfish, harpoons at seal holes, basking seal stalked. About 60 store kg a week when the ice can be worked every day; nothing in a gale."
foraging = "Solvi's ten on the tide rocks - seaweed, shellfish, moss boiled twice, pine inner bark - fills more than feeds. Ylva and Ossur snare the ground to the edge; Ossur walks the upper line and the Nagholt tracks twice a day."
indoor = "The Hessa tongue every evening at the back of longpit 1. Arna's reindeer suits. Ranulf's rope. Aki's map under the reeve's beam, never copied. Vigmar teaching Tova the old marks. The forge as Brek likes, Hafli one-handed."
watch = "Two on the tower every night; in the worst cold, changed every hour. One short blast means come and look (horn signals in laws_and_treaties)."
peat_and_fire = "The peat walls walked every D1 and after rain. The drowned fire ring walked every morning with a bare palm."

[build_plan]
constraint = "Hands, not materials. 108 sticks on the terrace; about 130 man-days of stone quarried."

[[build_plan.queue]]
what = "LONGPIT 4"
needs = "About 250-300 more man-days, two thirds walls and roof turf, then framing. Sticks and stone exist."
target = "Spring to summer, about three weeks of twenty hands in dry weather, after the forty-two holes are proved at the thaw."
why = "Thirty-four to a pit. It becomes the ward and washhouse when people move to homes."

[[build_plan.queue]]
what = "THE FORGE"
needs = "About 30 sticks and a season of grey band stone, built against the quarry's cut face."
target = "After longpit 4."
why = "Tools and bar. Lockable - the only building worth robbing besides the storehouse, and it has no door."

[[build_plan.queue]]
what = "THE BLOOMERY"
needs = "A stone-and-clay stack a man's height with a slag tap-hole, four on the bellows in shifts, two digging ore, one roasting - and one burn is one whole charcoal clamp."
target = "Undecided."
why = "Nothing else can pay the Y4 iron. Brek and Hafli have never seen one."

[[build_plan.queue]]
what = "THE GREY MARE"
needs = "Twenty people out of the Keel, then cordage, then a hull rebuild."
target = "Cordage Y3 W14, boatwrights Y4."
why = "Erik swore at the burial ground she will sail again before he joins his father."

[land_plan]
_ = "Laws 6-9: private ground, no pegging, survey and settlement first, the jarl allots in spring. Talked at council every D1 in the open; measured when the snow gives, late spring probably."
kept_for_haldvik = "Vigmar's list: the beach and the terrace edge, the burial stones, the weir and the river mouth, the four springs, the tower's ground, the grey stone band, the peat cuttings (every hearth, and Nagholt under them)."
homes = "Given by hearth, sized by head. Thirty-eight hearths now: fourteen couples, nine widowed with children, fifteen who came alone. Plots measured for hearths not yet made. Cut, and proof given, as people have time and means."
blocks = "Blocks of four to six homes, each about 10 x 20 m, built in the middle along shared walls with 5 m of garden round; blocks 3 m apart. Ormar: turf walls do not burn, roofs do - lanes kept clear, a water butt at each block end, gaps along the wind. Aki: 38 hearths in blocks of six is seven blocks and four spare, about a hectare."
streets = "GATE ROAD, 5 m, straight from the beach up through the terrace to the gate. Lanes east-west about every 25 m, blocks between, end-on to the westerlies. From the shore up: SALT LINE (the beach), IRON LINE (the terrace and forge), then up the shoulder WHALE, GRIP, EGG (the fermenting and ash egg pits and the peat), MARKET, BARLEY, and WALL LINE, 5 m, about 150 m up, a bare lane just inside the wall with the wall a little further out. NOTHING BUILT AGAINST THE WALL, EVER (Halvar). Not named for the dead or the ships."
proof = "Drawn on the map in spring before anything is built: every road named, every plot numbered, every hearth a plot. Two sticks per plot, the hearth's and Haldvik's, and a copy kept elsewhere. Plain unmarked stones at the corners."
waste = "Enna: never into the harbour. Latrines and waste below the weir or out past the rocks, downstream of everything eaten or drunk."
the_longpits = "When people move out: LONGPIT 1 THE GREAT HALL; LONGPITS 2 AND 3 barracks and homes for those who will not build, and guests; LONGPIT 4 THE WARD AND WASHHOUSE, two halves walled apart with a door at each end, and the present ward comes down. Ranvi's lean-to, the peat walls and the fermenting pits move up to the shoulder."
fields = "THE FIRST LAND CLAIMED IN SPRING, common for years yet, Aud to site them. TARGET next harvest: 300 KG BARLEY AND 300 KG PEAS IN STORE beyond the seed. AUD'S PLAN: a ditch across the top of the first field to catch the shoulder's water and one down the side to the river; strips raised a spade high; seaweed off the beach for dung; the ground where the stone band breaks the westerly, facing south; dug the week the spade goes in, ditches first, sown the moment it dries and not a day later. A HERB AND SPICE GARDEN wanted - a strip by the ward, Enna's and Solvi's, not yet put to them."
the_walls = "The jarl's four, for many years from now: (1) a ditch and bank across the terrace, a summer for thirty men; (2) about 470 m round the shoulder, a half circle 150 m out, about 3.5 ha inside; (3) about 300 m between terrace and shoulder against the wind; (4) a wall at the shore. Halvar: give land inside the line the wall will take, and walk it with him in spring."
the_forge_site = "Against the quarry's cut face at the back of the terrace, earth banked on two sides; a hood for the smoke; the bloomery outside against the wall, never under a roof; nothing within 10 m. Brek tells Ormar what is wrong before it is built."
terrace = "No house plots on the terrace; the old and lame live in the longpits or the hall."
spring_order = "Ormar: longpit 4 first, then the forge, then one block staked at the gate end - most likely only cut, not built, in Y3."
promises = "HALVAR has first pick: the plot nearest the gate on the shoulder. Who goes next, and whether people choose or are given, is open."

[ground]
_ = "Haldvik's ground by zone. Updated whenever something is built, moved or cut."

[ground.the_bay_and_beach]
the_ground = "A barred bay, the withied channel moving with every gale; a sand beach below the terrace; the salmon river at the head; the seal reef under the north shoulder; the north headland beyond. Iced from the head to the bar since W46, sound nearly to the bar now."
built = "The drying racks and Sigra's stack, the smokehouse, the forge, the Keel, the boats hauled up, the low bar-mark post, the weir. The burial ground - fourteen stones in the shallows."
"the smokehouse" = "Double size, about 500 kg a week; the catch is the ceiling. Ingra's first warding goes here, then a season of watching."
"the forge" = "Stone and turf, sealskin bellows, anvil and kit. No door and no lock. Hafli's smelting shaft against the wall."
"the Keel" = "The Grey Mare upside down over a metre-deep pit, turf to the keel, skins over her back, a stern door. Holds twenty, warmer than longpit 1."
"the channel" = "The bar marks on Skelva's method: an in-line from a low post on the shingle to a high one on the terrace edge, and a turning pair on the north shoulder. Re-sounded after every blow, and the back post moved."

[ground.the_terrace]
the_ground = "About 300 m along the bay and 40 m deep, about 1.2 ha - the only flat, dry, sheltered ground. The grey stone band at its back; the wet south end floods."
built = "Longpits 1-3, longpit 4's footings, the storehouse, the washhouse and ward, the byre, the tower, Ranvi's lean-to, the peat walls, the three fermenting pits, the high bar-mark post. About a third of it."
free = "About 0.8 ha - the wet south end and the strip along the edge."
"the tower" = "22 sticks on four proven holes, hooded, the night post, a horn on the platform. Sees past the north headland and over the shoulder to the moor edge."
"longpit 1" = "12 x 8 m aisled, turf and stone, driftwood frame. The main hearth; everyone passes through it."
"longpit 2" = "Same build. The byre against its east gable; the hens by its hearth."
"longpit 3" = "12 x 8 m. Aki's bench, Vigmar's corner and the lesson board. The clean room."
"longpit 4" = "Forty-two holes proved and dry: thirty-four at the thaw and the eight of the east row dug again a pace upslope (W11), clear of the spring. Framing from W12: both rows of posts, the wall-plates and the first tie-beams, about 100 of 250-300 man-days; the jarl, Ormar and five on it since the cod. Two halves walled apart, a door at each end: the future ward and washhouse."
storehouse = "10 x 10 m dressed stone, the whole sealed store, a door and the reeve's beam. Nobody sleeps in it. The map, the tusks and the seed under the beam."
"washhouse and ward" = "One building, a wall between, a door at each end, one hearth in the middle wall. Enna's design."
"the byre" = "27 stalls against longpit 2. Peat litter doubles the dung heap."
"Ranvi's lean-to" = "The old birth-house; births go to the ward now."

[ground.the_shoulder]
the_ground = "The slope above the terrace to the moor edge about 4 km out: turf, grazing, peat two spades deep, the barley ground, the stone band at its foot. Haldvik's to the moor edge by law 17. The planned village and walls are here."
built = "The two fields and kitchen crops, the peat cuttings, the fire ring, the quarry, the turning pair of bar marks. Nothing lived in."
"the fields" = "Two, sown sixteen days apart. The lower third of the first floods. Kale stands through the frost."
"the peat cuttings" = "Where the bog ore is, and where Nagholt lies - a burned house 24 m long under 60 cm of peat, traced by rod and recorded on three sticks in different buildings. REOPENED AND CLOSED Y3 W6 D5 under law 18: the bones, the charcoal and the door post laid on its own floor; no mark on the ground. The post's marks are on three sticks (Vigmar, Vigmar, Tova). THE STRAIGHT TRACKS STOOD HERE (Y3 W1). Every peat face opened is a dig."
"the fire ring" = "A 45 x 30 m trench round the underground peat fire, drowned Y2 W26 and cold since. Walked every morning."
grazing = "Sheep, goats, the cow. Ylva's reindeer ground and Aud's barley ground are the same field and nobody has settled it. The Ivven have not agreed law 17; they deliver to the edge and not a step over."

[ground.the_strand]
the_ground = "Five km south-west: two km of shingle under a wooded shoulder, springs, the driftwood windrow of about three hundred sound trunks. The sea comes over its low end in a gale."
built = "Three salt pans (one cracked), the charcoal clamp ground, Hald's Coal laid up."
status = "Shut for the winter. Opens again next year with the men rotated, Hovard keeping the beach."
