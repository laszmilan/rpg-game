heifer_calf = 1
pigs = "None. No pigs unless got from the Hessa."
chickens = "13 hens in a basket by longpit 2's hearth, laying better for it. No cock."
dogs = 3
kept = "Seventeen head, grazing the shoulder in summer; the byre's twenty-seven stalls in winter, gaps stuffed with peat. Kept for next year's births - both rams, every hen - and not eaten, by the jarl's word in open council (Y3 W1)."

[health]
carrying = "One woman, whom Enna will not name until she shows by midsummer; DUE ABOUT THE HARVEST. Runa's boy and Hild's girl well."
standing = "KOLBEIN: a knee wrenched in a bog hole on the high moor (W16), off his feet. ENNA: out of the ward after her week apart for the Ivven fever (to W17 D4); nobody in Haldvik caught it. THE JARL: ribs mended enough to haul; palms rope-burned from the whale; THREE FINGERTIPS OF THE RIGHT HAND BURNED on a live coal (W6 D6), scabbed over. INGRA: both hands frost-white to the wrist from a reading (W6 D6); whole, nothing lost, but COLD TO THE TOUCH since - Enna has never seen frost do that; Ingra says it was the frost. HAFLI: last two fingers of the left hand gone, the stumps closed; right hand only until Enna says. LEIF: frostbite W4 - two fingertips kept, nails coming off; THE RING FINGER'S TIP TAKEN AT THE FIRST KNUCKLE (W9), healing clean; back at the steam box. ULF: back on his feet, toes kept. ONE HESSA LEG knitted. Sigra's daughter mending, told not to carry again. The two Ivven-trip haulers' frost-nip peeling. One crushed hand permanently weak; one strand man with a mended jaw."
henbane = "ABOUT ONE DOSE LEFT after the Ivven boy's leg (W12), which took two. The seed goes in the herb strip this spring; another wild patch to be sought in summer. Willow bark tea as well, bitter and plentiful."
ennas_five = "Bedding enough to throw out and replace twice; greens and pine tea twice a week; latrines downstream, used in the dark, no exceptions; combs and hot water; roof vents. Lye handwashing at every door by law, and soap."

[work]
_ = "Summer. The cod first while it lasts (thinning from W18); the ceiling is salt, smoke and racks, not fish."
the_cod = "Hjalti's boats every workable day on the offshore bank; Sigra runs the beach - gutting lines, livers in a crock, split fish on every rack, salting while the salt lasts, the smokehouse day and night."
longpit_4 = "About 220 of 250-300 man-days done (W17 end): walls up all round, roof turf begun. FROM W17 FOURTEEN ON IT (Ormar's six, the jarl, seven off the fishing): walls and roof turf, one crew cutting and one laying. Then the build_plan queue in order: the smoke tunnel, the fermenting pits, the forge."
hands_W17 = "Set Y3 W17 D2: LONGPIT 4 (Ormar) 14 with the jarl; BOATS (Hjalti) 12 with Ilmo and Oski; BEACH - gutting, racks, smokehouse (Sigra) 9; STRAND (Hovard) 8 with Torgest; FORAGING (Solvi) 6 + 4 children; STORE, TALLY, LAW, BAR (Vigmar) 5 - Vigmar, Aki, Fenn, Tova, Osvi; CRAFTS - rope, hides, pots (Ranulf, Arna, Herdis) 5 + 2 children; HUNT, SNARES, WEIR (Ylva) 3; FIELDS AND HERB STRIP (Aud) 3; FORGE 2; WIDOW'S PROMISE 2; HEALING 2; SHIELD 1; BYRE 2 children. 72 on crews and 8 children. NOT ON A CREW 9: the five nursing (they mind the smallest for everyone), Kolbein, the crushed hand, two of the very old. Away 2. The night watch two a night from the crews, never the boats' morning men; Ilmo and Oski off it."
ilmo_and_oski = "ILMO AND OSKI, sworn Haldvikers (W17 D2), on Hjalti's boats; inside at night and off the watch (the jarl, W17 D1). Kolvenn boats fishing the coast will put in to see Ilmo, and Haldvik feeds them."
the_strand = "Hovard's eight: three pans on peat, the clamps; every kilo of salt goes up to Sigra."
foraging = "Solvi's ten on the tide rocks - seaweed, shellfish, moss boiled twice, pine inner bark - fills more than feeds. Ylva and Ossur snare the ground to the edge; Ossur walks the upper line and the Nagholt tracks twice a day."
indoor = "Arna's reindeer suits. Ranulf's rope. Aki's map under the reeve's beam, never copied. Vigmar teaching Tova and Aki the old marks. The forge as Brek likes, Hafli one-handed."
watch = "Two on the tower every night; in the worst cold, changed every hour. HALVAR'S ORDER (W17 D1, the jarl agreeing): NOTHING THROWN AT THE WALKER; harm it only if it harms us. One short blast means come and look (horn signals in notes.toml [laws])."
peat_and_fire = "The peat walls walked every D1 and after rain. The drowned fire ring walked every morning with a bare palm."

[build_plan]
constraint = "STICKS (Ormar Y3 W8, corrected W17): 108 on the terrace, longpit 4 takes about 70, ABOUT 38 LEFT; THE SMOKE TUNNEL takes about 13 (W17 D4), leaving 25 for a forge that wants 30 - 5 short. STRAND LOGS TO BE RIVEN before the forge (the jarl: will find the logs) - hauled 5 km, about 26 a week with twenty men. The Hessa hardwood is kept for boats and the Y4 boatwrights. About 130 man-days of stone quarried."

[[build_plan.queue]]
what = "LONGPIT 4"
needs = "About 220 of 250-300 man-days done (W17 end): walls up all round, roof turf going on. Sticks and stone exist."
target = "Now: fourteen on it from W17 (Ormar's six, the jarl, seven off the fishing)."
why = "Thirty-four to a pit. It becomes the ward and washhouse when people move to homes."

[[build_plan.queue]]
what = "THE SMOKE TUNNEL AND TWO SMOKE-HOUSES"
needs = "The jarl's design (W17 D4): a fire pit low on the slope beside the terrace, a stone-lined trench of grey band stone running uphill with one branch, and TWO small turf smoke-houses 3 x 4 m at the top (changed from three), three tiers of rods each. About 13 sticks and about 45 man-days."
target = "After longpit 4."
why = "About 300 kg of split fish a house at once, three days a hanging - the two together match the old smokehouse; cool smoke, nothing near the fire to burn."

[[build_plan.queue]]
what = "THE FERMENTING PITS"
needs = "Where and how Sigra says: deep, by a spring, birch bark, stones, a handful of salt a fish. Done wrong it kills a house; only Sigra has done it."
target = "After the smoke-houses, before the salmon (W29-33)."
why = "The salmon surplus. And ONE BARREL OF FISH IN WHEY, because the jarl wants to taste it before he dies (whey enough for a barrel or two only)."

[[build_plan.queue]]
what = "THE FORGE"
needs = "About 30 sticks (25 in hand after the smoke tunnel) and a season of grey band stone, built against the quarry's cut face."
target = "After the smoke-houses and the pits. Where and how at council W18 D1."
why = "Tools and bar. Lockable - the only building worth robbing besides the storehouse, and it has no door."

[[build_plan.queue]]
what = "THE BLOOMERY"
needs = "A stone-and-clay stack a man's height with a slag tap-hole. EVERY BURN SEVEN PEOPLE FOR THREE DAYS (Brek, W17): four on the bellows in shifts, two digging ore, one roasting - and one burn is one whole charcoal clamp."
target = "BESIDE THE SMOKEHOUSE, not behind the forge (Brek, W17); up by midsummer with a clamp to burn, so iron is out of it before the autumn boat. Where and how at council W18 D1."
why = "Nothing else can pay the Y4 iron, and the autumn boat is told whether iron has come out of it. Brek and Hafli have never seen one."

[[build_plan.queue]]
what = "THE GREY MARE"
needs = "Twenty people out of the Keel, then a hull rebuild. THE CORDAGE CAME Y3 W15 (Ranulf's 400 paces for her standing and running rigging)."
target = "The boatwrights, Y4."
why = "Erik swore at the burial ground she will sail again before he joins his father."
