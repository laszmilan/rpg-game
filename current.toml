# Haldvik - current. The present state; update every week. Player-readable.

_ = "THE PRESENT, AND ONLY THE PRESENT. What is true or owed now, brought up to date every week. Nothing dated, nothing historical - that is log.toml. People are in people.toml; the laws and treaties in laws_and_treaties.toml; the world, rules and standing practice in readme.toml. Player-readable."
date = { year = 2, week = 31, day = 1, season = "autumn" }
morale = 8
mood = "Full boats and a full ward. Ingra and Gest are home with Halvar's crew and a Kolvenn hull came with them bearing thanks. Hild has a girl, quick and clean, and the henbane stayed in the bag. Ten bulls came off the reef with nobody hurt. The salmon peak is on and the store is 5590. Salt is still the thing everyone counts, and the barley is the thing Aud is watching."
where_people_sleep = "Thirty-four to a pit in longpits 1, 2 and 3, twenty in the Keel under the Grey Mare, and nobody outside. Byre against longpit 2's east gable and the warm end is fought over in jokes."
clocks = [
  "W31-33 - THE BARLEY. THE FIRST FIELD IS FLAT AND SPROUTING IN THE EAR since the W29 rain - not seed, food if it is cut and dried, and less of it every wet day. THE SECOND FIELD is green and standing, sixteen days behind, due about W32-33 if the autumn gives it. Aud's call, in the salmon peak. The quern is Ormar's from W31.",
  "to W33 - the peat walls must be dry before the autumn rains. About 200 m3 in hand, reckoned enough in W23; no more cutting planned.",
  "W29-34 - THE SALMON RUN, started behind the W29 d4 spate, peaking W30-32. Twelve hands through the peak is worth nearly double six.",
  "W33 - autumn equinox and the autumn spates, the only weeks besides spring when the river floats a stick.",
  "W36 - after this nobody sails.",
  "W38 - first frost. FIFTEEN THOUSAND KILOS wanted. Store 5590.",
  "by frost - 1000 kg of charcoal banked, three more clamps.",
  "Y3 W14 - the Hessa, with cordage and wood, and a new deal cut as one.",
  "Y4 W14 to W39 - THE MASTER AND BRUNI, for 25 kg of worked iron, which does not exist and cannot be made without a bloomery.",
]

