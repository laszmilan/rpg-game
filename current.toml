born_here = "Nine living: three to women carrying at the landing (Y1); Ketil Bjarnsson (Y1 W20); Thora, Sigrid's (Y1 W41); Herdis's daughter (Y2 W14, unnamed); Bjarn, Ingunn's (Y2 W18); Runa's son (Y2 W27, unnamed); Hild's daughter (Y2 W30)."
the_reconciliation = "108 sailed + 9 born living - 13 of the 14 dead (Thora's son was born dead here and is not among the 108) = 104, plus ILMO AND OSKI from Y3 W16, sworn Haldvikers Y3 W17 D2 = 106. Ingra and Gest at Kolvenn are counted. Of fifteen or more: 77 before Ilmo and Oski (the W15 and W17 Standings), 79 with them."

[food]
in_store_kg = 3020
what_it_is = "THE CLIFFS (W24): ABOUT 900 KG OF EGGS IN ASH AND 150 OF BIRDS. MOSTLY COD (from W14): salted on the strand's 40 kg a week, smoked - the old smokehouse and, from W19 D5, one of the two new cold smoke-houses - and racked. THE PILOT WHALE (W18): dried, but ONE KEG WENT SOFT INSIDE and seven took the runs (W22); what was sound - about a third - in one scalded keg. Seaweed drying for winter on Solvi's far rocks. Fresh fish on top. Milk from the cow. About 60 l of whale oil."
sealed_and_not_food = "THE SEED IS IN THE GROUND (sown Y3 W11): 200 kg barley and 100 kg of peas in Aud's fields. The henbane seed for the herb strip. The byre is kept for the spring by the jarl's word."
ale = "What is left of Aud's ale, under Sigra's hand."
the_ration = "FULL RATION FROM Y3 W17 (the jarl, W16 D7: being fat before winter matters as much as having food) - about 480 a week from the store for about 106, fresh fish on top. The children, the carrying, the nursing and the sick still get fresh fish, raw liver and milk first. Weighed in public by Vigmar, checked by Sigra."
the_summer_outlook = "The cod thin: about 40 a day (W19-20). About 500-600 a week in all against about 480 out at the full ration - creeping up until the bird cliffs (W22-25) and the salmon (W29-33). Last summer Y2 W12-24 brought 450-700 a week."
standing_food = "Anything that swims or walks is eaten. Fresh before stored. The ice fished every workable day."

[resources]
salt = "THE STRAND PANS MAKE ABOUT 40 KG A WEEK on peat (three pans, one strapped). SIGRA STOPPED SALTING THE COD when the new smoke-houses drew (Y3 W19 D5) - the thin cod goes to the racks and the smoke - and SAVES THE STRAND'S SALT for the birds, the seal and the salmon: about 30 kg in store by W20 D1, about 350-400 by W29 at this rate (100 kg of salt salts about 500 kg of fish). Made at the strand because the bay off the terrace is brackish from the salmon river and the strand faces the open sea; the clamps stay there for the wood."
charcoal = "ABOUT 550 KG at W23 end: 420 after two burns, PLUS ABOUT 430 FROM THE STRAND HEAP (two clamps since W17: one clean about 280, one half ash about 150; Hald's Coal brought it W23 D2) AND THE THIRD CLAMP about 260 (W23 D5), LESS THE THIRD BURN about 300 (W23 D3-D5); ABOUT TWO BURNS. Before them about 1,020 KG (670 plus about 350 from the two spring strand clamps, one burned clean, one half to ash; Hovard W17). The 50 off the Nagholt floor went back under it by law 18. CLAMPS TO BURN TILL THE FROST (the jarl, W17). BREK'S GUESS: first stacks about 50 kg charcoal per kg bloom (25 once learned); bloom to bar loses half and about 5 per kg bar; bar to work 2-3 per kg - ore to worked iron about 110 per kg now, 55 learned. Vask's first 12.5 kg is about 1,400 kg; the full 25 about 2,800. A clamp is about 300."
peat = "About 165 m3 after the three strand pans burned about 35 since W10 (carried by Hald's Coal); a winter of hearths takes about 35. Walls walked after rain and every D1."
iron = "About 5 kg of bar after Brek's eight replacement knives (W6), about 2 kg usable in the Nagholt lumps (kept under law 18, to be named at the door), one fist-sized bloom of Hafli's, and one cracked saw plate of hard steel. THE SECOND BURN'S SIX KILOS OF BLOOM (W22) BEATEN TO THREE BARS, JUST UNDER 3 KG (W23), on Vigmar's beam in the storehouse. THE THIRD BURN'S BLOOM BEATEN TO ABOUT 3 KG OF BAR (W25). ABOUT 6 KG OF BAR in all before the knives, less the knives. BOG ORE: THE FIRST BURN'S 40 KG WENT INTO SLAG (W20); the second's made the bloom. About a burn's worth dug and drying, not yet roasted; Geir digging THE OTHER WAY from the stake. THE SLAG: a cauldron-sized glassy mass full of iron beads no bigger than barley grains, broken out of the stack - the iron came and never found itself (Brek). The Y4 price is 25 kg worked, about 33 of bar - it cannot be paid out of what exists."
hooks = "About 700, enough for four long-lines."
"rivets and nails" = "A keg of rivets; the nail keg less 2 kg traded to the Hessa (Y3 W15)."
"rope and line" = "FIVE HUNDRED PACES OF HESSA CORDAGE (Y3 W15) - Ranulf's 400 for the Grey Mare's standing and running rigging and about 100 over for the ice; eight coils of ship's rigging; the cliff line, 130 paces of doubled hemp; sixty paces of sealskin-and-bast; walrus-hide strap."
"hides and cloth" = "41 sealskins, fifteen dressed. Six bolts of wool, almost no linen. Forty-eight reindeer hides - Arna's winter suits. Two sheepskins. Nine bundles of sinew. Two pieces of Ivven hide worked thin as cloth. Two dressed deer hides given to Enna by the Ivven (W12). The W4 bearded seal hide cut to soles for the ice crew, the scraps to mitten palms."
barrels = "Five ships' casks and ten Hessa kegs and barrels, and THREE EMPTY HESSA BARRELS (Y3 W15); EIGHT MORE COOPERED BARRELS promised on the autumn boat. Scald, lye, rinse and scald over three days before use."
knives_for_trade = "SIX KNIVES DONE (W26 D5) for Ivven meat and hide, in oiled cloth on Brek's bench - plain heavy hand-long blades, shaving-sharp."
"lamp oil" = "A third of a cask, and ABOUT 60 L OF PILOT-WHALE OIL (W18). The seal and whale oil mostly traded: about 300 l to the Hessa (Y3 W15), 100 l more owed on the autumn boat for the barrels."
"birch tar" = "About 2 litres from the Ivven and most of Vask's small barrel."
hardwood = "TWENTY SQUARED TWO-METRE LENGTHS AND THREE STEM-KNEES from the Hessa (Y3 W15), on top of what was left of the old stock after Ilmo's strakes and the sled runners."
tools = "Anvil and full smith's kit. Six axes, two adzes (a third given at Kolvenn Y3 W16 and called HALDVIK; the master put it in Bruni's hands), three augers, nine spades, iron wedges. Two sleds with hardwood runners (Y3 W1). Gear for three boats and two nets, one rigged on a pole for under the ice. FOUR BARBED HARPOON HEADS. A bone hide scraper. The saw: beaten straight, nine teeth snapped, slow and binds in green wood. The quern: shimmed, grinds coarse. THE TEN IVVEN KNIVES ARE SPENT on the thirty deer, and EIGHT OF HALDVIK'S OWN, THE JARL'S AMONG THEM, on twenty-four more (W6); Brek's eight replacements handed out (W7)."
arms = "19 spears, 11 axes, 4 swords, 22 shields, 6 mail, 9 helms, 5 bows. Fourteen men who have been in a real fight. No defence built."
boats = "Ottersnout (sound) and Widow's Promise (in hand, Leif and Steinn) on the sand. The Grey Mare is the Keel. Two ship's boats, one faering. Hald's Coal works the strand, Torgest steering; she carries the peat to the pans. Ilmo's boat, strakes set. Tavi's old wreck on the sand."
ivory = "None. The two walrus tusks went to the Hessa (Y3 W15)."
missing = "No cooperage. No plough - two ploughshares and nothing to pull them. No kiln. No boatwright who can loft a hull."

[livestock]
ewes = 9
rams = 2
lambs = "5, born in the spring of Y3 (a thin lambing after the hungry winter; settled W20 D1)."
goats = 4
kids = "2, born in the spring of Y3."
cow = 1
heifer = "1, the Y2 calf, a yearling. NO CALF THIS YEAR - there is no bull."
pigs = "None. No pigs unless got from the Hessa."
chickens = "11 hens and ONE COCK (kept at the Y2 cull on Aud's word - two hens went into the Turning soup instead), in a basket by longpit 2's hearth. FOUR CHICKS this spring (one more lost to a gull)."
dogs = "3, and A LITTER OF 5 PUPS (Kelda minds them with the small children); Grip is Kelda's."
kept = "TWENTY-FOUR HEAD, grazing the shoulder in summer; the byre's twenty-seven stalls in winter, gaps stuffed with peat. Kept for births, both rams and every hen, by the jarl's word in open council (Y3 W1). HAY: last summer three cuts, W22, W24 and W26 (Aud), twenty people four days for the first; this year more mouths in the byre."

[health]
carrying = "INGUNN, named by Enna at midsummer (W20 D2): her third, DUE ABOUT THE HARVEST (W30-34). She is NARROW - Ketil nearly killed her, Bjarn was worse. Off heavy work from W20, fresh liver every day. The father she will not name. Runa's boy and Hild's girl well."
standing = "THE RUNS (W22 D4-D7): seven from one keg of the whale meat, two of them children; Enna and Hild sat up two nights; ALL UP BY D7, grey and shaky. KOLBEIN: the knee mending, on a stick, not yet on a crew. GEIR: the crushed hand permanently weak; with the smiths. ENNA: on her rounds. THE JARL: ribs mended enough to haul; palms rope-burned from the whale; three fingertips of the right hand burned on a live coal (W6 D6), scabbed over. INGRA: both hands frost-white to the wrist from a reading (W6 D6); whole, but COLD TO THE TOUCH since. HAFLI: last two fingers of the left hand gone. LEIF: ring finger's tip taken (W9), healed. One strand man with a mended jaw."
henbane = "ABOUT ONE DOSE LEFT after the Ivven boy's leg (W12), PLUS THE LEAVES OF TWO VALLEY PLANTS drying under Enna's hand (a dose or two). THREE WHOLE PLANTS from the valley midden (W19) in the herb strip, a ring of stones round them, flowering, to seed at summer's end - NOBODY PICKS FROM THAT BED BUT ENNA. The henbane seed sown in spring. Willow bark tea as well, bitter and plentiful."
ennas_five = "Bedding enough to throw out and replace twice; greens and pine tea twice a week; latrines downstream, used in the dark, no exceptions; combs and hot water; roof vents. Lye handwashing at every door by law, and soap."

[work]
_ = "Summer. The cod thin; the ceiling is salt, smoke and racks, not fish, until the birds and the salmon."
the_cruives = "PEGGED AND STONE-WEIGHTED W26 D1-D4 by Hjalti's four: new pegs of split pine, river stones the size of a man's head. Ready for the spate."
the_cod = "Hjalti's boats every workable day on the offshore bank, in earlier each day as the run thins; Sigra runs the beach - gutting lines, livers in a crock, split fish on the racks, salting the strand's 40 kg a week, the smokehouse day and night."
longpit_4 = "FINISHED W21 D7: roofed W18, doors W18, the middle wall W21 D5-D7 (turf on stone, no door through). Lived in from W21 D7; later the ward and washhouse."
hands_W22 = "W22: THE SHOULDER HAY D1-D4 with Solvi's eight and the ditch crew - THE FIRST CUT IN; Solvi back on the rocks D5 (her four children on the rocks with Kelda all week). YLVA'S EIGHT AT THE CLIFFS D2-D4, Sigra's two among them. THE SMITHS: Brek, Hafli, Geir, Ormar's two carriers, Ulf's cousin and Steinn on the bellows. THE DITCH STOPPED. FOR W23 (the jarl): the smiths go on; Ylva keeps her eight, hunt or eggs; two off the ditch to the boats; the ditch with what is left, about five and the jarl. Otherwise as W21: BOATS 12; BEACH 7; STRAND 8; FORAGING 8 + 4 children; STORE AND LAW 5; CRAFTS 5 + 2 children; FIELDS 3; WIDOW'S PROMISE 2; HEALING 2; SHIELD 1; BYRE 2 children; NOT ON A CREW 8; away 2."
ilmo_and_oski = "ILMO AND OSKI, sworn Haldvikers (W17 D2), on Hjalti's boats; inside at night and off the watch (the jarl, W17 D1). Kolvenn boats fishing the coast will put in to see Ilmo, and Haldvik feeds them."
the_ore = "GEIR digging THE OTHER WAY from the stake (W19 D7); Hafli with him when the stack can spare him, never alone. THE STAKE where a rusted strap was put back with Fenn's words (W19 D6); if the walker comes to it, the council opens it and lays it to rest."
the_strand = "Hovard's eight: three pans on peat, the clamps; every kilo of salt goes up to Sigra."
foraging = "Solvi's ten and Sigra's two on the tide rocks and the far rocks toward the strand at the big tides - seaweed (eaten and dried for winter), shellfish, teeth-grass, moss boiled twice - fills more than feeds; no berries until late summer (crowberry), rosehip after. Pine needle from the valley. Ylva and Ossur snare the ground to the edge; Ossur walks the upper line and the Nagholt tracks twice a day."
indoor = "Arna's reindeer suits. Ranulf's rope. Aki's map under the reeve's beam, never copied. Vigmar teaching Tova and Aki the old marks. The forge as Brek likes, Hafli one-handed."
watch = "Two on the tower every night; in the worst cold, changed every hour. HALVAR'S ORDER (W17 D1, the jarl agreeing): NOTHING THROWN AT THE WALKER; harm it only if it harms us. One short blast means come and look (horn signals in notes.toml [laws])."
peat_and_fire = "The peat walls walked every D1 and after rain. The drowned fire ring walked every morning with a bare palm."

[build_plan]
constraint = "STICKS (Ormar Y3 W8, corrected W17): 108 on the terrace, longpit 4 takes about 70, ABOUT 38 LEFT; THE SMOKE TUNNEL takes about 13 (W17 D4), leaving 25 for a forge that wants 30 - 5 short. STRAND LOGS TO BE RIVEN before the forge (the jarl: will find the logs) - hauled 5 km, about 26 a week with twenty men. The Hessa hardwood is kept for boats and the Y4 boatwrights. About 130 man-days of stone quarried."

[[build_plan.queue]]
what = "THE FERMENTING PITS"
needs = "Where and how Sigra says: deep, by a spring, birch bark, stones, a handful of salt a fish. Done wrong it kills a house; only Sigra has done it."
target = "THE THREE SALMON PITS DUG AND LINED W19 D6-D7 by Ormar's twelve, by the spring behind the stone band, each about a bed's size and deeper than a man's waist, flat stones and birch bark, about 250 kg of fish each (Sigra). THE WHEY BARREL still to set."
why = "The salmon surplus. And ONE BARREL OF FISH IN WHEY, because the jarl wants to taste it before he dies (whey enough for a barrel or two only)."

[[build_plan.queue]]
what = "THE FORGE"
needs = "About 30 sticks (25 in hand now the smoke tunnel is built) and a season of grey band stone, built against the quarry's cut face."
target = "Next in the queue. Against the quarry's cut face (notes [land_plan] the_forge_site). The old forge on the beach works a bloom well enough meanwhile (Brek, W18)."
why = "Tools and bar. Lockable - the only building worth robbing besides the storehouse, and it has no door."

[[build_plan.queue]]
what = "THE BLOOMERY"
needs = "A stone-and-clay stack a man's height, lined with Herdis's clay, a clay bellows nozzle at the foot and a slag tap-hole - NO STICKS (Brek, W18 D1). A SECOND PAIR OF BELLOWS from Arna's sealskins; the forge's stay at the forge. Ore: about 40 kg roasted a burn (Brek); about one burn's worth dug by W18 end. EVERY BURN SEVEN PEOPLE FOR THREE DAYS (Brek, W17): four on the bellows in shifts, two digging ore, one roasting - and one burn is one whole charcoal clamp."
target = "FIRST BURN FAILED (W20, test 9, [6,2]). RELINED W21. SECOND BURN SUCCEEDED (W22 D3-D5, test 7, [12,12]): the slag ran thin as honey, SIX KILOS OF BLOOM. Iron has come out of the building before the autumn boat. Each burn a clamp: charcoal for ONE more now; the strand clamps go on till the frost."
why = "Nothing else can pay the Y4 iron, and the autumn boat is told whether iron has come out of it. Brek and Hafli have never seen one."

[[build_plan.queue]]
what = "THE DITCH AND BANK"
needs = "2 m wide and 2 m deep across both ends of the terrace from the water to the stone band, the spoil a 2 m bank behind it faced with turf; about 320 m3, 180-220 man-days. ONE CAUSEWAY, three paces wide, at the SOUTH end against the stone band (Halvar, W20 D1); THE NORTH END CLOSED - the reef and the headland by the Gate Road and over the shoulder. The south ditch floods."
target = "ONLY THE HANDS THE EGGS, SALMON AND SEAL DO NOT NEED (the jarl, W23). NORTH END FINISHED W23 D5; SOUTH END BROKEN W23 D6, wet. BEGUN W20 D1 at the north end; BY W21 D7 THE NORTH END CHEST-DEEP ITS WHOLE LENGTH, the bank turfed (Ormar: another week, then the south). STOPPED FOR W22; ON AGAIN W23 with about five and the jarl. Whoever has nothing else to do. Not posted till done; then one of the tower two walks to the causeway once a night, a fire basket in winter."
why = "To buy time and a position, not to stop a crew that means it (the jarl). Three metres bottom to crest stops a man walking in (Ormar)."

[[build_plan.queue]]
what = "THE GREY MARE"
needs = "Fourteen people out of the Keel, then a hull rebuild. THE CORDAGE CAME Y3 W15 (Ranulf's 400 paces for her standing and running rigging)."
target = "The boatwrights, Y4."
why = "Erik swore at the burial ground she will sail again before he joins his father."
