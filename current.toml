[health]
carrying = "FOUR CARRYING (Enna, W33): two showing, two to be named when they show; due W46 to Y4 W6. INGUNN AND ASTA well (born W34 D5), nursing, among the protected."
standing = "KOLBEIN: the same knee wrenched again (W33 D7), at Enna's, on a stick. GEIR: the crushed hand permanently weak; with the smiths. TWO SALMON-KNIFE CUTS to the hand (W31), healing. THE JARL: ribs mended; three fingertips of the right hand scarred from the coal (W6). INGRA: hands cold to the touch since W6. HAFLI: last two fingers of the left hand gone. LEIF: ring finger's tip gone. One strand man with a mended jaw."
henbane = "About one dose left, plus the dried leaves of two valley plants (a dose or two). Three plants from the valley in the herb strip in a ring of stones, going to seed - NOBODY PICKS FROM THAT BED BUT ENNA. Willow bark tea, bitter and plentiful."
ennas_five = "Bedding enough to throw out and replace twice; greens and pine tea twice a week; latrines downstream, used in the dark, no exceptions; combs and hot water; roof vents. Lye handwashing at every door by law, and soap."

[work]
_ = "Autumn. The salmon over, the barley in. Food first (the jarl): the rest only get the hands food does not need."
the_cod = "THE COD GOING OUT OVER THE BAR (W37). Two boats on the strand lines; the rest of Hjalti's hands at the strand on the clamps from W37 D2 till the ice."
the_beach = "Sigra's crew on the racks and the four smoke-houses while the drying holds; the pits and the whey barrel smelt weekly by Sigra through a reed in each lid."
the_strand = "Hovard's eight: the last clamp before the frost, then the strand closes and the windrow is counted. The pans cold."
foraging = "Solvi's crew: the kelp piled at the top of the fields for Aud's spring dung; dulse on the lines; the far rocks, crowberry and rosehip. Ylva and Ossur snare the ground to the edge; Ossur walks the upper line and the Nagholt tracks twice a day."
the_forge = "Brek, Hafli and Geir: a burn when a clamp comes in, bar between burns. KELDA sweeps the forge floor every evening - a year, and not one question (Brek)."
the_ward = "Enna, Hild and GUDNY (off the racks from W34), training for the four births in the cold."
the_claims = "ALL 58 PLOTS CUT (W35). Nobody builds in Y3. The rods between the two old houses done W37 D2: a laid path."
indoor = "Arna's winter suits and the fresh seal hides. Ranulf's rope. Aki's map under the reeve's beam, never copied. Vigmar teaching Tova and Aki the old marks. Tova cutting the laws on sticks of her own. Aud's ale in the Keel."
watch = "Two on the tower every night; in the worst cold, changed every hour. Nothing thrown at the walker; harm it only if it harms us (Halvar, W17). One of the two walks to the causeway once a night once the cold comes."
peat_and_fire = "The peat walls walked every D1 and after rain. The drowned fire ring walked every morning with a bare palm."

[build_plan]
constraint = "STICKS: about 19 left after the third smoke-house against the forge's 30. Strand logs to rive would make them up, at the windrow's cost (Hovard: under two hundred trunks by winter). The Hessa hardwood is kept for boats."

