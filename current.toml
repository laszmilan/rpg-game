# Haldvik - current. The present state; update every week. Player-readable.

_ = "The present only: what is true or owed now, rewritten whole every week. Nothing historical - that is log.toml. Standing facts (world, ground, land plan, practice, people, laws and treaties) are in notes.toml."
date = { year = 3, week = 27, day = 1, season = "autumn" }
morale = 9
paused_at = "Y3 W27 D1, MORNING. W26 is logged. THE JARL ASKS AUD FOR THE HARVEST DATES. OPEN: BREK'S ASK - his four bellows-men for three days to light the fourth burn by D3 (charcoal for two burns, five or so kilos of bar on the beam) - not yet answered."
mood = "Fat and a little restless: 3,050 in the store, three smoke-houses, iron on the beam, the hay in. The herd left walking on the jarl's word, and Asgeir's question still in the air."
where_people_sleep = "ABOUT TWENTY-FIVE TO A PIT IN LONGPITS 1-4 from W21 D7 - the 104 at home; nobody outside. THE KEEL EMPTY, the Grey Mare left as she is over her pit. Ilmo and Oski in longpit 1. Ingra and Gest at Kolvenn."
