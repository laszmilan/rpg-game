# Haldvik - current. The present state; update every week. Player-readable.

_ = "The present only: what is true or owed now. Nothing historical - that is log.toml. People in people.toml, laws and treaties in their file, world and practice in readme.toml."
date = { year = 3, week = 15, day = 4, season = "spring by the calendar; the hard cold runs to about W6" }
morale = 7
paused_at = "PLAY PAUSED AT Y3 W15 D4, MORNING, longpit 3, before the land Standing tonight - W15 is not yet logged. D4 MORNING, FENN AND TOVA'S VERSIONS (Tova's sticks): AKI'S COUNT (d6 5 on a shown list) 55 HEARTHS CLAIM - 33 of the old 38 (Fenn, Gest and three old ones hearths on paper only do not), 19 grown sons and daughters, 3 who turn fifteen at the Turning - for 46 plots; AKI DRAWS TWO MORE BLOCKS OF SIX on the grazing inside the ring at the north ends of Grip and Egg Line, 58 plots, 3 over; pegged in two days. KEPT IN ALL VERSIONS: one allotment this spring, then the jarl gives; one plot a hearth; two hearths become one, one plot back; none sold or given outside Haldvik; two sticks and corner stones. (1) THE HEARTH'S GROUND (Fenn): the hearth's for good, passes to husband or wife, then one child of that fire (named, or the eldest at that fire), never split, back to Haldvik only when nobody of that fire is left, swaps before the reeve - cost: in fifty winters the good plots are the first choosers' grandchildren's. (2) THE LIFE STICK (Tova): held for one life, stays with the fire till the youngest there is fifteen, then back to Haldvik and given again, that fire's children asking first - cost: law 6 said private ground, this is lent; nobody builds stone for a house the children lose. (3) BUILD OR GIVE BACK, sewn onto either: no roof ten winters after the drawing, or the hearth gone from Haldvik three winters, and it goes back - cost: falls on the poor and the alone first. TOVA: the jarl's bowl words 'if a plot loses its owner' read two ways - under (2) Gudny's boys get nothing at fifteen. THE WIDOWS, TOVA'S NEAR BLOCK: the block by the spring nearest the longpits kept out of the choosing; after council and heads of work choose, the nine widowed hearths with children draw for it among themselves first, the rest into the sack - all nine, not the one who stood; cost: heads of work lose the best block. FENN: law 2 makes your son jarl, nothing makes your plot his hall - say whether the jarl's ground goes with the man or the seat. EARLIER, D1-D3: D2 THE HESSA LAND, two hulls, SKELVA leading (her hair cropped for a death in her house, the reason they were a week late); she sees ILMO'S SIX ALIVE: WE SAID YOUR NAMES AT THE TURNING; ILMO: then they come home as strangers and stand at their doors and the houses decide - but they lived the winter on this jarl's word under his roofs on his bowl; tell Vask that first. GUEST-RIGHT, three nights. D2 evening SKELVA: the cordage and wood as agreed; oil always, the tusks gladly, the nails with thanks; INGRA AND GEST go north and COME HOME THE LAST WEEK OF AUTUMN, cut at both ends; BUT VASK WANTS THE IRON FROM THE JARL'S OWN MOUTH AT HIS OWN HEARTH. D2 night COUNCIL (Halvar, Vigmar, Fenn, Osvi, Gest, Aki): THE JARL SAILS TO KOLVENN - eight in the OTTERSNOUT under ULF alongside the Hessa, Ingra and Gest set down, two nights at Vask's fire, home (about ten days). FENN: the land Standing cannot be held from a boat - held before sailing; THE LAND STANDING ON D4, Fenn and Tova's versions ready by then; SAIL D5 with the Hessa. THE COUNCIL HOLDS under law 13; HALVAR STAYS and picks the crew: ULF leads, a bow, a weather steersman, not Osvi (the bar); mead one night, the weather as long as it takes. D3 morning said at the bowl; SKELVA: no jarl has ever come to Kolvenn; Vask pleased and hiding it, suspicious and hiding it worse; bring nothing you would mind him seeing. D3 afternoon THE TRADE, three sticks: HALDVIK GETS about 500 paces of cordage (Ranulf: better than bast), 20 squared hardwood lengths and 3 stem-knees, 3 empty barrels now and 8 coopered barrels on the autumn boat (Sigra's ask); HALDVIK GIVES about 300 l of oil, the two walrus tusks, 2 kg of nails; for the autumn barrels 100 l more oil and what hooks the smith can spare. SKELVA: fair; the barrels matter most; the iron is still Vask's to hear."
mood = "The thaw came clean and the ground is open: ditches, new strips, seaweed on the fields, boats inside the bar, and a plan for the year said at council. Hungry and working. The walker has not been seen since the fields, and people have started to say it is done."
where_people_sleep = "Thirty-four to a pit in longpits 1, 2 and 3, twenty in the Keel, the six Hessa at the back of longpit 1, nobody outside."
clocks = [
  "THE YEAR'S PLAN (Y3 W8 council, Aki's stick): fields W8-10; longpit 4 W10-13 after the holes are proved; the strand W10 with eight - three pans on peat, two clamps; the survey W10-12; the cod W12; the Hessa W14, paid in oil, the two tusks and 2 kg of nails, Ingra and Gest north with them, home the last week of autumn by the deal.",
  "The equinox (W7) was clouded out; Osvi has no sun measurement yet.",
  "SUMMER - the Needle crossing, north on the high moor about 20 km out, give or take 10 (Aki's two sticks).",
  "Every D1 - the land plan at council, the map on the bench, so there is a plan by spring.",
  "Y3 W8 - the thaw. Longpit 4's forty-two post holes opened and watched a fortnight before a post goes in.",
  "Y3 W12 - the cod back on the offshore bank. THE COD CAME W14, THICK. 825 at W15 and climbing; the ceiling now is salt, smoke and racks, not fish. Each gale week pulls it closer.",
  "Y3 spring - Ingra north to Kolvenn for at least a summer; the coals sealed with Fenn. The fields dug the week the spade goes in; Aud wakes a hundred grains four weeks before sowing.",
  "Y3 W14 - the Hessa, with cordage and wood; a new deal cut as one. Ilmo's six go home when the ice lets them, and Vask hears about the iron.",
  "Y4 W14 to W39 - the master and Bruni, for 25 kg of worked iron that does not exist and cannot be made without a bloomery.",
]

