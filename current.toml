# Haldvik - current. The present state; update every week. Player-readable.

_ = "THE PRESENT, AND ONLY THE PRESENT. What is true or owed now, brought up to date every week. Nothing dated, nothing historical - that is log.toml. People are in people.toml; the laws and treaties in laws_and_treaties.toml; the world, rules and standing practice in readme.toml. Player-readable."
date = { year = 2, week = 42, day = 1, season = "winter" }
morale = 6
mood = "Snowed in and holding. The store only goes one way now, and some are counting knocks - the hull, the ward, the boy's fingers. Against that, Haldvik stood and said its ground out loud, 71 to 2, and ate three deer off it the next morning. The Ivven band fed the jarl a leg like a dog and walked off with four deer, and everyone saw it from the terrace; that is remembered too."
where_people_sleep = "Thirty-four to a pit in longpits 1, 2 and 3, twenty in the Keel under the Grey Mare, the six Hessa at the back of longpit 1, and nobody outside. Byre against longpit 2's east gable."
clocks = [
  "W46 - MIDWINTER, THE FEAST OF TURNING, the longest night. Every hearth banked to one coal and relit before dawn; ages turn. Aud's second ale, sixty litres, and three cocks for the soup. Fenn's counsel: tell them plain about the winter before it, and again at it. The bay ices about now.",
  "Y3 W8 - the thaw. Longpit 4's forty-two post holes opened and watched a fortnight before a post goes in.",
  "Y3 W12 - the cod back on the offshore bank. Until then the lines take little.",
  "Y3 W14 - the Hessa, with cordage and wood, and a new deal cut as one. Ilmo's six go home when the ice lets them.",
  "Y4 W14 to W39 - THE MASTER AND BRUNI, for 25 kg of worked iron, which does not exist and cannot be made without a bloomery.",
]

[souls]
total = 103
of_15_or_more = 76
women_of_15_or_more = 43
of_12_to_14 = 3
children_under_12 = 25
veterans_of_real_fighting = 14
dead = 14
born_here = "Nine. Three to women carrying at the landing, delivered in Y1; KETIL Bjarnsson Y1 W20; THORA, daughter of Sigrid, Y1 W41; HERDIS'S DAUGHTER Y2 W14, unnamed; BJARN, son of Ingunn, Y2 W18; RUNA'S SON Y2 W27, unnamed; HILD'S DAUGHTER Y2 W30."
the_reconciliation = "108 sailed, 14 dead, 9 born here: 103, all Haldvik's own, all home."
resident_strangers = "SIX HESSA off Ilmo's fishing boat, driven in by the W36 gale. Five work; one has a leg broken below the knee, set, knitting by about W42. Under Haldvik's law and at its work, fed on the jarl's own word under Haldvik roofs, on the same fifth cut as everyone from W40, until the ice goes and their boat can swim. They teach the Hessa tongue in the evenings and will teach the ice."

[food]
in_store_kg = 4595
store_last_year = "9100 at W40 last year. At a winter draw of 420 against little income, this store is empty about Y3 W3, some nine weeks before the cod come back."
what_it_is = "Dried and smoked fish and seal are the bulk. About 500 kg salted whale and 150 kg smoked; about 1,050 kg of W25 eggs in ash; about 400 kg salted seal; birds, greens, berries, seaweed; rendered fat; about 140 kg of Haldvik barley for the pot; from the W22 trade 300 kg barley, 200 kg peas, 80 kg fat. Seal oil about 680 l and whale oil about 350 l. Milk from the cow."
sealed_and_not_food = "SEED: 200 KG OF BARLEY by the jarl's word, 40 kg Hessa peas, 60 kg Haldvik peas, and the henbane seed for a herb garden. Eating it is theft from the colony, said by the jarl in those words."
ale = "Aud's first-field keg, the rest of it under Sigra's hand, strong and tasting of peat smoke. A SECOND BATCH MALTING: twenty kilos of eating barley for sixty litres at the Turning, midwinter W46."
the_ration = "A FIFTH CUT from Y2 W32, the jarl's word, named on the day, AND THE SIX HESSA ON IT FROM W40. Not the children, not the women carrying. Nursing mothers take the cut but go first after the children for fresh fish, raw liver and milk - Hild, Runa, Ingunn, Herdis, and Sigrid feeding two. About 420 a week with the Hessa. FROM W41, A WORKING RATION AND A SITTING RATION inside that same total: whoever is out at the rocks, boats, snares or ice on a head of work's task eats more, whoever sits by the fire eats less; not the children, the carrying, the nursing or the sick. Aki marks who went out each night; Fenn's sitting portion was weighed first, in public. A DEEPER CUT AFTER THE TURNING if needed, named on the day. Weighed in public by Vigmar, checked by Sigra."
standing_food = "ANYTHING THAT SWIMS OR WALKS IS EATEN - roots, river snails, seaweed, shellfish, whatever the snares and the tide give. Fresh is eaten before stored. The boats fish inside the bar every workable day."

[resources]
salt = "About 290 kg. The strand is shut for the winter; ONE OF ITS THREE PANS IS CRACKED. Salting takes about 100 kg per 500 of fish."
charcoal = "About 670 kg, plus about 50 off the Nagholt floor. The forge runs as Brek and Hafli like; the target was 1000 and the strand shut short of it."
peat = "About 200 m3, far more than a winter needs - last winter burned about 35. Walls walked after every rain."
iron = "About 9 kg of bar, about 2 kg usable from the Nagholt lumps, one fist-sized bloom of Hafli's, and ONE CRACKED SAW PLATE of hard steel. THE Y4 BOATWRIGHT PRICE IS 25 KG OF WORKED IRON, about 33 kg of bar. IT CANNOT BE PAID OUT OF WHAT EXISTS."
hooks = "About 700, enough for four long-lines."
"rivets and nails" = "A keg of each."
"rope and line" = "Eight coils of ship's rigging, and the cliff line - the Grey Mare's standing rigging spliced into 130 paces of doubled and served hemp. Sixty paces of sealskin-and-bast spare. No cordage on this coast; 400 paces coming Y3 W14."
"hides and cloth" = "41 sealskins, fifteen sets dressed. Six bolts of wool, almost no linen. FORTY-EIGHT REINDEER HIDES, three of them Haldvik-killed, hollow-haired, warmer than sealskin at a third the weight - Arna's winter suits come out of them. Two sheepskins from the cull. Nine bundles of dried sinew. Two pieces of Ivven hide worked thin as cloth that nobody here can reproduce."
barrels = "Five ships' casks and ten coopered Hessa kegs and barrels. Scald, lye, rinse and scald again over three days before use."
"lamp oil" = "A third of a cask, plus the seal oil and whale oil."
"birch tar" = "About 2 litres from the Ivven and most of the small barrel Vask gave. Kolvenn has barrels of it."
hardwood = "Eighteen squared lengths and three stem-knees of two-metre Hessa stock, less what went into Ilmo's strakes. It will not make a long post."
tools = "THREE KNIVES held by Vigmar for the Ivven, at ten hides a knife. Anvil and full smith's kit. Six axes, four adzes, three augers, nine spades, iron wedges. Gear for three boats and two nets, ONE RE-RIGGED ON A POLE FOR UNDER THE ICE. FIVE BARBED HARPOON HEADS. A reindeer-bone hide scraper. THE SAW: the sprung plate beaten straight, NINE TEETH SNAPPED - cuts slow, binds in green wood, cross-cuts seasoned timber. THE QUERN: the eye a finger off true, shimmed, grinds coarse."
arms = "19 spears, 11 axes, 4 swords, 22 shields, 6 mail, 9 helms, 5 bows. Fourteen men who have been in a real fight. NO DEFENCE BUILT."
boats = "Ottersnout (sound) and Widow's Promise (in hand, Leif and Steinn) on the sand, seagoing hulls. The Grey Mare is the Keel. Two ship's boats work the lines, tide-limited by the bar. One faering. Hald's Coal laid up for the winter; TORGEST STEERS HER NEXT YEAR, off the pans. ILMO'S HESSA FISHING BOAT, strakes set, fishing inside the bar. Tavi's old Hessa wreck on the sand."
missing = "No cooperage. No plough, though there are two ploughshares and nothing to pull them. No kiln. No boatwright who can loft a hull."

[livestock]
ewes = 9
rams = 2
goats = 4
cow = 1
heifer_calf = 1
pigs = "2 - the boar and the sow. THE SOW IS NOT IN PIG AND HAS GONE THIN."
chickens = "16, three cocks among them kept for the soup at the Turning."
dogs = 3
in_the_byre = "Nineteen head in twenty-seven stalls. The hay - three cuts - carries them. The pigs eat from the people's pot, not the hay. Kept for next year's births: the boar and sow, both rams, every hen."

[health]
carrying = "A third Enna will not name. Runa's boy and Hild's girl are well, their mothers mending."
standing = "THE JARL: two ribs cracked (W36), HAULING AGAIN from W40 d6, an ache and no catch; thinner. HAFLI: THE LAST TWO FINGERS OF HIS LEFT HAND taken at the knuckle (W38) after the saw burn went bad; the stumps dry and closed, the palm cool; right hand only until Enna says. ONE HESSA leg set below the knee. Sigra's daughter mending, told privately she should not carry again. Herdis's daughter well and on two women. One crushed hand permanently weak. One strand man with a mended jaw and four teeth gone."
henbane = "Some in hand, found by Solvi, and seed enough for a tiny herb garden, by the jarl's word. Willow bark tea as well - bitter, weaker, plenty of it."
ennas_five = "Bedding (4 t dry, enough to throw out and replace twice), the green ration from W40 with pine tea twice a week, latrines downstream and used in the dark with no exceptions, combs and hot water, roof vents. Lye handwashing at every door by law, and soap."

[work]
_ = "Winter. The strand is shut and the ground frozen; food and upkeep first."
standing_priority = "Cutting before construction, meat and fish; eggs and greens are a priority. Grain that will not dry outside is dried by the longpit hearths."
boats = "The lines inside the bar every workable day, the Hessa rowing with ours and in their own boat. The catch is next to nothing until the cod come back."
the_ice = "WHEN THE BAY ICES (about W46): VOLUNTEERS ONLY, the jarl's word. Ilmo's five teach - never alone, a rope between each pair, an axe to test every step. The pole net under the ice for flatfish and small cod; seal at the breathing holes with the harpoons."
foraging = "Solvi's ten on the tide rocks, seaweed cut off frozen stone, shellfish, roots and river snails - all of it eaten. YLVA AND OSSUR SNARE THE WHOLE GROUND TO THE EDGE, the river scrub and the upper shoulder."
indoor = "THE HESSA TONGUE every evening at the back of longpit 1, the man with the broken leg teaching the house tongue - Tova, Aki, Gest, Kelda, Ylva, Ranulf and whoever sits down; Arna's reindeer suits; Ranulf's rope in the evenings; AKI'S MAP finished, soot and oil on sealskin, THE LAW 17 EDGE DRAWN from Ylva's walking with a gap in the middle to close in summer, under the reeve's beam and never copied; Aki and Tova at the old marks with Vigmar in the evenings; the forge as Brek likes, Hafli one-handed."
watch = "Two men on the tower every night in two-hour turns. One short blast on the horn means come and look."
peat_and_fire = "The peat walls walked every D1 and after rain. The drowned fire ring still walked every morning with a bare palm."

[build_plan]
constraint = "Hands, not materials. 108 sticks on the terrace; about 130 man-days of stone quarried."

[[build_plan.queue]]
what = "LONGPIT 4"
needs = "about 250-300 more man-days, two thirds of it walls and roof turf, then framing; sticks and stone exist"
target = "NEXT YEAR. About 100 of 350-400 man-days in, footings dug, FORTY-TWO POST HOLES lined and turfed, to be proved at the thaw. A spring-to-summer job, about three weeks of twenty hands in dry weather."
why = "Thirty-four to a pit."

[[build_plan.queue]]
what = "A PROPER FORGE"
needs = "about 30 sticks and a season of grey band stone"
target = "Not this year. Erik said so out loud and it cost him."
why = "Making tools and bar. Lockable - the only building here worth robbing besides the storehouse, and it has no door."

[[build_plan.queue]]
what = "THE BLOOMERY"
needs = "a stone-and-clay stack a man's height with a slag tap-hole, four men on the bellows in shifts, two digging ore, one roasting - and ONE BURN IS ONE WHOLE CHARCOAL CLAMP"
target = "undecided"
why = "Nothing else can pay the Y4 iron. Hafli and Brek have never seen one and say so."

[[build_plan.queue]]
what = "THE GREY MARE"
needs = "twenty people out of the Keel, then cordage that does not exist on this coast, then a hull rebuild"
target = "cordage Y3 W14, boatwrights Y4"
why = "Erik swore at the burial ground that she will sail again before he joins his father."

[buildings.the_bay]
"the tower" = "Timber, 22 sticks, on four proven holes; hooded and lined with the old storehouse lookout's bench and hood, the night and winter post. A HORN ON THE PLATFORM. Sees past the north headland and over the shoulder to the moor edge."
"the hearth" = "The centre of everything. NO HEARTH IN HALDVIK GOES FULLY COLD, the Turning excepted, and then it is sat."
"longpit 1" = "12 x 8 m aisled, turf and stone walls, driftwood frame, turf roof, roof vent over the hearth line. Sleeps 25, 34 tight. Holds the main hearth, so everyone passes through it."
"longpit 2" = "Same build. Byre against its east gable."
"longpit 3" = "12 x 8 m. Aki's bench against the west wall in the good light; Vigmar's corner and the lesson board. The clean room."
storehouse = "10 x 10 m dressed grey stone, the whole sealed store, a door and the reeve's beam across it. NOBODY SLEEPS IN IT - Enna's ruling, backed by the jarl."
"washhouse and ward" = "One building, half washhouse and half sick ward, a real wall between and two doors at opposite ends, one hearth in the middle wall serving both. Enna's design."
"the forge" = "Stone and turf, sealskin bellows, anvil, full smith's kit. NO DOOR AND NO LOCK. Hafli's clay-and-stone smelting shaft against the outside wall."
"the smokehouse" = "Double size, about 500 kg a week, never the ceiling - the catch is. Fuel is riving waste. INGRA'S FIRST WARDING GOES HERE, and then a season of watching before anything is laid on a building people sleep in."
"the byre" = "27 stalls against longpit 2's east gable. Peat litter under the animals doubles the dung heap, which is what keeps the shoulder from going to nothing in four years."
"the Keel" = "The Grey Mare upside down over a metre-deep pit, turf to the keel, skins over her back, doorway at the stern. Holds twenty, warmer than longpit 1."
"Ranvi's lean-to" = "Doubles as the birth-house, though births go to the ward now."
"the weir" = "Stone, two cruives in the gap, standing all year."
"the channel" = "The gap moves with every gale. THE BAR MARKS, on Skelva's method: an in-line from a low post on the shingle to a high one on the terrace edge, and a turning pair on the north shoulder. RE-SOUNDED AFTER EVERY BLOW AND THE BACK POST MOVED, for ever; forgetting it has cost a guest's hull twice now."
"drying racks" = "40 m plus Sigra's stack. A rack is four uprights, a rail and a day's withies."
also = "Drainage across the terrace. Three fermenting pits in the bank. Herdis's unfired pots - no wheel, no kiln; winter vessels are pits with turf lids. THE BURIAL GROUND: fourteen stones in the shallows."

[buildings.the_strand]
_ = "Five kilometres south-west. SHUT FOR THE WINTER from W36; Hovard's crew home. Next year it opens again with the men rotated, Hovard keeping the beach, and peat boated in for the pans if wanted - peat never makes charcoal."
"the windrow" = "About three hundred sound whole trunks over two hundred paces, and a dozen fresh from the W36 gale, two whole pines with the roots on."
"salt pans" = "Three, ONE CRACKED by the sea in the W36 gale."
"charcoal clamps" = "On bare shingle. The last one drowned by the sea in the W36 gale."
"Hald's Coal" = "Tows timber rafts of 40-50 sticks round the headland, half tide up only."

[buildings.the_shoulder]
"the fields" = "Two, sown sixteen days apart so one gale cannot take both; both harvested. The lower third of the first field floods. THE KITCHEN CROPS - kale, peas, turnip - kale standing through the frost for the winter green. Next year's planting is to be rethought over the winter: place, timing, and channels so the field does not flood."
"the peat cuttings" = "Where the bog ore is, and where Nagholt is."
"the fire ring" = "45 x 30 m trench round the underground peat fire, drowned in Y2 W26 and cold since. Walked every morning with a bare palm."
grazing = "Sheep, goats, the cow. YLVA'S REINDEER GROUND AND AUD'S BARLEY GROUND ARE THE SAME FIELD and nobody has settled it. THE WHOLE SHOULDER TO THE MOOR EDGE IS HALDVIK'S BY LAW 17; the Ivven have not agreed, and a treaty still wants a tongue. The hunt's standing word: if they kill first, let them have it; what we kill first is ours."
Nagholt = "A burned house twenty-four metres long under 60 cm of peat, traced by rod and recorded on three sticks that live in different buildings. The pit is filled back in; no mark on the ground. Every peat face opened is a dig."
