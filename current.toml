# Haldvik - current. The present state; update every week. Player-readable.

_ = "The present only: what is true or owed now. Nothing historical - that is log.toml. People in people.toml, laws and treaties in their file, world and practice in readme.toml."
date = { year = 3, week = 15, day = 2, season = "spring by the calendar; the hard cold runs to about W6" }
morale = 7
paused_at = "PLAY PAUSED AT Y3 W15 D2, MORNING - W15 is not yet logged. D1 COUNCIL ON THE PLOTS: Aki - 46 plots, homes only (Market Line blocks kept for Haldvik: market, storage, workshops; Egg Line pits along its top), about 1 ha of the 3.5 inside the shoulder line; if all 38 hearths claim, the council chooses first (Halvar's marked; Vigmar, Fenn), then the ten heads of work, then TWENTY-FIVE NUMBERS BY LOT on KELDA'S FLAT STONES (Kelda realises; Solvi laughs). A stick for the reeve and each hearth that claims. GUDNY stands: the first choosers take the spring and gate plots; widows with small children should draw before the rest. THE JARL: order of drawing does not change the odds; AKI: it is the choosing before the draw that matters to her. THE JARL: she hears tomorrow. AFTER, FENN AND INGRA: Fenn will die on the bench by the fire that came over the sea - give the council choice to Tova; INGRA WANTS A PLOT on a lane between Solvi's and the jarl's, children going past, and THE JARL CHOOSES IT FOR HER. FENN on hearths: custom under law 10 - anyone of fifteen with their own fire, a couple one hearth, children in it until grown; grown children at their mother's fire and next winter's fifteen-year-olds are the jarl's to judge; gift or right - say which. THE JARL: THIS SPRING'S ALLOTMENT, ONCE; after that land from the jarl when he chooses; grown children and next winter's fifteens may claim this week; when two hearths become one, one plot goes back to Haldvik, same if a plot loses its owner; no hearth holds two; a Standing this year on land law; nobody moves out this year; plots are sticks for years. TOVA draws with the others. The jarl's idea - Fenn chooses and gives the plot to Gudny, she returns her lot - FENN: clean if said aloud, but NINE WIDOWS WITH SMALL CHILDREN, not one; the eight will notice who got it for standing. INGRA: in a longpit you are someone Haldvik feeds, on a plot a hearth; a plot is what a widow can give her sons; thirty-four to a pit no widow sleeps a night through. THE JARL: FENN AND TOVA TO BRING WAYS TO THE PROBLEMS; COUNCIL D6, A STANDING D7 - ONE LAW FOR HOLDING LAND IN HALDVIK. D1 evening THE JARL SAYS IT AT THE BOWL: one allotment, claims this week, a Standing D7, nobody claims before; Gudny nods. D2 morning THREE LONG: TWO HESSA SAILS past the north headland, Skelva's first; ILMO: they came."
mood = "The thaw came clean and the ground is open: ditches, new strips, seaweed on the fields, boats inside the bar, and a plan for the year said at council. Hungry and working. The walker has not been seen since the fields, and people have started to say it is done."
where_people_sleep = "Thirty-four to a pit in longpits 1, 2 and 3, twenty in the Keel, the six Hessa at the back of longpit 1, nobody outside."
clocks = [
  "THE YEAR'S PLAN (Y3 W8 council, Aki's stick): fields W8-10; longpit 4 W10-13 after the holes are proved; the strand W10 with eight - three pans on peat, two clamps; the survey W10-12; the cod W12; the Hessa W14, paid in oil, the two tusks and 2 kg of nails, Ingra and Gest north with them, home the last week of autumn by the deal.",
  "The equinox (W7) was clouded out; Osvi has no sun measurement yet.",
  "SUMMER - the Needle crossing, north on the high moor about 20 km out, give or take 10 (Aki's two sticks).",
  "Every D1 - the land plan at council, the map on the bench, so there is a plan by spring.",
  "Y3 W8 - the thaw. Longpit 4's forty-two post holes opened and watched a fortnight before a post goes in.",
  "Y3 W12 - the cod back on the offshore bank. THE COD CAME W14, THICK. 825 at W15 and climbing; the ceiling now is salt, smoke and racks, not fish. Each gale week pulls it closer.",
  "Y3 spring - Ingra north to Kolvenn for at least a summer; the coals sealed with Fenn. The fields dug the week the spade goes in; Aud wakes a hundred grains four weeks before sowing.",
  "Y3 W14 - the Hessa, with cordage and wood; a new deal cut as one. Ilmo's six go home when the ice lets them, and Vask hears about the iron.",
  "Y4 W14 to W39 - the master and Bruni, for 25 kg of worked iron that does not exist and cannot be made without a bloomery.",
]

