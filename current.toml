# Haldvik - current. The present state; update every week. Player-readable.

_ = "The present only: what is true or owed now, rewritten whole every week. Nothing historical - that is log.toml. Standing facts (world, ground, land plan, practice, people, laws and treaties) are in notes.toml."
date = { year = 3, week = 35, day = 1, season = "autumn" }
morale = 9
paused_at = "Y3 W35 D1. W34 is logged. Asta born and named; Solvi has told Torgest to ask again at the Turning; a Skeld ship seen far east at midsummer (Teppo); the Ivven pole hung."
mood = "Full and easy after a safe birth, the ale in the boil. Under it, talk round every hearth of a long striped ship on the ice road: some afraid, a few who will not say what they hope."
where_people_sleep = "About twenty-five to a pit in longpits 1-4; nobody outside. Ingunn and Asta in the ward. THE KEEL holds the threshing floor and the brewing; the Grey Mare left as she is. Ingra and Gest at Kolvenn until W39."
