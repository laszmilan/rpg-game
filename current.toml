born_here = "Nine living: three to women carrying at the landing (Y1); Ketil Bjarnsson (Y1 W20); Thora, Sigrid's (Y1 W41); Herdis's daughter (Y2 W14, unnamed); Bjarn, Ingunn's (Y2 W18); Runa's son (Y2 W27, unnamed); Hild's daughter (Y2 W30)."
the_reconciliation = "108 sailed + 9 born living - 13 of the 14 dead (Thora's son was born dead here and is not among the 108) = 104."
resident_strangers = "SIX HESSA off Ilmo's boat, driven in Y2 W36, under Haldvik's law and fed on the jarl's word on the same ration until the ice lets their boat swim. One leg broken and knitted. They teach the Hessa tongue in the evenings and the ice by day."

[food]
in_store_kg = 825
what_it_is = "About a third the thirty Ivven deer, quartered and frozen under the reeve's beam and going into the bowl a little each day. The rest dried and smoked fish and seal, salted whale, eggs in ash, frozen walrus, the Hessa barley and peas, rendered fat, birds, berries and seaweed. Seal and whale oil plenty. Milk from the cow. The W4 headland bearded seal quartered under the beam, its fat rendered. TWENTY-FOUR MORE IVVEN DEER (W6), skinned and gutted, frozen under the beam."
sealed_and_not_food = "THE SEED IS IN THE GROUND (sown Y3 W11): 200 kg barley and 100 kg of peas in Aud's fields. The henbane seed for the herb strip. The byre is kept for the spring by the jarl's word."
ale = "What is left of Aud's ale, under Sigra's hand."
the_ration = "From Y2 W51: THE THIRTY-THREE PROTECTED AT FOUR-FIFTHS (the children, the woman carrying, the five nursing) and THE SEVENTY-SEVEN OTHERS AT THREE-FIFTHS, the Hessa among them - about 300 a week. Within that, a working and a sitting portion: whoever is out on a head of work's task eats more, whoever sits eats less; never the children, carrying, nursing or sick, who also get fresh fish, raw liver and milk first. Aki marks who went out. Weighed in public by Vigmar, checked by Sigra."
standing_food = "Anything that swims or walks is eaten. Fresh before stored. The ice fished every workable day."

[resources]
salt = "RUNNING LOW AGAIN - most of the store went into the cod in W14; the strand pans on peat send up what they make, the cracked one strapped; two pans lost two days to scouring after the W13 whale."
charcoal = "About 670 kg. The 50 off the Nagholt floor goes back under it by law 18."
peat = "About 200 m3, far more than a winter burns (about 35). Walls walked after rain and every D1."
iron = "About 5 kg of bar after Brek's eight replacement knives (W6), about 2 kg usable in the Nagholt lumps (kept under law 18, to be named at the door), one fist-sized bloom of Hafli's, and one cracked saw plate of hard steel. The Y4 price is 25 kg worked, about 33 of bar - it cannot be paid out of what exists."
hooks = "About 700, enough for four long-lines."
"rivets and nails" = "A keg of each."
"rope and line" = "Eight coils of ship's rigging; the cliff line, 130 paces of doubled hemp; sixty paces of sealskin-and-bast; walrus-hide strap in 35 and 15 paces drying on terrace posts. No cordage on this coast; 400 paces due Y3 W14."
"hides and cloth" = "41 sealskins, fifteen dressed. Six bolts of wool, almost no linen. Forty-eight reindeer hides - Arna's winter suits. Two sheepskins. Nine bundles of sinew. Two pieces of Ivven hide worked thin as cloth. Two dressed deer hides given to Enna by the Ivven (W12). The W4 bearded seal hide cut to soles for the ice crew, the scraps to mitten palms."
barrels = "Five ships' casks and ten Hessa kegs and barrels, three of them holding the seed. Scald, lye, rinse and scald over three days before use."
"lamp oil" = "A third of a cask, plus the seal and whale oil."
"birch tar" = "About 2 litres from the Ivven and most of Vask's small barrel."
hardwood = "Eighteen two-metre squared lengths and three stem-knees of Hessa stock, less Ilmo's strakes and the sled runners."
tools = "Anvil and full smith's kit. Six axes, four adzes, three augers, nine spades, iron wedges. Two sleds with hardwood runners (Y3 W1). Gear for three boats and two nets, one rigged on a pole for under the ice. FOUR BARBED HARPOON HEADS. A bone hide scraper. The saw: beaten straight, nine teeth snapped, slow and binds in green wood. The quern: shimmed, grinds coarse. THE TEN IVVEN KNIVES ARE SPENT on the thirty deer, and EIGHT OF HALDVIK'S OWN, THE JARL'S AMONG THEM, on twenty-four more (W6); Brek's eight replacements handed out (W7)."
arms = "19 spears, 11 axes, 4 swords, 22 shields, 6 mail, 9 helms, 5 bows. Fourteen men who have been in a real fight. No defence built."
boats = "Ottersnout (sound) and Widow's Promise (in hand, Leif and Steinn) on the sand. The Grey Mare is the Keel. Two ship's boats, one faering. Hald's Coal laid up; Torgest steers her this year. Ilmo's boat, strakes set. Tavi's old wreck on the sand."
ivory = "Two walrus tusks, forearm-long, under the reeve's beam."
missing = "No cooperage. No plough - two ploughshares and nothing to pull them. No kiln. No boatwright who can loft a hull."

