  "BY MIDSUMMER (W20) - Brek puts his hand on iron out of a real stack by the autumn boat if the stack is up by then with a clamp to burn. THE STACK STANDS (W19 D7).",
  "BY MIDSUMMER (W20) - Enna names the woman carrying.",
  "BY ABOUT Y3 W21 - AUD'S SKEP hung by the wild hive in the valley before the swarm goes (Aud, W19 D5); she carries it, Ylva walks her by the blazes; the swarm carried home at night with a cloth over the mouth to its stone-ringed place in the lee of the stone band.",
  "ABOUT Y3 W21 - THE WHALE MEAT dry enough to come down (Ilmo); then longpit 4's middle wall.",
