resident_strangers = "Bruni of Kolvenn, to Y2 W34."
away = "Ingra and Gest at Kolvenn until W29."
born_here = "Seven. Three to women who were carrying at the landing, all delivered in Y1. Then KETIL Bjarnsson Y1 W20; THORA, daughter of Sigrid, Y1 W41; HERDIS'S DAUGHTER Y2 W14, still unnamed; BJARN, son of Ingunn and of Bjarn who drowned before he was born, Y2 W18."
the_reconciliation = "108 sailed, 14 dead, 7 born here, plus Bruni. That is 102."

[food]
in_store_kg = 2440
what_it_is = "Dried and smoked fish and seal are the bulk. Then eggs in ash, birds, greens and berries and seaweed and sprouted grain, rendered fat, about 520 l seal oil, AND MILK from the cow that calved. And from the W22 trade: 300 kg six-row barley, 200 kg dried peas, 80 kg rendered fat."
sealed_and_not_food = "150 kg of the new barley held back as seed and Aud has it, 40 kg Hessa peas, 60 kg Haldvik peas. SEED. Eating it is theft from the colony, said by the jarl in those words."
ale = "None."
the_ration = "FULL, from Y2 W11 d1, cut on the stick as the jarl's word and not the reeve's arithmetic. About 465 a week at 102 souls. Weighed in public by Vigmar, checked by Sigra. Vigmar's condition, granted: the day it goes back down is named when it comes, not left to drift."
the_target = "FIFTEEN THOUSAND KILOS BY FIRST FROST. Aki's breakdown: cod five, salmon two and a half with the weir standing and twelve hands, seal two, birds and eggs three, everything else two. Fifteen and a half, and every line assumes nothing goes wrong. IT IS NOT THE FISH, IT IS THE HANDS."

[resources]
salt = "About 250 kg. Three pans running, plus 9 a day at best."
charcoal = "About 350 kg with a clamp burning, plus about 50 kg lifted off the Nagholt floor. TARGET 1000 BY FROST - three more clamps - and the forge then runs all winter down to 200, which has never been done here because they were always too poor in coal to burn it when nobody was watching."
peat = "About 130 m3 sound from last year, of which 95 is dry and stacked, PLUS about 70 m3 cut and walled in W21. TARGET 120-150 for the year, so roughly half is in. The window closes about W28, because a cutting must dry before the autumn rains at about W33."
iron = "About 10 kg of bar. PLUS 3-4 kg of corroded lumps off the Nagholt floor, of which Brek reckons half comes back under the hammer, so call it 2 kg usable. PLUS one fist-sized bloom of Hafli's. PLUS TWO CRACKED SAW PLATES, which are better hard steel than anything in the bar. THE Y4 BOATWRIGHT PRICE IS 25 KG OF WORKED IRON, which wants about 33 kg of bar. IT CANNOT BE PAID OUT OF WHAT EXISTS."
hooks = "About 800, enough for four or five long-lines."
"rivets and nails" = "A keg of each."
"rope and line" = "Eight coils of ship's rigging, plus the Grey Mare's standing rigging spliced into 130 paces of doubled and served hemp - THE CLIFF LINE. Sixty paces of sealskin-and-bast spare. There is no cordage on this coast and 400 paces are coming at Y3 W14."
"hides and cloth" = "31 sealskins, fifteen sets dressed by Arna. Six bolts of wool. Almost no linen. AND FOURTEEN REINDEER HIDES, two of them white, hollow-haired, warmer than sealskin at a third the weight. Four bundles of dried sinew: bowstring, and thread that does not rot. Two folded pieces of hide worked so thin and soft they hang like cloth, which nobody here can yet reproduce."
barrels = "Five ships' casks, two coopered Hessa kegs from Y1, and four more kegs and two barrels traded W22. THE VESSEL PROBLEM IS MORE THAN HALVED. They want scalding, ash lye, rinsing and scalding again over three days before use."
"lamp oil" = "A third of a cask, plus the seal oil."
"birch tar" = "About 2 litres, from the Ivven. Glue, waterproofing, seam-sealing. Kolvenn has barrels of it and Haldvik has five casks that leak and three hulls on a beach."
hardwood = "Twelve squared lengths and two stem-knees traded W22, on top of six lengths and one knee given in Y1. It is two-metre stock and will not make a long post."
tools = "Anvil and full smith's kit. Six axes, four adzes, three augers, nine spades, and IRON WEDGES. Gear for three boats and two nets. AND A REINDEER-BONE HIDE SCRAPER, given with the Ivven hides on purpose, because you do not give a man skins and no way to work them."
arms = "19 spears, 11 axes, 4 swords, 22 shields, 6 mail, 9 helms, 5 bows. Fourteen men who have been in a real fight. NO DEFENCE BUILT."
boats = "Ottersnout and Widow's Promise on the sand in the bay, seagoing hulls and not fishing boats; the Ottersnout is sound again and the Widow's Promise is in hand. The Grey Mare is the Keel. Two ship's boats work the lines, tide-limited by the bar, and one of them is just back off a two-week repair. Hald's Coal at the strand. One faering."
missing = "NO SAW AT ALL AND NO WAY TO MAKE ONE. No cooperage. No quern yet - Ormar has the bedstone, not the runner. No plough, though there are two ploughshares and nothing to pull them. No kiln. No boatwright who can loft a hull."

