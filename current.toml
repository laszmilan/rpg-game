# Haldvik - current. The present state; update every week. Player-readable.

_ = "The present only: what is true or owed now, rewritten whole every week. Nothing historical - that is log.toml. Standing facts (world, ground, land plan, practice, people, laws and treaties) are in notes.toml."
date = { year = 3, week = 20, day = 1, season = "summer" }
morale = 8
paused_at = "Y3 W20 D1, MORNING, COUNCIL. W19 is logged. On the table: THE FIRST BURN - Brek's stack stands, the clay drying, Arna's bellows nearly done, about a burn's worth of roasted ore, one clamp to burn; seven people for three days. ORMAR'S TWELVE free now the salmon pits are dug: what next (the forge wants 30 sticks and has 25; the strand logs to rive). AUD'S SKEP dry by about D2 - to the valley with Ylva. MIDSUMMER: Enna names the woman carrying."
mood = "Pleased with itself: henbane in the herb strip at last, hiving bees found in the valley, two smoke-houses drawing and three salmon pits dug, Brek's stack on the sand. Under it the cod thin, and a stake in the cuttings where a strap went back into the ground."
where_people_sleep = "Thirty to a pit in longpits 1, 2 and 3, fourteen in the Keel, nobody outside - the 104 at home. Ilmo and Oski at the back of longpit 1. Ingra and Gest at Kolvenn. Longpit 4 roofed and empty but for the whale meat on the tie-beams."
clocks = [
