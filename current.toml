# Haldvik - current. The present state; update every week. Player-readable.

_ = "The present only: what is true or owed now, rewritten whole every week. Nothing historical - that is log.toml. Standing facts (world, ground, land plan, practice, people, laws and treaties) are in notes.toml."
date = { year = 3, week = 18, day = 1, season = "summer" }
morale = 8
paused_at = "Y3 W18 D1, MORNING, COUNCIL. W17 is logged. On the table: THE FORGE AND BLOOMERY - where and how (Brek: beside the smokehouse; seven people three days a burn; about 1,020 kg charcoal; Vask's first half about 1,400 kg); the cod thinning from this week (Hjalti); longpit 4 about 220 of 250-300, roof turf going on; then the two smoke-houses; sticks 25 for a forge that wants 30."
mood = "Fat and busy: full bowls of cod, the full ration said, the jarl home with a deal, two Hessa sworn in with the whole hall, the walls of longpit 4 up. Under it, three Ivven dead at the moor edge in the W16 blow, and Ylva's black ridge where the walker's line ends."
where_people_sleep = "Thirty-four to a pit in longpits 1, 2 and 3, twenty in the Keel, nobody outside. Ilmo and Oski at the back of longpit 1. Ingra and Gest at Kolvenn."
clocks = [
  "Y3 W18 D1 - COUNCIL ON THE FORGE AND BLOOMERY: where and how.",
  "From Y3 W18 - the cod run thins (Hjalti).",
  "BY MIDSUMMER (W20) - Brek puts his hand on iron out of a real stack by the autumn boat if the stack is up by then with a clamp to burn.",
  "THE CLAIMS: 58 plots for 55 hearths, chosen in the drawn order with Aki and Vigmar after work - council, the ten heads in their drawn order, the widows' blocks, then the common stones 1-33. Fourteen cut by W16: the council, the ten heads, Gudny and one other widow.",
  "THE CUT BOARD SHELVED (W17 D3) until something happens or a better idea; Vigmar keeps two planed strips under the beam.",
  "INGRA AND GEST AT KOLVENN from Y3 W16 until the autumn boat; the coals sealed with Fenn; Solvi keeps Ingra's plot.",
  "Y3 W33, THE AUTUMN EQUINOX - Osvi's noon-sun measurement; the spring one (W7) was clouded out.",
  "Y3 W39, THE LAST WEEK OF AUTUMN - THE AUTUMN BOAT: eight coopered barrels for 100 l of oil and hooks; Ingra and Gest home; KOLVENN IS TOLD WHETHER IRON HAS COME OUT OF THE BUILDING - if not, the master stays home in Y4 and nobody is owed.",
  "Y3 W39, END OF AUTUMN - THE JARL ASKS ENNA ABOUT PREGNANCIES.",
