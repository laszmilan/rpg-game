total_head = 38
_ = "Thirty-eight head against twenty-two at Y1 W50. The cow calved and there is MILK, which this settlement has never had and which is the best thing there is for a child that will not feed. The pigs are a boar and a sow. Pigs are the fastest protein anybody has."
the_problem = "THE HERD HAS NEARLY DOUBLED AND THE HAY HALF FAILED. Twenty-seven stalls for thirty-eight head. Last winter twenty-two head wintered on seaweed off the tide rocks because nothing was cut at all, and two old sheep and a goat died anyway. Thirty-eight head on half a cut is worse than that."
fodder = "THREE CUTS. The first (W22) about half a stack, half of it sound; the second (W24) stacked sound, raked into cocks ahead of the drizzle; the third (W26) lighter and sound, cured in a day. Near enough a winter for thirty-eight head with seaweed off the tide rocks to stretch it, as last winter."

[health]
carrying = "A third Enna will not name. RUNA DELIVERED A LIVING BOY Y2 W27 d3, turned by Enna. HILD DELIVERED A LIVING GIRL Y2 W30 d6, quick and clean, the henbane unused. Mothers and children well."
standing = "Runa is up and mending with a boy at the breast. Sigra's daughter is weeks mending after a bad tear and has been told once, privately, that she should not carry again. Herdis's daughter is well and on two women. One crushed hand permanently weak. One strand man with a mended jaw and four teeth gone."
henbane = "FOUND AGAIN in W30 d1-d3 by SOLVI, trampled into the ground, and SOME SEED with it. Enna looked it over and said: it will do. BY THE JARL'S WORD IT IS GROWN IN A HERB GARDEN, and the seed is enough for a tiny one. WILLOW BARK TEA from the withy beds as well - bitter, eases a fever and dulls a pain, far weaker than henbane, and plenty of it."
ennas_five = "Bedding (4 t dry, enough to throw out and replace twice), the green ration from W40 with pine tea twice a week, latrines downstream and used in the dark with no exceptions, combs and hot water, roof vents. Lye handwashing at every door by law, and soap."

[work_split]
_ = "Set W21. Forty-five committed, twenty free as surge."
"boats and lines" = 10
strand_now = "TEN from W29 d3, the pans burning through the night."
"gutting, hanging and smoking" = "15 plus children"
foraging = 10
snares = 3
strand = 7
surge = "Twenty, and Sigra gets them whenever construction can spare it, because ten men on the lines land more than fifteen pairs of hands can hang."
peat_watch = "Standing order from Y2 W23 d4: every week on d1 one person spends the day walking and checking the peat walls, and the walls are checked again after every rain. The fire ring is still walked every morning with a bare palm."
council_W30 = "Most hands on the food - the salmon peak, the lines, the racks, the salt. Any hands free dig longpit 4's footings. The seal cull is done. THE HARVEST WHEN AUD SAYS SO, by the jarl's word W30 d7."
standing_work = "Berries and the autumn bedding cut sit with foraging under Solvi as standing work, not as separate orders. Children help where they can, on everything. Fresh fish is eaten without limit, because it costs nothing that would have been kept."

[build_plan]
constraint = "MATERIALS ARE NO LONGER THE CONSTRAINT AND HANDS ARE. 108 sticks on the terrace, against about 100 for longpit 4; 130 man-days of stone quarried for a forge that will not be built this year."

[[build_plan.queue]]
what = "LONGPIT 4"
needs = "about 100 sticks and 120-150 man-days of stone, both of which exist"
target = "STARTED Y2 W27 d3: turf, stone, footings, about eighty man-days in of 350-400. FREE HANDS ONLY from W30 d1, food first. The jarl has accepted it may not stand by frost - we will see."
why = "Thirty-four to a pit."

[[build_plan.queue]]
what = "THE QUERN"
needs = "the runner stone off the black band, eye bored through and socket cut, to sit on Ormar's bedstone"
target = "ORDERED W30 d7. Ormar from W31. DIFFICULTY 6, set on the order, rolled in the open when he is done."
why = "Meal and bread. Ormar has dressed the bedstone and has watched a runner made and never made one."

[[build_plan.queue]]
what = "A PROPER FORGE"
needs = "about 30 sticks and a season of grey band stone"
target = "NOT THIS YEAR. Erik said so out loud and it cost him."
why = "Making tools and making bar. Lockable and discreet - it is the only building here worth robbing and the storehouse has a door and the forge has not."

[[build_plan.queue]]
what = "THE BLOOMERY"
needs = "a stone-and-clay stack a man's height with a slag tap-hole, four men on the bellows in shifts, two digging ore, one roasting - AND ONE BURN IS ONE WHOLE CHARCOAL CLAMP"
target = "undecided"
why = "Hafli has never seen one and would be guessing at every part, and says so. Brek would be guessing beside him and says so out loud. Nothing else can pay the Y4 iron."

[[build_plan.queue]]
what = "THE GREY MARE"
needs = "twenty people out of the Keel, then cordage that does not exist on this coast, then a hull rebuild"
target = "cordage Y3 W14, boatwrights Y4"
why = "Osvi declared her afloat at the Turning and Erik swore at the burial ground that she will sail again before he joins his father."

[buildings.the_bay]
"the tower" = "Finished Y2 W24 d2. Timber, 22 sticks, on the four holes Ormar proved for a fortnight. A man on the platform every daylight hour sees past the north headland and over the shoulder to the moor edge."
"the hearth" = "The centre of everything. NO HEARTH IN HALDVIK GOES FULLY COLD, the Turning excepted, and then it is sat."
"longpit 1" = "12 x 8 m aisled, turf and stone walls, driftwood frame, turf roof, roof vent over the hearth line. Sleeps 25, 34 tight. Holds the main hearth, so everyone passes through it."
"longpit 2" = "Same build. Byre against its east gable."
"longpit 3" = "12 x 8 m. Aki's bench against the west wall in the good light. The clean room."
storehouse = "10 x 10 m dressed grey stone. The whole sealed store is in it. NOBODY SLEEPS IN IT - Enna's ruling, backed by the jarl: people in the food store is the coughing. A kerb, hooded bench and ladder on the seaward corner of the roof serve as the lookout, manned every night."
"washhouse and ward" = "One building, half washhouse and half sick ward, a real wall between and two doors at opposite ends, one hearth in the middle wall serving both. Enna's design. Nursing is hot water, and somebody is in a washhouse every day all winter, so the sick are not alone at night."
"the forge" = "Stone and turf, sealskin bellows, anvil, full smith's kit. NO DOOR AND NO LOCK. Hafli's clay-and-stone smelting shaft stands against the outside wall. Running one day a week."
"the smokehouse" = "DOUBLE SIZE. About 250 kg a batch, three or four days a batch, so about 500 kg a week, AND IT HAS NEVER BEEN THE CEILING - the catch is. Fuel is riving waste and there are heaps of it. INGRA'S FIRST WARDING GOES HERE, and then a season of watching before anything is laid on a building people sleep in."
"the byre" = "27 stalls, shared wall against longpit 2's east gable. AND IT IS NOW SHORT: 27 stalls, 38 head. Peat litter from the ruined stack goes in under the animals - sour and empty on its own, but it comes out the other end as muck and roughly doubles the dung heap, and the dung heap is the only thing keeping that shoulder from going to nothing in four years."
"the Keel" = "The Grey Mare upside down over a metre-deep pit with a turf-and-stone kerb, turf packed to the keel, skins over her back, doorway cut at the stern end. Holds twenty and is warmer than longpit 1."
"Ranvi's lean-to" = "Doubles as the birth-house, though births go to the ward now."
"the weir" = "Stone, two cruives in the gap, standing all year. Took about 2400 kg of salmon wet in its first season."
"the channel" = "RE-SOUNDED IN HASTE ON W22 D5-6. The gap has moved north and narrowed - twenty paces, and Hald's Coal runs loaded FROM HALF TIDE UP ONLY, two windows a day instead of four. IT MUST BE RE-SOUNDED AFTER EVERY GALE, FOR EVER, and this was forgotten once already at the cost of a guest's hull touching in front of everybody. THE BAR MARKS ARE BUILT, W23 d1, on Skelva's method: riven posts with crossboards, not stone heaps. The in-line runs from a low post on the shingle to a high one on the terrace edge; the turning pair is on the north shoulder, and when it closes you turn for the beach. After every blow the channel is sounded and the back post moved."
"drying racks" = "40 m plus Sigra's stack. A rack is four uprights, a rail and a day's withies - it can be doubled in days and is not a ceiling on anything."
also = "Drainage cut across the terrace. Three fermenting pits in the terrace bank. Clay and Herdis's pottery on the bank - no wheel, no kiln, so most winter vessels are pits in the ground with turf lids. THE BURIAL GROUND: fourteen stones in the shallows."

[buildings.the_strand]
_ = "Five kilometres south-west. SEVEN MEN ON ROTATION since W21 for salt, charcoal and their own fuel. Thirteen came home."
"the windrow" = "400 m of ocean driftwood, whole trunks, sound, with a fair bite taken out of it. Everything built so far has come off it. It is not a store and nobody has counted what is left since it reopened."
"the sawpit" = "Idle and irrelevant. THERE IS NO SAW."
"salt pans" = "Three, all running, about 9 kg a day at best."
"charcoal clamps" = "Running on bare shingle, which is what stopped a second peat fire. One home, one burning."
"Hald's Coal" = "Afloat, recaulked, tows timber rafts of 40-50 sticks round the headland, in the half-tide window only."

[buildings.the_shoulder]
"the fields" = "Two, sown sixteen days apart (W12 and W13 d4-d5) so one gale cannot take both. THE FIRST FIELD LAID FLAT BY THE W29 RAIN AND SPROUTING IN THE EAR (seen W31 d1); THE SECOND GREEN AND STANDING. THE KITCHEN CROPS WENT IN AS LAST YEAR - kale, peas, turnip - amounts not recorded. The lower third of the first field went under standing water and that seed is gone. THE ONLY BARLEY SEED IN HALDVIK is what is held back in the sealed store."
"the peat cuttings" = "Where the bog ore is, and where Nagholt is."
"the fire ring" = "45 x 30 m trench containing the underground peat fire. Walked every morning with a bare palm. A new twenty-pace arc was cut out from the north side in W23 d5 round a warm patch, which is now inside the ring. ON W25 d6 THE PALM READ WARM AGAIN on the inside edge of the new arc. DROWNED W26 d1-d3: twenty people a day carrying water from the river, three times, on the jarl's order. Cold and wet since. Still walked every morning."
grazing = "Sheep, goats, the cow. YLVA'S REINDEER GROUND AND AUD'S BARLEY GROUND ARE THE SAME FIELD and nobody has settled it."
Nagholt = "A burned house twenty-four metres long under 60 cm of peat, traced by rod and recorded on three sticks that live in different buildings. The pit is filled back in. NO CAIRN and no mark on the ground, on Vigmar's argument. Every peat face opened from now on is a dig."
