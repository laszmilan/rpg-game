[food]
in_store_kg = 7810
what_it_is = "THE SALMON (W31-33): smoked and racked, about 1,400 kg wet dry-salted in Hessa barrels, THREE PITS AND THE JARL'S WHEY BARREL fermenting. THE SEAL (W30): about 560 kg dry-salted, 225 l of oil. THE CLIFFS (W24): about 900 kg of eggs in ash, 150 of birds. COD smoked and racked. BARLEY: about 200 kg for the quern. PEAS: about 250 to eat. A third of a keg of the whale meat. Seaweed dried for winter. Crowberry packed in fat. Fresh cod on top; milk from the cow."
sealed_and_not_food = "SEED BARLEY 250 KG and SEED PEAS 200 KG, sealed (the jarl: the only way we ever have more). 40 kg of barley in the ale. The henbane seed in the herb strip. The byre kept for the spring."
ale = "THE NEW ALE in the boil (about 150 l, smoky, bog myrtle), drinkable about W36. A few bunches of myrtle drying in the Keel. Little left of the old."
the_ration = "FULL RATION from Y3 W17 - about 480 a week from the store for about 107, fresh fish on top. The children, the carrying, the nursing and the sick get fresh fish, raw liver and milk first - Ingunn now among the nursing. Weighed in public by Vigmar, checked by Sigra."
the_winter_outlook = "Last year: 5,765 after the salmon (W34), 4,975 at W40, 2,985 at the Turning, 125 at Y3 W13. This year 7,810 at W35. Winter cod eaten fresh, not salted. The cod inside the bar until about W37, then the ice."
standing_food = "Anything that swims or walks is eaten. Fresh before stored. The ice fished every workable day."

[resources]
salt = "NONE. The pans cold from W30 D1 (the jarl); Hovard's eight on charcoal; winter cod eaten fresh."
charcoal = "ABOUT 490 KG. Two more clamps due before the frost. A burn eats a clamp, about 300; a clamp is about twenty windrow trunks (Hovard), the wood for near a hundred building sticks (Ormar)."
peat = "About 165 m3, less the smoke-houses' burning; a winter of hearths takes about 35. Walls walked after rain and every D1."
iron = "ABOUT 10 KG OF BAR ON VIGMAR'S BEAM. TRADE KNIVES: four on Brek's bench in oiled cloth, one hung on the Ivven pole, one Solvi's for the shaving. About 2 kg usable in the NAGHOLT LUMPS, kept under law 18, to be named at the door. One cracked saw plate of hard steel. Ore: about a burn's worth dug and drying; Geir digs the other way from the stake. The Y4 price is 25 kg of worked iron (Vigmar reckons about 33 of bar; whether plain bar answers it is Vask's to say at the landing)."
hooks = "About 700, enough for four long-lines; some go on the autumn boat."
"rivets and nails" = "A keg of rivets; the nail keg less 2 kg traded to the Hessa (Y3 W15)."
"rope and line" = "About 500 paces of Hessa cordage (400 for the Grey Mare's rigging, 100 for the ice); eight coils of ship's rigging; the cliff line, 130 paces of doubled hemp; sixty paces of sealskin-and-bast; walrus-hide strap."
"hides and cloth" = "Fourteen fresh seal hides (W30) and 41 sealskins, fifteen dressed. Six bolts of wool, almost no linen. Forty-eight reindeer hides - Arna's winter suits. Two sheepskins. Nine bundles of sinew. Two pieces of Ivven hide worked thin as cloth. Two dressed deer hides (Enna's)."
barrels = "Every Hessa barrel and keg full (salmon, seal, the whey barrel) and the five ships' casks; EIGHT MORE COOPERED BARRELS due on the autumn boat. Scald, lye, rinse and scald over three days before use."
"lamp oil" = "About 225 l of seal oil (W30), about 60 l of whale oil (W18), a third of a cask besides. 100 l owed on the autumn boat for the barrels."
"birch tar" = "About 2 litres from the Ivven and most of Vask's small barrel."
hardwood = "Twenty squared two-metre lengths and three stem-knees from the Hessa (Y3 W15), kept for boats and the Y4 boatwrights."
tools = "Anvil and full smith's kit. Six axes, two adzes, three augers, nine spades, iron wedges, knives and sickles. Two sleds with hardwood runners. Gear for three boats and two nets, one rigged on a pole for under the ice. Four barbed harpoon heads. The saw: beaten straight, nine teeth snapped, slow. The quern: shimmed, grinds coarse. Forty peeled drill poles in the Keel."
arms = "19 spears, 11 axes, 4 swords, 22 shields, 6 mail, 9 helms, 5 bows. Fourteen who have been in a real fight; forty-six stood for the drill (W29)."
boats = "Ottersnout (sound) and Widow's Promise (in hand, Leif and Steinn) on the sand. The Grey Mare is the Keel. Two ship's boats, one faering. Hald's Coal, Torgest steering, carries trunks and charcoal from the strand. Ilmo's boat. Tavi's old wreck on the sand."
missing = "No cooperage. No plough - two ploughshares and nothing to pull them. No kiln. No boatwright who can loft a hull. No salt."

