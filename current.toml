# Haldvik - current. The present state; update every week. Player-readable.

_ = "The present only: what is true or owed now. Nothing historical - that is log.toml. People in people.toml, laws and treaties in their file, world and practice in readme.toml."
date = { year = 3, week = 16, day = 7, season = "summer" }
morale = 7
paused_at = "PLAY PAUSED AT Y3 W16 D7, EVENING, HALDVIK BEACH; EARLIER AT KOLVENN D1-D3, behind the houses with the three old women, Ilmo translating (Skelva: not the one for this). W16 D1 evening landed; THE BOAT SHED: the jarl ran his hand along the new hull (Haldvik nails) before greeting; VASK: a man who looks at the ship first has been told what this shed is; bread and salt, the guest words, knives under the bench; THE GIFT, ONE IRON ADZE: the master tested it, better iron than any in Kolvenn; whose? THE JARL: HALDVIK'S; the master said the name and put it in BRUNI'S hands, not his rack; VASK: clever, he will think whether it was only a gift; the iron in daylight. D1 night Vask's fire, nothing asked; Ingra to Skelva's house (Aili's mourning house). D2 THE IRON: VASK - eighteen knives went to the deer people; they bought iron through Kolvenn three lifetimes; no iron to them till the 25 kg is paid. THE JARL: cannot promise; they will have the 25, and more goes to the deer people if there is more. VASK: better a no he can believe; but your smith has never seen the building - what does Kolvenn have in the fourth summer? THE JARL: then he loses his master a week and a half and knows what kind of people we are. VASK: honest; THE AUTUMN BOAT IS TOLD WHETHER IRON HAS COME OUT OF THE BUILDING; if not the master stays home and nobody is owed; say it has when it hasn't and four places know. AGREED, cut on two sticks (Skelva, Gest). BRUNI: the master never gave him a tool in twelve years; the ice took his mother's cousin; he said at the Turning Ilmo's six were at Haldvik. THE JARL called him boatwright. ILMO'S DOOR AND OSKI'S STAYED SHUT (Ilmo's wife took another man at midwinter; Oski's mother dead, his brother's house said the name is said). THE JARL: come home with me. ILMO: not as a guest - to become something; OSKI TOO or he stays; he swears over ember at the Standing and learns the words on the way. OSKI (the leg Enna set): yes - it will ache where the healer can hear him complain. VASK at supper: waited all evening to hear it; THE JARL: I will have them if you don't; VASK: not his to keep; the widow waited a month longer than custom; EVERY KOLVENN BOAT FISHING THE COAST WILL PUT IN AT HALDVIK TO SEE ILMO, AND HALDVIK FEEDS THEM; THE JARL: every Hessa fed gave back more - come as you like. THE ONE JAR OF MEAD, poured down the bench. D3 MORNING the weather steersman: wind backed SW, it blows hard tomorrow for a day - better on a beach than at sea. THE OLD WOMEN: why lay the old ones back? THE JARL: we do not fear them; peat, then curiosity; the best words we had. THE OLDEST: people don't fear their own grandmothers - ARE YOU THE ONES BEFORE, COME BACK? THE JARL: perhaps their great-great-grandchildren. SHE: the sleeping ground takes one of theirs every few winters; the old ones' ground does not take you, it comes to look at you. ONCE, WHEN HER MOTHER WAS A GIRL, IT CAME DOWN TO THE SPIT FOR A WINTER AND STOOD IN THE SNOW; a young man threw a spear; FOUND IN THE MORNING ON HIS BACK IN ITS TRACKS, NO MARK, EYES OPEN; it never came again. THE SPEAR stood upright in the snow ten paces past where it stood, head clean, no blood; her mother said he did not miss. THEN: D3 THE OLDEST asks that names read out of the ground go north on the autumn boat for her keeping; THE JARL: they will have the names or they won't, and thanks - maybe a life saved. INGRA at the boat: Aili held her hands a long time and said nothing, then let her in; go home, and let nobody be careful with Solvi. THE JARL: we could say your sight is gone. GEST: she keeps me, not the other way. ILMO at sea: he never saw it, it was her mother's winter; that is why he asked the old women to see the jarl and not Vask. D4 THE BLOW sat out on a beach; Ilmo teaches Oski the oath. W16 D7 EVENING HOME. HALVAR'S WEEK: the cod every day but D4, salt gone again; AKI'S RODS down the tracks' line - nothing, soil then gravel; D4 AN IVVEN BAND with the scarred man, FEVER AND COUGH, asked for the healer; ENNA with Ossur and two spears two days at the edge, test difficulty 9, [8,1] FAILURE - an old woman and two small children died; D6 the band went north-east with its dead, the scarred man would not look at her; ENNA IN THE WARD APART A WEEK, nobody coughing, Hild on rounds. YLVA home D6, test difficulty 7, [6,11] MIXED: KOLBEIN wrenched a knee chest-deep in a bog hole in the blow, carried in. YLVA: past the crown a wide wet basin, A RIDGE OF BLACK STONE in the peat, heavy, rust-red where broken, no cairns or marks; THE NEEDLE WENT ROUND IN CIRCLES OVER IT; THE WALKER'S LINE RUNS STRAIGHT INTO THE RIDGE, PRINTS HOURS OLD GOING OFF NORTH-EAST; not followed. The Needle back in the jarl's hands."
mood = "Full bowls on the cod, a land law, and every claiming hearth with a number in its hand. The tracks came across Aud's new strips the night of the Standing, so nobody says it is done any more. The jarl, the ember-wife and Gest are gone north; Halvar sits in the chair he does not want."
where_people_sleep = "Thirty-four to a pit in longpits 1, 2 and 3, twenty in the Keel, nobody outside. Ilmo's six gone home. Ten away at Kolvenn (the jarl, Ulf and six, Ingra, Gest); Ylva and two on the moor."
clocks = [
