# Haldvik - current. The present state; update every week. Player-readable.

_ = "THE PRESENT, AND ONLY THE PRESENT. What is true or owed now, brought up to date every week. Nothing dated, nothing historical - that is log.toml. People are in people.toml; the laws and treaties in laws_and_treaties.toml; the world, rules and standing practice in readme.toml. Player-readable."
date = { year = 3, week = 1, day = 1, season = "spring by the calendar, the hard cold until about W6" }
morale = 5
paused_at = "Y3 W1 NOT YET BEGUN. Play opens at D1 council."
mood = "THE WALRUS LEFT ON THE BAR (Y2 W52): four days shut in by a gale on the sitting portion, then three walrus in plain sight on the worst ice there is and the jarl's order to leave them, repeated at every door; nobody argued out loud and nobody went. THE NEW CUT (W51), NAMED OUT LOUD AND WEIGHED: the children cut for the first time, the boar eaten, the seed kept - and the same night the roads got their names, Whale Line and Grip Line and four up for sale, and the pit shouted them out. TWO THIRDS OF A WHALE (W50), off the worst ice there is, nobody under the boat, the jarl on the rope and Halvar in the boat - told and retold. THE LAND ON THE BENCH (W48): private ground two years after it was promised, argued over the map in front of half the settlement - something to talk about in the dark besides the bowl. THE THIRD CUT (W47), the morning after the Turning's goodwill; blows struck over a hearth place; Ulf nearly drowned on the ice and the ice gave a seal. Hungry, short-tempered, holding. Before that, the Turning kept loud and every coal alive. The store only goes one way now, and some are counting knocks - the hull, the ward, the boy's fingers. Against that, Haldvik stood and said its ground out loud, 71 to 2, and ate three deer off it the next morning. The Ivven band fed the jarl a leg like a dog and walked off with four deer, and everyone saw it from the terrace; that is remembered too."
where_people_sleep = "Thirty-four to a pit in longpits 1, 2 and 3, twenty in the Keel under the Grey Mare, the six Hessa at the back of longpit 1, and nobody outside. Byre against longpit 2's east gable."
clocks = [
  "EVERY MONDAY - THE LAND PLAN goes on at council, the map on the bench, so there is a plan by spring.",
  "Y3 W8 or so - THE STORE EMPTY at the last two weeks' net draw (about 240 a week), some four weeks before the cod. The ration was set to stretch thirteen weeks; it needs about 120 a week coming in to do it, and the last two weeks brought 95 and 30.",
  "Y3 W8 - the thaw. Longpit 4's forty-two post holes opened and watched a fortnight before a post goes in.",
  "Y3 W12 - the cod back on the offshore bank. Until then the lines take little.",
  "Y3 W14 - the Hessa, with cordage and wood, and a new deal cut as one. Ilmo's six go home when the ice lets them.",
  "Y4 W14 to W39 - THE MASTER AND BRUNI, for 25 kg of worked iron, which does not exist and cannot be made without a bloomery.",
]

[souls]
total = 104
of_15_or_more = 77
women_of_15_or_more = 44
of_12_to_14 = 4
children_under_12 = 23
veterans_of_real_fighting = 14
dead = 14
born_here = "Nine. Three to women carrying at the landing, delivered in Y1; KETIL Bjarnsson Y1 W20; THORA, daughter of Sigrid, Y1 W41; HERDIS'S DAUGHTER Y2 W14, unnamed; BJARN, son of Ingunn, Y2 W18; RUNA'S SON Y2 W27, unnamed; HILD'S DAUGHTER Y2 W30."
the_reconciliation = "108 sailed, 9 born here living, 14 dead - but THORA'S SON was born dead here and is among the 14 without being among the 108 or the 9, so the living are 108 + 9 - 13 = 104, all Haldvik's own, all home. (Corrected Y2 W47; 103 had been carried since the stillbirth.)"
resident_strangers = "SIX HESSA off Ilmo's fishing boat, driven in by the W36 gale. Five work; one has a leg broken below the knee, set, knitting by about W42. Under Haldvik's law and at its work, fed on the jarl's own word under Haldvik roofs, on the same fifth cut as everyone from W40, until the ice goes and their boat can swim. They teach the Hessa tongue in the evenings and will teach the ice."

[food]
in_store_kg = 1820
store_last_year = "6610 at the Turning last year. At a winter draw of 420 against little income, this store is empty about Y3 W1-2, some ten weeks before the cod come back."
what_it_is = "Dried and smoked fish and seal are the bulk. About 500 kg salted whale and 150 kg smoked; about 1,050 kg of W25 eggs in ash; about 400 kg salted seal; birds, greens, berries, seaweed; rendered fat; about 140 kg of Haldvik barley for the pot; from the W22 trade 300 kg barley, 200 kg peas, 80 kg fat. About 450 kg raw of FROZEN WALRUS meat and blubber (W44), keeping in the cold. Seal oil about 680 l and whale oil about 350 l. Milk from the cow."
sealed_and_not_food = "SEED: 200 KG OF BARLEY by the jarl's word, 40 kg Hessa peas, 60 kg Haldvik peas, and the henbane seed for a herb garden. Eating it is theft from the colony, said by the jarl in those words."
ale = "Aud's first-field keg, the rest of it under Sigra's hand, strong and tasting of peat smoke. A SECOND BATCH MALTING: twenty kilos of eating barley for sixty litres at the Turning, midwinter W46."
the_ration = "FROM Y2 W51 D1, THE JARL'S WORD, NAMED ON THE DAY: THE THIRTY-THREE PROTECTED AT FOUR-FIFTHS (twenty-seven children, the woman carrying, the five nursing) AND THE SEVENTY-SEVEN OTHERS AT THREE-FIFTHS, the six Hessa among them - ABOUT 300 A WEEK, against a sustainable 270, to stretch the store thirteen weeks to the cod; plus or minus luck. THE SEED IS NOT TOUCHED; THE BOAR IS EATEN. (Before: a third cut from W47, a fifth from W32.) Earlier terms: Not the children, not the women carrying, not the sick - AND THE NURSING MOTHERS WITH THE CARRYING at Enna's asking: Hild, Runa, Ingunn, Herdis, and Sigrid feeding two. They go first after the children for fresh fish, raw liver and milk. ABOUT 370 A WEEK with the Hessa. FROM W41, A WORKING RATION AND A SITTING RATION inside that same total: whoever is out at the rocks, boats, snares or ice on a head of work's task eats more, whoever sits by the fire eats less; not the children, the carrying, the nursing or the sick. Aki marks who went out each night; Fenn's sitting portion was weighed first, in public. Weighed in public by Vigmar, checked by Sigra."
standing_food = "ANYTHING THAT SWIMS OR WALKS IS EATEN - roots, river snails, seaweed, shellfish, whatever the snares and the tide give. Fresh is eaten before stored. The boats fish inside the bar every workable day."

[resources]
salt = "About 290 kg. The strand is shut for the winter; ONE OF ITS THREE PANS IS CRACKED. Salting takes about 100 kg per 500 of fish."
charcoal = "About 670 kg, plus about 50 off the Nagholt floor. The forge runs as Brek and Hafli like; the target was 1000 and the strand shut short of it."
peat = "About 200 m3, far more than a winter needs - last winter burned about 35. Walls walked after every rain."
iron = "About 9 kg of bar, about 2 kg usable from the Nagholt lumps, one fist-sized bloom of Hafli's, and ONE CRACKED SAW PLATE of hard steel. THE Y4 BOATWRIGHT PRICE IS 25 KG OF WORKED IRON, about 33 kg of bar. IT CANNOT BE PAID OUT OF WHAT EXISTS."
hooks = "About 700, enough for four long-lines."
"rivets and nails" = "A keg of each."
"rope and line" = "Eight coils of ship's rigging, and the cliff line - the Grey Mare's standing rigging spliced into 130 paces of doubled and served hemp. Sixty paces of sealskin-and-bast spare. WALRUS-HIDE STRAP, about 35 and 15 paces in two lengths (W44), stretched between posts on the terrace to dry by the thaw. No cordage on this coast; 400 paces coming Y3 W14."
"hides and cloth" = "41 sealskins, fifteen sets dressed. Six bolts of wool, almost no linen. FORTY-EIGHT REINDEER HIDES, three of them Haldvik-killed, hollow-haired, warmer than sealskin at a third the weight - Arna's winter suits come out of them. Two sheepskins from the cull. Nine bundles of dried sinew. Two pieces of Ivven hide worked thin as cloth that nobody here can reproduce."
barrels = "Five ships' casks and ten coopered Hessa kegs and barrels. Scald, lye, rinse and scald again over three days before use."
"lamp oil" = "A third of a cask, plus the seal oil and whale oil."
"birch tar" = "About 2 litres from the Ivven and most of the small barrel Vask gave. Kolvenn has barrels of it."
hardwood = "Eighteen squared lengths and three stem-knees of two-metre Hessa stock, less what went into Ilmo's strakes. It will not make a long post."
tools = "THREE KNIVES held by Vigmar for the Ivven, at ten hides a knife. Anvil and full smith's kit. Six axes, four adzes, three augers, nine spades, iron wedges. Gear for three boats and two nets, ONE RE-RIGGED ON A POLE FOR UNDER THE ICE. FIVE BARBED HARPOON HEADS. A reindeer-bone hide scraper. THE SAW: the sprung plate beaten straight, NINE TEETH SNAPPED - cuts slow, binds in green wood, cross-cuts seasoned timber. THE QUERN: the eye a finger off true, shimmed, grinds coarse."
arms = "19 spears, 11 axes, 4 swords, 22 shields, 6 mail, 9 helms, 5 bows. Fourteen men who have been in a real fight. NO DEFENCE BUILT."
boats = "Ottersnout (sound) and Widow's Promise (in hand, Leif and Steinn) on the sand, seagoing hulls. The Grey Mare is the Keel. Two ship's boats work the lines, tide-limited by the bar. One faering. Hald's Coal laid up for the winter; TORGEST STEERS HER NEXT YEAR, off the pans. ILMO'S HESSA FISHING BOAT, strakes set, fishing inside the bar. Tavi's old Hessa wreck on the sand."
ivory = "TWO WALRUS TUSKS, forearm-long, in the storehouse under the reeve's beam, until they can be sold or the halls can afford them."
missing = "No cooperage. No plough, though there are two ploughshares and nothing to pull them. No kiln. No boatwright who can loft a hull."

[livestock]
ewes = 9
rams = 2
goats = 4
cow = 1
heifer_calf = 1
pigs = "NONE. The boar eaten W51 d2; the sow died in the W46 cold. No pigs unless got from the Hessa."
chickens = "13 hens, in a basket by longpit 2's hearth since W46, laying better for it. The three cocks went into the Turning soup - no cock left."
dogs = 3
in_the_byre = "Seventeen head in twenty-seven stalls, the gaps stuffed with peat. The hay - three cuts - carries them. Kept for next year's births: both rams, every hen."

[health]
carrying = "A third Enna will not name. Runa's boy and Hild's girl are well, their mothers mending."
standing = "THE JARL: two ribs cracked (W36), hauling again from W40 d6; thinner; BOTH PALMS ROPE-BURNED RAW from the whale rope (W50). HAFLI: THE LAST TWO FINGERS OF HIS LEFT HAND taken at the knuckle (W38) after the saw burn went bad; the stumps dry and closed, the palm cool; right hand only until Enna says. ULF, through the ice W47 D6: lives, keeps his toes, the skin off two, OFF HIS FEET TO ABOUT W49. ONE HESSA leg set below the knee, knitting. Sigra's daughter mending, told privately she should not carry again. Herdis's daughter well and on two women. One crushed hand permanently weak. One strand man with a mended jaw and four teeth gone."
henbane = "Some in hand, found by Solvi, and seed enough for a tiny herb garden, by the jarl's word. Willow bark tea as well - bitter, weaker, plenty of it."
ennas_five = "Bedding (4 t dry, enough to throw out and replace twice), the green ration from W40 with pine tea twice a week, latrines downstream and used in the dark with no exceptions, combs and hot water, roof vents. Lye handwashing at every door by law, and soap."

[work]
_ = "Winter. The strand is shut and the ground frozen; food and upkeep first."
standing_priority = "Cutting before construction, meat and fish; eggs and greens are a priority. Grain that will not dry outside is dried by the longpit hearths."
boats = "The lines inside the bar every workable day, the Hessa rowing with ours and in their own boat. The catch is next to nothing until the cod come back."
the_ice = "THE ICE IS FISHING AND HJALTI'S (W48): he picks the twelve with Ilmo, and the working mark follows his word. WORKED FROM W47 D5, VOLUNTEERS, twelve in six roped pairs under Ilmo's five, an axe to test every step, nobody past Ilmo's line short of the open water at the bar. The pole net from hole to hole for flatfish; a harpoon waiting at the seal holes (three seen). ABOUT 120 KG RAW A WEEK while the ice holds and nobody else goes in."
foraging = "Solvi's ten on the tide rocks, seaweed cut off frozen stone, shellfish, roots and river snails - all of it eaten. YLVA AND OSSUR SNARE THE WHOLE GROUND TO THE EDGE, the river scrub and the upper shoulder."
indoor = "THE HESSA TONGUE every evening at the back of longpit 1, the man with the broken leg teaching the house tongue - Tova, Aki, Gest, Kelda, Ylva, Ranulf and whoever sits down; Arna's reindeer suits; Ranulf's rope in the evenings; AKI'S MAP finished, soot and oil on sealskin, THE LAW 17 EDGE DRAWN from Ylva's walking with a gap in the middle to close in summer, under the reeve's beam and never copied; Aki and Tova at the old marks with Vigmar in the evenings; the forge as Brek likes, Hafli one-handed."
watch = "Two men on the tower every night in two-hour turns. One short blast on the horn means come and look."
peat_and_fire = "The peat walls walked every D1 and after rain. The drowned fire ring still walked every morning with a bare palm."

[build_plan]
constraint = "Hands, not materials. 108 sticks on the terrace; about 130 man-days of stone quarried."

[[build_plan.queue]]
what = "LONGPIT 4"
needs = "about 250-300 more man-days, two thirds of it walls and roof turf, then framing; sticks and stone exist"
target = "NEXT YEAR. About 100 of 350-400 man-days in, footings dug, FORTY-TWO POST HOLES lined and turfed, to be proved at the thaw. A spring-to-summer job, about three weeks of twenty hands in dry weather."
why = "Thirty-four to a pit."

[[build_plan.queue]]
what = "A PROPER FORGE"
needs = "about 30 sticks and a season of grey band stone"
target = "Not this year. Erik said so out loud and it cost him."
why = "Making tools and bar. Lockable - the only building here worth robbing besides the storehouse, and it has no door."

[[build_plan.queue]]
what = "THE BLOOMERY"
needs = "a stone-and-clay stack a man's height with a slag tap-hole, four men on the bellows in shifts, two digging ore, one roasting - and ONE BURN IS ONE WHOLE CHARCOAL CLAMP"
target = "undecided"
why = "Nothing else can pay the Y4 iron. Hafli and Brek have never seen one and say so."

[[build_plan.queue]]
what = "THE GREY MARE"
needs = "twenty people out of the Keel, then cordage that does not exist on this coast, then a hull rebuild"
target = "cordage Y3 W14, boatwrights Y4"
why = "Erik swore at the burial ground that she will sail again before he joins his father."

[land_plan]
_ = "TALKED AT COUNCIL Y2 W48 D1 IN FRONT OF HALF THE SETTLEMENT, AND NOT DECIDED. The foundation the jarl wants, to be walked and cut in spring under laws 6-9 (private ground; no pegging; survey first, settlement first, allotment after; the jarl allots in spring)."
kept_for_haldvik = "Vigmar's list: the beach and the terrace edge (boats, racks, smokehouses), the burial stones, the weir and the river mouth, the four springs, the tower's ground, the grey stone band (the only quarry), the peat cuttings (every hearth, and Nagholt under them)."
homes = "GIVEN BY HEARTH, SIZED BY HEAD. Thirty-eight hearths today (Vigmar): fourteen couples, most with children; nine widowed with children (Gudny, Ingunn, Ossur among them); fifteen who came alone, mostly men, Vigmar one. PLOTS MEASURED FOR HEARTHS NOT YET MADE, like Sigra's children's. Cut, and proof given - worked when people have the time and means."
blocks = "The jarl's sketch, the numbers Ormar's to set: BLOCKS OF FOUR TO SIX HOMES AS THE GROUND GIVES, each home about 10 x 20 m, built only in the middle along shared walls with 5 m of garden round; blocks 3 m apart, so about 13 m roof to roof. ORMAR: turf walls do not burn, roofs do; lanes kept clear and walked, nothing stacked in them, a water butt at each block end, no roof over a lane, gaps along the wind. A MAIN ROAD 5 m wide from the gate to the harbour, with channels at its side. AKI: 38 hearths in blocks of six is seven blocks with four plots spare, about a hundred by a hundred metres - a hectare."
waste = "ENNA: NOT INTO THE HARBOUR - it lands on the shellfish beds and the gutting beach, food children eat raw. Latrines and waste go downstream of everything eaten or drunk: below the weir, or out past the rocks. It cost two graves to learn."
the_longpits = "When people move out, THE JARL'S DIVISION: LONGPIT 1 THE GREAT HALL; LONGPITS 2 AND 3 STAY LONGPITS - barracks and homes for those who will not build a house (many of the old and the single, the jarl expects), thralls if Haldvik ever has them, and guests - the details decided later; LONGPIT 4 THE WARD AND WASHHOUSE. LONGPIT 4 BECOMES THE WARD AND WASHHOUSE, the two halves walled apart with a door at each end (Enna: a longpit for the sick, a door at each end), AND THE PRESENT WARD AND WASHHOUSE COMES DOWN. RANVI'S LEAN-TO, THE PEAT WALLS AND THE FERMENTING PITS MOVE UP FROM THE TERRACE TO THE SHOULDER as well. Between them that frees more of the terrace."
fields = "COMMON FOR YEARS YET (Aud, the jarl agreeing): two hundred kilos of seed and not the hands or dung for the two fields there are; forty strips means half to weeds. AUD CHOOSES WHERE THE FIELDS GO, inside or outside the future walls, and nothing is permanent - fields inside the walls can move out when the space gets tight."
the_walls = "THE JARL'S FOUR, said out loud over the map as things that will not exist for many, many, many years: (1) A DITCH AND BANK across the terrace, next year or the one after - Halvar: a summer for thirty men, one gate, the beach at our backs. (2) ABOUT 470 M OF WALL round the shoulder, a half circle 150 m out from the foot of the slope, about 3.5 ha inside it - room for a generation; Halvar would need everyone to hold it. (3) ABOUT 300 M OF WALL BETWEEN THE TERRACE AND THE SHOULDER, against the wind, and a second wall against the sea or the land. (4) A WALL WHERE THE WATER MEETS THE SHORE, to replace the ditch and bank. HALVAR: give land inside the line the wall will take, not scattered over the hill; walk it with him in spring when the snow is off, and the ground will say where the curve goes. The whole walled Haldvik one day about 4.7 ha."
the_forge = "THE PROPER FORGE GOES UP OFF THE BEACH, AGAINST THE QUARRY'S CUT FACE at the back of the terrace, earth banked up its two sides - about the work of building in the open, with a stone wall already standing (Ormar; no cave anywhere in the band, oracle 2). The quarry moves to a new face further north. BREK: it wants air as well as shelter - the bellows must draw, THE SMOKE GOES UP A HOOD IN THE ROOF; THE BLOOMERY STANDS OUTSIDE AGAINST THE WALL, never under a roof. ERIK: Brek tells Ormar what is wrong BEFORE it is built. NOTHING WITHIN 10 M OF IT OR ITS WORKING GROUND. After the thaw."
terrace_plots = "NO HOUSE PLOTS ON THE TERRACE - the jarl, Y2 W50, after Halvar's counsel in private (give flat ground only to those who cannot climb, or the shoulder counts it): the old and the lame live in the longpits or the hall, where they would want to be anyway. THE IDEA SET ASIDE WAS: SIX LONG, NARROW HOUSE PLOTS ON THE TERRACE, about 10 m wide and running back 30 m from the edge (Aki), about 0.2 ha; they fit easily on the good ground. The best house ground in Haldvik - who gets them is its own question."
spring_order = "ORMAR, the jarl agreeing (W51): in spring LONGPIT 4 FIRST, then THE FORGE against the quarry face, then ONE BLOCK staked beside the road at the gate end if there is time - most likely only cut and not built in Y3, and that is to be said out loud."
streets = "THE MAIN ROAD straight from the beach up through the terrace to the gate; LANES EAST TO WEST ABOUT EVERY 25 M (a 20 m block and a 5 m lane), blocks between, end-on to the westerlies. Dirt for a long time. THE NAMES, the jarl's word at the W51 meal after the pit shouted it out - the first named roads anyone here has known: THE MAIN ROAD IS GATE ROAD; from the beach up, SALT LINE (the beach, Sigra's), IRON LINE (the terrace, the forge; Brek's), WHALE LINE (the first on the shoulder, for W50), GRIP LINE (the second, for Kelda's dog), and the last four named by the jarl at council Y2 W52 D1: EGG LINE (the fermenting and ash egg pits and the peat go there), MARKET LINE, BARLEY LINE, AND WALL LINE, the eighth, about 150 m up the shoulder, a bare lane just inside the wall with the wall a little further out - NOTHING BUILT AGAINST THE WALL, EVER (Halvar). GATE ROAD AND WALL LINE 5 M WIDE. ROADS AND BLOCKS MEASURED WHEN THE SNOW GIVES, late spring probably. NOT THE DEAD (more dead than roads, more to come, and nobody walks on the dead) AND NOT THE SHIPS (they have their own names)."
proof = "DRAWN ON THE MAP IN SPRING BEFORE ANYTHING IS BUILT. EVERY ROAD NAMED, EVERY PLOT NUMBERED, EVERY HEARTH A PLOT CLAIMED. TWO STICKS PER PLOT - the hearth holds one, Haldvik the other, and a copy kept elsewhere (Fenn: at home ground was held by witnesses and memory, which two winters cannot give). PLAIN UNMARKED STONES AT THE CORNERS (Vigmar: eleven marked stones on this coast already say the ground beyond is not yours)."
promises = "HALVAR WAS PROMISED FIRST PICK when land is allotted, unsaid until the day (people.toml) - HIS PICK, told to the jarl alone Y2 W50: THE PLOT NEAREST THE GATE ON THE SHOULDER, where a Shield ought to sleep. Who else goes first, and whether people choose or are given, is still open."

[ground]
_ = "HALDVIK'S GROUND BY ZONE - what it is, what stands on it, what is free. Kept up to date whenever something is built, moved or cut."

[ground.the_bay_and_beach]
the_ground = "A bay with a BARRED MOUTH and a withied channel that moves with every gale; a SAND BEACH below the terrace; the salmon river coming in at the head of the bay; the seal reef off the north shoulder; the north headland beyond. The burial stones in the shallows. From W46 the bay is iced from the head to the bar, open water along the bar where the tide works."
built = "The drying racks and Sigra's stack, the smokehouse, the forge, the Keel, the boats hauled up and chocked, the low bar-mark post on the shingle, the weir at the river mouth."
free = "The sand above the tideline around them. Below the tideline nothing is built; the beach floods in a gale."
"the smokehouse" = "Double size, about 500 kg a week, never the ceiling - the catch is. Fuel is riving waste. INGRA'S FIRST WARDING GOES HERE, and then a season of watching before anything is laid on a building people sleep in."
"the forge" = "Stone and turf, sealskin bellows, anvil, full smith's kit. NO DOOR AND NO LOCK. Hafli's clay-and-stone smelting shaft against the outside wall."
"the Keel" = "The Grey Mare upside down over a metre-deep pit, turf to the keel, skins over her back, doorway at the stern. Holds twenty, warmer than longpit 1. Flooded a hand deep in the W44 false thaw; a new peat floor laid."
"drying racks" = "40 m plus Sigra's stack, on dunnage under double sailcloth in winter. A rack is four uprights, a rail and a day's withies."
"the weir" = "Stone, two cruives in the gap, standing all year."
"the channel" = "The gap moves with every gale. THE BAR MARKS, on Skelva's method: an in-line from a low post on the shingle to a high one on the terrace edge, and a turning pair on the north shoulder. RE-SOUNDED AFTER EVERY BLOW AND THE BACK POST MOVED, for ever; forgetting it has cost a guest's hull twice now."
"the burial ground" = "Fourteen stones in the shallows."

[ground.the_terrace]
the_ground = "A TURF TERRACE above the beach, about 300 m along the bay and 40 m deep, about 1.2 ha (Osvi's pacing, Aki's map). The only flat, dry, sheltered ground on the map. The grey stone band runs above it at its back; the WET SOUTH END floods and drains badly. Freezes a spade deep from about W38."
built = "Longpits 1, 2 and 3, longpit 4's footings, the storehouse, the washhouse and ward, the byre, the tower, Ranvi's lean-to, the peat walls, the three fermenting pits in the bank, the high bar-mark post on the edge, drainage across it. ABOUT A THIRD OF IT, some 0.4 ha."
free = "About 0.8 ha - the wet south end and the strip along the edge, and between. ROOM FOR TEN OR SO HOUSE PLOTS on the good part if the best ground goes to homes."
"the tower" = "Timber, 22 sticks, on four proven holes; hooded and lined with the old storehouse lookout's bench and hood, the night and winter post. A HORN ON THE PLATFORM, signals cut on Aki's stick (laws_and_treaties). Sees past the north headland and over the shoulder to the moor edge."
"the hearth" = "The centre of everything. NO HEARTH IN HALDVIK GOES FULLY COLD, the Turning excepted, and then it is sat."
"longpit 1" = "12 x 8 m aisled, turf and stone walls, driftwood frame, turf roof, roof vent over the hearth line. Sleeps 25, 34 tight. Holds the main hearth, so everyone passes through it."
"longpit 2" = "Same build. Byre against its east gable; the hens by its hearth."
"longpit 3" = "12 x 8 m. Aki's bench against the west wall in the good light; Vigmar's corner and the lesson board. The clean room."
"longpit 4" = "Footings dug, forty-two post holes lined and turfed, to be proved at the thaw. Next year."
storehouse = "10 x 10 m dressed grey stone, the whole sealed store, a door and the reeve's beam across it. NOBODY SLEEPS IN IT - Enna's ruling, backed by the jarl. The map and the tusks under the beam."
"washhouse and ward" = "One building, half washhouse and half sick ward, a real wall between and two doors at opposite ends, one hearth in the middle wall serving both. Enna's design."
"the byre" = "27 stalls against longpit 2's east gable, the gaps stuffed with peat. Peat litter under the animals doubles the dung heap, which is what keeps the shoulder from going to nothing in four years."
"Ranvi's lean-to" = "Doubles as the birth-house, though births go to the ward now."
also = "Herdis's unfired pots - no wheel, no kiln; winter vessels are pits with turf lids."

[ground.the_shoulder]
the_ground = "THE SLOPE ABOVE THE TERRACE, rising to the moor edge about 4 km out: turf and grazing, peat two spades deep, the barley ground, the grey stone band at its foot. Upper shoulder open to the wind. Haldvik's to the moor edge by law 17 - where the peat turns to bog, from the river scrub in the south round to the north headland. The planned village and the walls are here (land_plan)."
built = "The two fields and the kitchen crops, the peat cuttings, the fire ring, the grey stone quarry, the turning pair of bar marks. Nothing lived in."
free = "Nearly all of it. The 150 m half circle above the terrace, about 3.5 ha, is the ground the land plan looks at."
"the fields" = "Two, sown sixteen days apart so one gale cannot take both; both harvested. The lower third of the first field floods. THE KITCHEN CROPS - kale, peas, turnip - kale standing through the frost for the winter green. Next year's planting is to be rethought over the winter: place, timing, and channels so the field does not flood. Common ground; Aud chooses where they go."
"the peat cuttings" = "Where the bog ore is, and where Nagholt is."
"the fire ring" = "45 x 30 m trench round the underground peat fire, drowned in Y2 W26 and cold since. Walked every morning with a bare palm."
grazing = "Sheep, goats, the cow. YLVA'S REINDEER GROUND AND AUD'S BARLEY GROUND ARE THE SAME FIELD and nobody has settled it. THE WHOLE SHOULDER TO THE MOOR EDGE IS HALDVIK'S BY LAW 17; the Ivven have not agreed, and a treaty still wants a tongue. The hunt's standing word: if they kill first, let them have it; what we kill first is ours."
Nagholt = "A burned house twenty-four metres long under 60 cm of peat, traced by rod and recorded on three sticks that live in different buildings. The pit is filled back in; no mark on the ground. Every peat face opened is a dig."

[ground.the_strand]
the_ground = "Five kilometres south-west: two kilometres of shingle under a wooded shoulder, springs, the driftwood windrow. The sea comes over its low end in a gale."
built = "Three salt pans (one cracked), the charcoal clamp ground on bare shingle, Hald's Coal laid up."
free = "The shingle and the shoulder behind it."
_ = "SHUT FOR THE WINTER from W36; Hovard's crew home. Next year it opens again with the men rotated, Hovard keeping the beach, and peat boated in for the pans if wanted - peat never makes charcoal."
"the windrow" = "About three hundred sound whole trunks over two hundred metres, and a dozen fresh from the W36 gale, two whole pines with the roots on."
"salt pans" = "Three, ONE CRACKED by the sea in the W36 gale."
"charcoal clamps" = "On bare shingle. The last one drowned by the sea in the W36 gale."
"Hald's Coal" = "Tows timber rafts of 40-50 sticks round the headland, half tide up only."
