pigs = "None. No pigs unless got from the Hessa."
chickens = "13 hens in a basket by longpit 2's hearth, laying better for it. No cock."
dogs = 3
kept = "Seventeen head, grazing the shoulder in summer; the byre's twenty-seven stalls in winter, gaps stuffed with peat. Kept for next year's births - both rams, every hen - and not eaten, by the jarl's word in open council (Y3 W1)."

[health]
carrying = "One woman, whom Enna will not name until she shows by midsummer; DUE ABOUT THE HARVEST. Runa's boy and Hild's girl well."
standing = "KOLBEIN: the knee wrenched in a bog hole on the high moor (W16) mending, on a stick, not yet on a crew. GEIR: the crushed hand permanently weak; at the cuttings with Hafli from W18. ENNA: back on her rounds after her week apart for the Ivven fever; nobody in Haldvik caught it. THE JARL: ribs mended enough to haul; palms rope-burned from the whale; THREE FINGERTIPS OF THE RIGHT HAND BURNED on a live coal (W6 D6), scabbed over. INGRA: both hands frost-white to the wrist from a reading (W6 D6); whole, nothing lost, but COLD TO THE TOUCH since - Enna has never seen frost do that; Ingra says it was the frost. HAFLI: last two fingers of the left hand gone, the stumps closed; right hand only until Enna says. LEIF: frostbite W4 - two fingertips kept, nails coming off; THE RING FINGER'S TIP TAKEN AT THE FIRST KNUCKLE (W9), healing clean; back at the steam box. ULF: back on his feet, toes kept. ONE HESSA LEG knitted. Sigra's daughter mending, told not to carry again. The two Ivven-trip haulers' frost-nip peeling. One strand man with a mended jaw."
henbane = "ABOUT ONE DOSE LEFT after the Ivven boy's leg (W12), PLUS THE LEAVES OF TWO VALLEY PLANTS drying under Enna's hand (a dose or two). THREE WHOLE PLANTS from the valley midden (W19) in the herb strip, a ring of stones round them, flowering, to seed at summer's end - NOBODY PICKS FROM THAT BED BUT ENNA. The henbane seed sown in spring. Willow bark tea as well, bitter and plentiful."
ennas_five = "Bedding enough to throw out and replace twice; greens and pine tea twice a week; latrines downstream, used in the dark, no exceptions; combs and hot water; roof vents. Lye handwashing at every door by law, and soap."

[work]
_ = "Summer. The cod thin; the ceiling is salt, smoke and racks, not fish, until the birds and the salmon."
the_cod = "Hjalti's boats every workable day on the offshore bank, in earlier each day as the run thins; Sigra runs the beach - gutting lines, livers in a crock, split fish on the racks, salting the strand's 40 kg a week, the smokehouse day and night."
longpit_4 = "ROOFED W18 D5, about 290 of 250-300 man-days; the doors hung W18 D6. THE MIDDLE WALL WAITS until the whale meat is down (Ormar: up, and there is no draught end to end). Both doors and the vents open; the watch keeps an eye on it."
hands_W19 = "Set Y3 W19 D1: ORMAR'S TWELVE (the smoke-houses W19 D1-D5, Sigra's three salmon pits D6-D7) - FREE FROM W20 D1; THE BLOOMERY (Brek) - Brek, Hafli and two carriers off Ormar's crew (the jarl, W19 D1), Herdis treading clay; THE ORE - Geir, with Hafli, never alone; BOATS (Hjalti) 12 with Ilmo and Oski; BEACH - gutting, racks, smoke-houses, the whale meat (Sigra) 7; STRAND (Hovard) 8 with Torgest; FORAGING (Solvi) 8 + 4 children - SIGRA'S TWO until the birds come to the cliffs; STORE, TALLY, LAW, BAR (Vigmar) 5 - Vigmar, Aki, Fenn, Tova, Osvi; CRAFTS - rope, hides, pots, the bellows (Ranulf, Arna, Herdis) 5 + 2 children; HUNT, SNARES, WEIR (Ylva) 3; FIELDS AND HERB STRIP (Aud) 3, Aud weaving the skep; WIDOW'S PROMISE 2; HEALING 2; SHIELD 1; BYRE 2 children. NOT ON A CREW 8: the five nursing, Kolbein, two of the very old. Away 2. The night watch two a night from the crews, never the boats' morning men; Ilmo and Oski off it."
ilmo_and_oski = "ILMO AND OSKI, sworn Haldvikers (W17 D2), on Hjalti's boats; inside at night and off the watch (the jarl, W17 D1). Kolvenn boats fishing the coast will put in to see Ilmo, and Haldvik feeds them."
the_ore = "GEIR AND HAFLI at the cuttings, never alone. W19 D6 a RUSTED IRON STRAP with a nail hole, found well clear of the Nagholt house, broken on a stone by Hafli who took it for ore; Geir stopped him and came straight down; cut on the stick, PUT BACK by Geir with Fenn's words that evening, A STAKE where it lay; the council told. FROM W19 D7 THE DIGGING GOES THE OTHER WAY (the jarl): if the walker comes to it, the council opens it and lays it to rest."
the_whale_meat = "About 110 kg on lines between longpit 4's tie-beams, both doors and the vents open, the watch looking in; Ilmo pinches a strip each morning. Kolvenn hangs it three weeks under a roof with no walls."
the_strand = "Hovard's eight: three pans on peat, the clamps; every kilo of salt goes up to Sigra."
foraging = "Solvi's ten and Sigra's two on the tide rocks and the far rocks toward the strand at the big tides - seaweed (eaten and dried for winter), shellfish, teeth-grass, moss boiled twice - fills more than feeds; no berries until late summer (crowberry), rosehip after. Pine needle from the valley. Ylva and Ossur snare the ground to the edge; Ossur walks the upper line and the Nagholt tracks twice a day."
indoor = "Arna's reindeer suits. Ranulf's rope. Aki's map under the reeve's beam, never copied. Vigmar teaching Tova and Aki the old marks. The forge as Brek likes, Hafli one-handed."
watch = "Two on the tower every night, and a look into longpit 4 at the meat; in the worst cold, changed every hour. HALVAR'S ORDER (W17 D1, the jarl agreeing): NOTHING THROWN AT THE WALKER; harm it only if it harms us. One short blast means come and look (horn signals in notes.toml [laws])."
peat_and_fire = "The peat walls walked every D1 and after rain. The drowned fire ring walked every morning with a bare palm."

[build_plan]
constraint = "STICKS (Ormar Y3 W8, corrected W17): 108 on the terrace, longpit 4 takes about 70, ABOUT 38 LEFT; THE SMOKE TUNNEL takes about 13 (W17 D4), leaving 25 for a forge that wants 30 - 5 short. STRAND LOGS TO BE RIVEN before the forge (the jarl: will find the logs) - hauled 5 km, about 26 a week with twenty men. The Hessa hardwood is kept for boats and the Y4 boatwrights. About 130 man-days of stone quarried."

[[build_plan.queue]]
what = "LONGPIT 4"
needs = "ROOFED W18 D5, doors hung W18 D6. Only the middle wall left, and it waits for the whale meat (about W21)."
target = "The middle wall when the meat is down."
why = "Thirty to a pit. It becomes the ward and washhouse when people move to homes."

[[build_plan.queue]]
what = "THE FERMENTING PITS"
needs = "Where and how Sigra says: deep, by a spring, birch bark, stones, a handful of salt a fish. Done wrong it kills a house; only Sigra has done it."
target = "THE THREE SALMON PITS DUG AND LINED W19 D6-D7 by Ormar's twelve, by the spring behind the stone band, each about a bed's size and deeper than a man's waist, flat stones and birch bark, about 250 kg of fish each (Sigra). THE WHEY BARREL still to set."
why = "The salmon surplus. And ONE BARREL OF FISH IN WHEY, because the jarl wants to taste it before he dies (whey enough for a barrel or two only)."

[[build_plan.queue]]
what = "THE FORGE"
needs = "About 30 sticks (25 in hand now the smoke tunnel is built) and a season of grey band stone, built against the quarry's cut face."
target = "Next in the queue. Against the quarry's cut face (notes [land_plan] the_forge_site). The old forge on the beach works a bloom well enough meanwhile (Brek, W18)."
why = "Tools and bar. Lockable - the only building worth robbing besides the storehouse, and it has no door."

[[build_plan.queue]]
what = "THE BLOOMERY"
needs = "A stone-and-clay stack a man's height, lined with Herdis's clay, a clay bellows nozzle at the foot and a slag tap-hole - NO STICKS (Brek, W18 D1). A SECOND PAIR OF BELLOWS from Arna's sealskins; the forge's stay at the forge. Ore: about 40 kg roasted a burn (Brek); about one burn's worth dug by W18 end. EVERY BURN SEVEN PEOPLE FOR THREE DAYS (Brek, W17): four on the bellows in shifts, two digging ore, one roasting - and one burn is one whole charcoal clamp."
target = "THE STACK STANDS (W19 D7) on the sand beside the smokehouse, back to the westerly; the clay drying; Arna's second bellows nearly done. FIRST BURN: W20, one clamp out of the thousand, about 40 kg of roasted ore, seven people three days - a test when it is done. Iron out of it before the autumn boat."
why = "Nothing else can pay the Y4 iron, and the autumn boat is told whether iron has come out of it. Brek and Hafli have never seen one."

[[build_plan.queue]]
what = "THE GREY MARE"
needs = "Fourteen people out of the Keel, then a hull rebuild. THE CORDAGE CAME Y3 W15 (Ranulf's 400 paces for her standing and running rigging)."
target = "The boatwrights, Y4."
why = "Erik swore at the burial ground she will sail again before he joins his father."
