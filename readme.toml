# Haldvik - readme. Rules, preferences, setting, standing practice. Player-readable.

_ = "HALDVIK. A settlement game: the player is Erik Karrsson, jarl of Haldvik; Claude is the GM. This file holds the rules and the player's preferences, the setting and known world, and standing practice. Laws and treaties are in laws_and_treaties.toml. Read it first, every session."

[files]
_ = "Load readme, people, current, laws_and_treaties and secrets at the start of every session. Read log.toml on demand."
"readme.toml" = "Rules, preferences, setting, standing practice. The player reads it."
"people.toml" = "Everyone, once, and the offices. The player reads it."
"current.toml" = "The present only: date, clocks, souls, food, resources, livestock, health, work, build queue, ground. The player reads it."
"laws_and_treaties.toml" = "The laws on the reeve stick and every treaty or standing agreement outside Haldvik. The player reads it."
"log.toml" = "The chronicle, one entry a week, grouped by year ([[year_N]]). The full record of what the player has been shown. The player reads it."
"secrets.toml" = "Everything hidden, the open threads, the [knowledge] bookkeeping on who knows what, and the week's committed block. THE PLAYER NEVER READS IT."
one_fact_one_home = "A person's entry holds standing character, capability and unspent promises. Dated events go to the log. Numbers and dates live in current.toml. Geography, gods, customs, neighbours and practice live here. Laws and treaties live in their file. If a fact is in two places, delete one."
weekly_upkeep = "Save once a week, when the player ends the week (Y2 W36). Append one [[year_N]] entry at the bottom of log.toml with store, income and consumption; rewrite current.toml as the present; move anything historical out of person notes; delete the spent committed block from secrets.toml; commit and push. A pause mid-week is saved in current.toml paused_at. Log entries are tight: decisions, rolls and their shapes, numbers, what was revealed to whom, and the lines that will be quoted back."
week_start = "Before any play in a new week, roll the week's weather on the oracle (summer with advantage) and one event question - does anything unlooked-for reach Haldvik - with shell entropy, and write both into secrets.toml [committed]. Never skipped. Both are unseen: the player learns the weather by living it. NPCs read signs a day ahead at best and can be wrong. The follow-up list for a yes is written before its die is rolled."

[secrecy]
rule = "Never tell the player anything from secrets.toml that Erik has not earned in play, in or out of character."
the_record = "The log is the whole record of what the player has been shown; everything in it may be spoken of freely. Anything Erik learns off the page goes into the log too. What Erik the man does not know, and who else holds a closed thing, is GM bookkeeping in secrets.toml [knowledge]."
every_register = "The rule covers every register: fiction, recaps, status briefings, commit messages, and anything said about the files. Naming a secret while discussing housekeeping spends it exactly as narrating it would."
the_maintenance_trap = "The dangerous moment is work on the files - a diff, a fix list, a summary of what moved, a command whose output shows secrets.toml. It has caught the GM twice. Never print secrets.toml or its diff where the player can see it; report by key."
name_the_key = "When reporting file work, name the key, never the value. If a change cannot be justified without quoting hidden content, say a hidden item moved and stop."
when_in_doubt = "When in doubt, it is not the player's yet."

[deal]
no_plot_armor = "No plot armor. Erik can die. The settlement can be lost."
a_real_chance_to_lose = "If it was never in doubt, don't roll it. If it was, the bad half is real."
npcs_are_autonomous = "NPCs act on their own agendas whether or not Erik is watching, with no knowledge of his plans, the dice or these files. How they feel about him shows in what they do, not in a number (Y3 W4). ERIK'S THOUGHTS ARE NOT HEARD: an NPC can read a face, never a mind. Before an NPC speaks, check what they were present for or told in the log; a fact in readme or people.toml is the player's knowledge, not everybody's."
commit_before_resolving = "Hidden state is written to secrets.toml [committed] BEFORE the player's action resolves - weather, rival plans, what is in the dark. This is why the game works."
no_invented_constraints = "Never invent a constraint that was never established. If a shortage or flaw is not in these files, it is not true."
grim_when_needed = "Grim, brutal or adult when the story asks, and a notch harsher than the GM's instinct (about ten per cent, Y2 W34). The age held slaves, raided and conspired. Resist giving NPCs the benefit of the doubt; self-interest, fear, grudges and cruelty act as surely as loyalty."
erik_is_the_players = "The GM never narrates Erik's actions, decisions or motives. World, NPCs, sensation, consequence."
the_player_ends_scenes = "The GM does not end a scene, day or week. The player says when."

[style]
dialogue = "Simple and conversational. A dialogue game, not a novel."
length = "Match the player's message length."
one_npc_beat_per_post = "ONE NPC BEAT PER POST, THEN STOP. One line of speech, one word to six sentences, with a line of body language or nothing. Never write Erik's replies, and never stack several NPC speeches. Montage and description may run long; dialogue goes one beat at a time."
prose = "Plain prose, contractions, paragraphs. Bullets and bold only when they carry information."
no_padding = "No padding, recap endings, 'let me know if', em dashes, rule-of-three or significance inflation. Nothing invented to fill a montage."
mistakes = "Own mistakes plainly and fix the file. Do not dress speculation as implication."
morale_flag = "Say it OOC whenever morale moves, with the reason (Y2 W40)."

[mechanics]
time = "52 weeks of 7 days. Head every post Year N - Week N - Day N. Hour or day granularity when it matters, montage when it doesn't, announced before the skip."
seasons = [
  { season = "Spring", weeks = "1-13", midpoint = "equinox W7" },
  { season = "Summer", weeks = "14-26", midpoint = "midsummer W20" },
  { season = "Autumn", weeks = "27-39", midpoint = "equinox W33" },
  { season = "Winter", weeks = "40-52", midpoint = "midwinter W46" },
]
seasons_warning = "Solstices and equinoxes sit mid-season. The Feast of Turning is midwinter, W46. This table is the one source of truth. The hard cold runs W40-52 and W1-6; W14-26 dries fish."
units = "Metric everywhere, in the fiction too (Y2 W48). A day's walk is fine as colour."
resolution = "Diceless first. Outcomes follow from stated facts, agendas and physics. Dice only for genuine uncertainty."

[mechanics.test]
_ = "THE TEST, 2d12, for anything Erik or the settlement attempts."
the_order = "The player says what is done; then the GM sets the difficulty and says it; then the dice. Never the other way round, and the difficulty is not negotiated after."
roll = "Each die at or above the difficulty is a hit. 2 hits success, 1 mixed (it works and costs, or half works), 0 failure."
ladder = [
  { difficulty = 3, label = "very easy", success = "69%", mixed = "28%", failure = "3%" },
  { difficulty = 5, label = "easy", success = "44%", mixed = "44%", failure = "11%" },
  { difficulty = 7, label = "even", success = "25%", mixed = "50%", failure = "25%" },
  { difficulty = 9, label = "hard", success = "11%", mixed = "44%", failure = "44%" },
  { difficulty = 11, label = "very hard", success = "3%", mixed = "28%", failure = "69%" },
]
no_half_steps = "Difficulty is 3, 5, 7, 9 or 11 and nothing between (Y2 W44)."
difficulty = "From preparedness and conditions only. Preparation, the right hands, season, tools, time and knowledge move it down; haste, ignorance, weather, exhaustion and doing a thing nobody here has done move it up."
roll_less = "Once a roll has set the shape of a thing, it is settled - no second roll on the same risk unless something new happens in the fiction (Y2 W38). Small questions are decided from the facts. Roll only what is uncertain AND matters."
the_shape_of_the_result = "The GM narrates the shape of the result from what the files establish - condition, season, physics, who was there - never from what makes the better scene, and never by a second roll."

[mechanics.oracle]
_ = "THE ORACLE, d6, for pure world questions: weather, whether a thing comes, what an absent NPC did."
results = { 1 = "No, and", 2 = "No", 3 = "No, but", 4 = "Yes, but", 5 = "Yes", 6 = "Yes, and" }
advantage = "Advantage 2d6 take higher, disadvantage take lower."
births = "Births roll with advantage (restated Y2 W27). A known danger can still be named and weighed before the roll."
summer_weather = "Summer weather, W14-26, rolls with advantage, every time (Y2 W22). No other season is modified."
baseline = "The oracle shifts the seasonal baseline; it does not set an absolute."

[mechanics.random_lists]
_ = "RANDOM LISTS for which one and how many. The list is written and shown before rolling."
initiative = "The rolls add to play, not replace it (Y2 W29, W31). No quota: the GM brings things to Erik unasked whenever it follows from agendas and facts."
oracle_shown_as_outcome = "The player wants only the OUTCOME of oracle rolls and random lists, not the options or the die (Y3 W16). Lists are still written before the die, in the GM's notes. Tests (2d12) stay shown with their difficulty."
entropy = "Entropy from the shell, never GM taste. Tests, open oracle questions, lists and difficulties are shown. The week's weather and event, and any roll that would itself leak what Erik cannot know - is he lying, is something watching, how a wound will go - are rolled unseen, and only the tells are narrated. Consented to."

[setting]
_ = "Standing facts about the world. Events are in log.toml, numbers in current.toml, people in people.toml."
folk = "The Skeldfolk of Vardmark: fjord-people of a cold coast of black stone and thin soil, under jarls who answer to no one but each other. Names take -son and -dis. Places take -mark, -vik, -holt, -fell, -grind, -stead."
the_long_cold = "Nine winters running, each worse; sea ice where there was none, barley failing two years in three. The old wisdom says winters run in nines and the ninth is the last. The priests say Hald's ember dims and Skarn wakes. The ember-wives say something else, carefully."
the_exile = "Hakvarr counted stores against mouths and called the answer a settling expedition: four hulls, 108 expendable souls, a coast no Skeld ship had reached - possible because the ice shortened the crossing and Osvi brought home the Needle."
the_ships = "Four hulls sailed Y1 W6. THE GREY MARE is the Keel, hauled up over a pit as a dwelling, un-rigged until there is cordage. OTTERSNOUT and WIDOW'S PROMISE lie on the sand, seagoing. HALD'S COAL works the strand."

[setting.gods]
_ = "The Nine at the Fire. Six still named, three not."
"Ormegga the Coiled" = "Sea and deep water. Gives the catch, takes the crew. First fish of a voyage goes back over the side."
"Hald the Ember" = "Hearth, warmth, the sworn oath. Every fire descends from an older fire; a hearth lit from nothing has no god in it."
"Skarn Long-Hunger" = "Winter, wolf, famine. Not evil. Owed."
"Vetta of the Nine Doors" = "Birth, death, thresholds. Midwives and grave-diggers share her."
"Brann Redhand" = "War, feud, blood-price. The only god who keeps accounts."
"Aldra Sheaf-Mother" = "The field and the grain, and the dead laid under the earth. First sheaf to her, last sheaf left standing. A farmer's god in a land where the barley fails two years in three; Aud prays to her quietly."
"The Struck Name" = "Chiselled out of every standing stone in Vardmark in a generation nobody can date. Saying it is worse than oathbreaking. Nobody knows it; some claim to."
"The Two at the Back of the Fire" = "Nine places are set round the fire at every feast in Vardmark, and two are always left empty. Their names were not struck; they were lost, so long ago nobody remembers losing them. The priests argue whether they left or were forgotten; the ember-wives say that is the same thing. Bad luck to sit in their places, worse to name them; children dare each other to do both. With the Struck Name, they are the three not named (Y3 W17)."

[setting.customs]
"oath over ember" = "Hand over a live coal. Breaking it earns cold-tongue: nobody need hear, feed or avenge you."
by-names = "Given by the folk, never taken, and can change."
"the Standing" = "Any assembly. Stand to speak, sit to yield. A man who will not sit is making a threat."
guest-right = "Three nights, bread and salt, no blade drawn under the roof; the third morning the guest goes or becomes something else. Binds host and guest. It has a SENDING as well as a welcoming (Vigmar, Y2 W45): THIS HEARTH IS ANSWERED; WALK ON TO YOUR OWN FIRE - turns a guest away without breaking guest-right."
sea-burial = "Into the shallows under a stone where Ormegga can reach them. If the bay is iced, the ice is cut."
reckoning = "Winters, not years. Ages turn at the Feast of Turning."
milk-kin = "A child put to another woman's breast makes kinship: it bars marriage between the two and with each other's brothers, and makes a fostering claim both ways. It does not touch inheritance."
"the first hearth words" = "Fenn's, at Haldvik's first hearth, Y1 W11 D6, lit from the Skalgrind ember: HALD, HERE IS YOUR FIRE. IT CAME FROM THE HALL AT SKALGRIND, AND BEFORE THAT FROM THE HALL BEFORE IT, BACK TO THE FIRST FIRE, WHICH NOBODY LIT. WE CARRIED IT OVER THE SEA, AND IT DID NOT ASK WHERE IT WAS GOING. NEITHER DID WE. BURN HERE NOW. BE WARM TO WHOEVER SITS AT YOU, AND OWE NOBODY. WHILE YOU BURN, THIS IS A HOUSE. The folk answer: WHILE IT BURNS. Said again whenever a new hearth is lit from the main one."
"Feast of Turning" = "Midwinter, W46, the longest night; the new winter is counted from it. Every hearth banked to one coal and relit before dawn - if it goes out, the household's luck goes with it."

[setting.magic]
_ = "Rare, expensive, real."
ember-wives = "Read live coals, lay small wardings. Every working takes something that does not come back: warmth, a memory, winters off the end."
"laid wardings and cut marks" = "A laid warding is ember-wife craft and wants renewing. A cut mark does not, but only works cut true - by a hand that knows what it says. Very few living hands can; most marks are decoration."
"out past the settled land" = "Hollow-men that wear the drowned. Grey walkers on the high ground. Whatever fishermen will not name over deep water. Rare, survivable if careful and lucky, none of it interested in a fair fight."

[setting.homeland]
region = "Vardmark, seat Skalgrind, Jarl Hakvarr Ormsson. About 340 in the town and 600 in the fjord steadings, less the 108 he put on boats."
condition = "Nine cold winters, failing barley, unrest. About five weeks' sail by the ice road in good weather."
the_crossing = "WEST from Skalgrind, by the Needle and the sun, running the edge of the sea ice for the long middle of it - the ice road, why it was shorter than anyone expected. Haldvik lies somewhat north of home: midwinter days are shorter here, and everyone who has kept two Turnings knows it. Winters are harsher than Skalgrind's even in the Long Cold. Osvi can put a number on it from the noon sun at an equinox (Y3 W5)."
truth_of_it = "Officially a settling venture, actually a culling, and Erik said so in front of two hundred people."

[known_world]
_ = "What Haldvik has learned about this coast. How and when is in the chronicle."
the_broken_hulls = "Worked Hessa hardwood comes ashore in the windrow, thickening northward - the same wood as Skelva's token. Two fresh pieces, tar still black; Bruni reads the second as PULLED, not rotted, as if something pushed the boat. Hessa hulls have been coming apart north of here for thirty years and twice in the last two. And nobody at Kolvenn tells the story of a hull that did not come home."
threats_known = [
  "The Long Cold.",
  "Hakvarr, who will want to know whether this worked, and who now has a rival title on his coast.",
  "Whatever put out three fires on two hulls on the same still night.",
  "Whatever emptied this land four hundred winters ago.",
  "The hollow.",
  "Whatever is breaking Hessa hulls north of here.",
  "The thing that stands at the door and takes nothing.",
  "Whatever walked straight off the high moor to Nagholt and back (Y3 W1).",
]

[known_world.the_land]
shape = "Haldvik and Kolvenn sit on a long arm running north, bending hard west at the top and joining something much bigger four days' sail on. At its root a marsh neck that cannot be walked. Not an island. Gest: we are on a thumb."
walked_to = "The bay; the shoulder above it; the strand five km south-west; the bird cliffs at the south cape; the moor; the cairn line - eleven man-high stones on a straight six km NNE, ending at the hollow; the near edge of the south-west bog; the salmon river to its head."
the_bay = "Inside the bar, about 700 m from beach to bar and 1 km across, 5-10 m deep; the cod ground 300 m out; the seal reef under the north shoulder; one withied channel through the bar that moves every gale. Outside, the bottom falls away. VARDMARK CUSTOM (Hjalti): nobody owns the sea; a steading owns its shore to the net-lay; and a landing is the steading's - a ship drops sail outside and waits to be looked at. A find on your own shore is yours, like a whale."
the_water_road = "The salmon river rises in three loughs at the moor's southern edge and runs 11 km to the bay. The valley stream runs east from the old steading and dies in the bog. Between them 2.5 km of flat wet ground, and the old road crosses exactly there. Valley pine can be floated to Haldvik with one haul between two waters - but a four-metre pine is 300 kg, six men skid two a day, and timber floats only on the spring and autumn spates."
seen_not_walked = "The valley nine km south-west: pine 12-15 m; twelve grassed-over longhouses 22-26 m long; a sunken road a metre deep running east; a midden two men deep - cattle, sheep, pig, fish, seal, and six-row barley fatter than Aud's - whose top third goes from cattle to fish and stops. No graves anywhere. The last house's threshold slab is called Skalgrind."
unexplored = "Everything north of the moor. The whole west and north coast. Whatever the cairn line fences."
gives = "Peat and turf without limit. Grey building stone. Driftwood. Four springs. Grazing. Withies, bast, sealskin. Seaweed, shellfish, crowberry, teeth-grass, rosehip, pine needle. Salmon, cod, seal, seabirds. Bog ore in the peat."
does_not_give = "Standing timber within reach. Grain beyond one sowing. Flax. No kiln fired. No hiving bees seen."
weather = "First snow about W37-38; the terrace freezes a spade deep from W38; the bay ices about W46; the thaw about W8. Nothing dries in still air; cold moving air dries best. The bar re-cuts itself every winter of gales, so the channel is re-sounded after every blow, for ever."

[known_world.the_cairns_and_the_hollow]
the_marks = "A boundary formula cut at ten of the eleven cairns over six km: the ground beyond this is not yours. The eleventh says the same and three marks more. Vigmar can read one of the three and will not say it."
"Vigmar's_claim" = "The marks are ancestral to Skeld cut-marks, four hundred years older: this land is the old country and Vardmark the colony, and whatever the forefathers left here for had its name chiselled off every stone on the far side. His evidence: Skalgrind's old tally-stick, a list of what a storm-blown crew saw on this coast two generations back, with a mark on it that should not exist. His own objection: a century he has never accounted for."
the_pattern_of_names = "Twice a name read out of the ground here is a place in Vardmark: SKALGRIND, the valley threshold slab; NAGHOLT, the door post under the shoulder and a strip of Vardmark ground."
iron_in_the_stones = "There is iron in the cairns. The Needle swings near one and points a different way each time; two hundred paces off it behaves, and the line cannot be sighted."
the_hollow = "Where the line ends: a lipped basin about 400 paces across, bare peat, a black mass a man's height in the middle. No animal track goes in. Old small bones, and one long bone Ylva swears was not deer. Two paces inside the lip on a still morning her head went thin. FENN: a prison, walled by people who wanted the thing kept in and were still afraid of it four hundred winters on. ERIK: metal fallen from the sky that melted the stone. Fenn: might be both."
the_straight_tracks = "Y3 W1: two-footed prints, long, narrow and shallow, no claw, toe or heel, a stride longer than a running man's, dead straight over drifts and stones, off the high moor north-east to the peat cuttings over Nagholt, where it stood a long time, and back up the same line. Lost on scoured peat 3 km past the edge. Not Ivven, not snowshoes (Ylva). The dogs will not pass the cuttings. Ossur's grandmother's grey walkers go where something was left unfinished. Y3 W5: IT CAME BACK on fresh snow, the same line to the same place, stood longer, the patch twice as wide; the dogs would not settle about the fourth hour. Followed, it ran dead straight 5 km past the edge to a second smaller trodden patch on open moor with nothing there, then lost to the wind. Y3 W6, THE NIGHT AFTER THE LAYING: it came down over the laid house without stopping to THE UPPER EDGE OF THE FIELDS and stood looking at the roofs - SEEN in starlight, tall, grey-pale, narrow, too still for a man; it stood while watched and TURNED WHEN MEN WALKED UP, like a man done looking, and went back up its line without hurry, not gained on at a walk. INGRA'S READING: it goes home, north onto the high moor, further than Ylva went, to something heavy and cold that pulls like iron pulls (a guess). Not a god - gods leave no footprints - and not the one in her door, which does not walk (Ingra). Y3 W11: to the laid house and no further. Y3 W15, THE NIGHT OF THE LAND STANDING: straight across Aud's new strips, over the side ditch without a break, to the river bank, stood at the water, and back up the same line; not seen. Aud: nothing is buried in her field that she knows of - she dug a spade and a half; Aki's rods down the line found nothing. Y3 W16: ITS LINE RUNS STRAIGHT INTO YLVA'S BLACK RIDGE past the moor's crown, prints hours old leading off north-east. KOLVENN'S OLD WOMEN: when the oldest's mother was a girl one came down to the spit for a winter and stood in the snow at the houses; a young man threw a spear; found in the morning on his back in its tracks, no mark, eyes open; the spear upright ten paces past where it stood, head clean; it never came again. Her mother said he did not miss. The old ones' ground does not take Haldvik, it comes to look at it."

[known_world.the_needle]
what = "A dark iron needle floating in oil in a sealed brass case of foreign make. Osvi's, given freely; kept in Erik's chest (lent to Ylva Y3 W15-16)."
what_it_does = "Points north underneath, and at iron in the ground when close enough - why it swings on this coast and why Ketil's knife stood out from his hip at the second cairn."
loose_ends = "It drifted a hand's width off true in a hut in Skalgrind with nothing there to pull it. AND IT WALKS: seven clean sightings off the north headland, the seventh Y2 W51, each further east than the last, about a finger each time, never back. Even, not in jumps (Osvi): a failing needle sticks and wanders; this moves like something steady pulling. Cut on two sticks that agree, Osvi's and Aki's. AND IT SHIFTS AS YOU WALK (Y3 W5): laid against the dead-straight track of the walker at the moor edge and again 5 km out, the angle opened by a good hand. Aki and Osvi drew the two lines in ash: THEY CROSS NORTH, ON THE HIGH MOOR, ABOUT 20 KM FROM THE STOREHOUSE GABLE, GIVE OR TAKE 10. Osvi: if it points at one thing, that is where it is, and a needle that points north does not behave so. Two sticks, one in Osvi's chest. Summer work. Y3 W12-14, OSVI'S BOARD AND NOON STAKE at the tower and the head of the salmon river (11 km), Ylva taking the far sighting twice: THE LINES CROSS NORTH, ABOUT 22 KM FROM THE STOREHOUSE GABLE, GIVE OR TAKE 2 - blank ground beyond the high moor's crown. Osvi, aloud: if it points at a thing, his seven notches say the thing moves east a finger a month - or something else pulls. Y3 W16, YLVA AT THE CROSSING: past the crown a wide wet basin, and in it A RIDGE OF BLACK STONE lying in the peat, heavy, rust-red where broken, no cairns or marks; the Needle went round in circles over it."
what_the_folk_believe = "That it turned toward this land because this is where they were meant to come. Erik said it; Fenn repeats it."

[known_world.neighbours]
the_Hessa = "Allied by treaty. Four places, about 400 people, west and south-west; one has more people than Skalgrind. KOLVENN, 61 souls, four days' sail north: eleven plank-walled sunk-floor houses behind a shingle spit, a boatwright's shed twice any house and the middle of the place, three hardwood ships, about 150 years there - the far end of their world. Forest, grain, peas, fat, cooperage, barrels of birch tar, a master boatwright. NO SMITH in four places; their iron comes hand to hand from the far south-west, old and twice worked. They will not talk about the cairn stones in a house or after dark, and walk out of a room where the old ones are spoken of. ILMO (Y3 W6): the marks were cut by the dead; where the line ends is THE SLEEPING GROUND, which takes someone from Kolvenn every few years; THE DEAD SLEEP WHEN THE WIND SLEEPS - nobody goes near it on a still day. The Hessa came up the coast from the south-west following trees and salmon; the stones were already old and the houses grass - THE ONES BEFORE; green humps behind Kolvenn and down the coast, never dug or built on; THE OLD WOMEN AT KOLVENN WHO KEEP THE NAMES know more. A man named at Kolvenn as lost who walks home stands at the door as a stranger, and the house decides."
the_Ivven = "Deer people, two or three hundred, inland and north-east, on the coast some years and not others. Hide shelters moved every three days, pale lean dogs and dog-sleds, bone and antler for everything and no iron. Full white teeth. Will not go under a roof. Trade through Hessa via the scarred man: TEN HIDES FOR A KNIFE; in winter, meat at THREE DEER A KNIFE (Y3 W2), delivered by their own dogs. They come when the deer do. THE HERD IS THEIRS WHEREVER IT WALKS (Ilmo) - Kolvenn took six off the shore once in a hard winter and the Ivven stayed away three springs. In winter they are not hungry. Y3 W6 they came unasked with meat to the edge: TWENTY-FOUR DEER FOR EIGHT USED KNIVES off Haldvik belts, each tried and chosen; the scarred man carries the jarl's own. He keeps Vigmar's counted stick in his coat."
the_west_people = "Far south-west down the mainland: many, living in stone, a market where things are bought with metal. They never come here. Osvi's brass case came up that chain. An old woman at Kolvenn: they do not need us."
Skalgrind = "Five weeks of open water east. Hakvarr does not know whether anyone lives. Halvar: a hull from the north is the Hessa and we get a day; a hull from the open sea east is Skalgrind and we get an hour."

[practice]
_ = "STANDING PRACTICE, learned in play. It holds until play changes it. Numbers are in current.toml."

[practice.health]
the_coughing_measures = "Law. Separate messes by pit, boiled cloths over the mouth, two or three fixed carriers who stay away from the clean pit, vents open at night. The clean room is the one fewest walk through - longpit 3."
the_fresh_rule = "Enna calls it the most important thing anyone told her. Fresh food all winter: fish and meat eaten fresh, raw or barely warmed. Raw liver, seal and fish - THE CHILDREN FIRST, NURSING MOTHERS NEXT (Y2 W32). Berries packed whole in fat keep a year."
the_custom = "Two in the room at any birth or death."
frostbite = "Warm a frozen hand in cool water, never hot. Enna watches a week before she says what will be lost."

[practice.food]
the_units = "The ledger runs in STORE KG. Eaten is about 1.5 kg a head a day; store draw at full ration 0.65. Income is reported gross. Fresh income counts at half its raw weight against the store (Y2 W39). Oil and fat count like any other kg (W40). ONE NUMBER FOR THE PLAYER (Y2 W48): every figure shown is store kg; raw weights are GM-internal."
the_standing_order = "Salt, smoke, dry the rest. A dead-air week goes to the smokehouse, not the salt barrel. Counted every week."
how_it_is_caught = "Long-lines off two ship's boats, the strand lines, the racks, Sigra's stack, the weir in season, the cliffs in season. THE WINTER FISHERY is cod inside the bar until about W37, back on the offshore bank about W12. ON THE ICE, KOLVENN'S WAY (Ilmo): holes in a line and a net pushed under on a pole for flatfish and small cod; seal at the breathing hole with a barbed harpoon; basking seal stalked under white cover, crawling, freezing when one lifts its head. Always roped in pairs, an axe to test every step. The ice at Kolvenn takes somebody every winter, nearly always somebody who knew better."
the_harvest_first = "The jarl's standing priority (Y2 W31): cutting before construction; eggs and greens first because a crop needs no salt. Grain that will not dry outside is dried by the longpit hearths."
the_ceiling = "Weather. A good drying week with twenty-five hands hangs five or six hundred kilos; a still wet week almost none. Salting takes about 100 kg of salt per 500 of fish."

[practice.building]
"riving, not sawing" = "Bruni's way: a wedge in the end, follow the grain, hew flat with an axe. Twenty men at once, about 26 sticks a week. It wants short, hard iron wedges - long soft ones jump and break faces."
ormars_rule = "From about W38 the terrace freezes a spade deep. Every hole wanted before the thaw is dug in W35-36, stone-lined, stuffed with bracken and turfed. And a hole dug before the frost holds ice all winter and is a well at the thaw: open it, watch a fortnight, prove it, then set the post."
night_work = "Fire baskets of offcuts, not peat. Two hours at each end of the day, for hauling, carrying, dressing timber and cutting sod - never setting a post or cutting a joint."
labour_baseline = "Post hole dry: 0.5 man-day; in wet spring ground 1-1.5. Turf: 8-10 m2 per person-day. Spade-turned ground: 45 m2 per person-day. Riven sticks: 26 a week. Timber tower of 22 sticks: 48 man-days. Longpit 12x8 aisled: 350-400 man-days. Dressed stone building 10x10: six weeks."
