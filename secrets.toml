# Haldvik - secrets. GM ONLY. The player never reads this file.

_ = "GM ONLY. NEVER quoted, summarised, hinted or named - not in fiction, not in recaps, not in status briefings, not in answers about the files themselves. Naming a thing in here while discussing housekeeping spends it exactly as narrating it would. If the files must be discussed, discuss them by key name and count. What the player has earned is the log plus people.toml player.what_erik_knows, and nothing else has been revealed."
open_threads = [
  "NAGHOLT. Every peat face opened from now on is a dig, and a hundred and fifty cubic metres are to be cut in eight weeks by people paid in daylight to go fast.",
  "THE BONES, boxed since Y2 W22 in Ranvi's lean-to; by LAW 18 (Y3 W5) to be laid on their own floor at Nagholt under their own door post, the charcoal with them, the iron named at the door. Fenn's warning about a claim answered by saying nothing that makes them kin.",
  "SKELVA WILL NOT SPEAK OF THE OLD PEOPLE, and the asking alone cost a night of guest-right and an hour of tide. She was not told about the pit, the house or the name. The question alone did it.",
  "GEST STOPPED SPLICING FOR HALF A BEAT when he heard the name Nagholt, and asked to hear it again, and then said aye, well, and got in the boat.",
  "AILI OF KOLVENN gave Ingra three sentences and no more. What else she knows is not yet set.",
  "THE DEBT. Older than the landing, unpaid because nobody has been asked for it yet.",
  "THE THING AT THE DOOR. Fenn to Erik alone: it keeps the form, and guest-right binds men and not gods, so it is not above us, it is beside us.",
  "SOLVI IS WATCHING VIGMAR, on her condition that Erik acts on nothing without looking himself.",
  "TWENTY-FIVE KILOS OF IRON owed in Y4 against ten kilos of bar in the world. It cannot be paid without a bloomery, and neither smith has seen one, and one burn is one clamp.",
  "NOBODY WAS APPRENTICED TO BRUNI, and he went home at W28. Leif and Steinn finish the Widow's Promise on what they watched. Hoskuld died having taught nobody and it is in the dead list.",
  "TWO THEFTS from Y1 W13. One confessed and refused a hearing. THE OTHER IS GUDNY.",
  "KELDA'S FINDS. Four know. She is thirteen and will not be in a room alone. She left her own fish for the walker (Y3 W11) and told the jarl when asked; promised not again.",
  "THE NEEDLE walks east a finger a month, and the cairn stones have iron in them.",
  "BEES. Nobody has looked, because nobody has been to the valley.",
  "THE COUNCIL QUESTION, raised twice and never answered.",
  "THE IVVEN ANSWER TO LAW 17 IS NOT SET. The band carried home the scuffed line and the thrown leg, and three deer were taken inside the edge the next morning. What the bands make of it, and what the scarred man brings next time, is decided by agenda when they next come.",
  "NOT ON A DATE: Hakvarr's hulls, if word ever crosses the water. Vigmar's orders becoming visible. The next threshold Ingra stands on. Whatever is breaking Hessa hulls north of here.",
]
standing_rules = [
  "IF ANY SEA-BURIAL IS EVER HURRIED OR DONE WRONG, something starts coming up the shingle at night.",
  "Reading is looking and looking is answering, and something on the far end already answered once.",
  "Any voice in the room that is not saying yes sends away a thing that waits on a word. Ranvi taught Ingra this in Y1 W44 and neither understood the lesson at the time.",
]

[knowledge]
_ = "GM BOOKKEEPING ON WHO KNOWS WHAT. The player has seen all of this (it came from people.toml, Y3 W4); it lives here because it is about what Erik the man and the NPCs know, not about what the player knows. The log is the record of what the player has been shown."
erik_does_not_know = ["ENNA IS A SECOND WITNESS to what Vigmar did to Hild's son and has never said a word. Erik knows only Kelda's account."]
held_and_unspent = ["GROUNDS AGAINST VIGMAR: confessed theft from the jarl's hall, and carrying a thing that bears the struck name. The theft is provable and admitted; whether reading the name is a crime is untested and falls to Fenn. Erik once said he would kill him if he could replace him; by Y2 W34 he no longer knows. He has found Vigmar more reserved than a cultist, which does not make him a good man, and suspects the growing closeness was intended. Sorrier for Kelda than for anyone in it. Told Aki that if something happens to Vigmar it will not be by Erik's hands.", "KELDA'S ACCOUNT of the infant. Not acted on.", "THE ALE. Brek confessed and Erik refused to hear it, saying if he knew who stole it he would have them whipped or banished."]

[knowledge.closed_circles]
"the ember" = "Erik, Fenn, Ingra. Ranvi is dead."
"the hollow" = "Erik, Fenn, Ylva, by Erik's ruling - no word until next year. Ingra had the prison reading from Erik Y2 W30."
"the woman in the fire" = "Erik, Ingra. What Aili said at Kolvenn, Ingra told Erik alone."
"the door at the Turning, and the debt" = "Erik, Ingra, Fenn. Vigmar gave Ingra the old sending (Y2 W45) and will not ask why; what he guesses is his own. Tova learned the sending as a lesson and nothing of why."
"Kelda's tideline finds" = "Erik, Solvi, Kelda. Bruni read the wood without being told where it sits."
"Kelda's account of the infant" = "Erik, Solvi, Kelda."
"Brek" = "Erik and Brek. Hafli holds the saw half and has told nobody."
"Ranvi's reading of the debt" = "Erik, Ingra, Fenn. The settlement was told only that the luck is sound."

[committed]
_ = "THE LIVE BLOCK, AND ONLY ONE. Written before the player's action resolves, every week. Deleted when that week's chronicle entry is written. If this is empty, the week has not been committed yet."
week = "Y3 W14"
rolled_before_the_week = "Rolled at Y3 W13 upkeep, shell entropy, before any player action, ALL UNSEEN. Every follow-up list was written before its die."
Q1_weather = "Y3 W14 weather, SUMMER, 2d6 take higher: [5,4] = 5 = YES. FAIR SUMMER: warm days and light winds; every day workable; boats every day."
Q2_does_anything_unlooked_for_reach_haldvik = "d6: 2 = NO. Nothing unlooked-for this week (the Hessa are looked-for)."
the_cod = "SET at W12: the cod returns W14. WHICH DAY, d6 (1 D6 thin; 2 D5 thin; 3 D4; 4 D3; 5 D2; 6 D1 and thick): 6 = D1, and thick. From its day about 60-80 store kg a boat-day at first, building."
the_hessa = "THE W14 SHIP. WHEN, d6 (1 not this week, the week after; 2 D6; 3 D5; 4 D4; 5 D3; 6 D2): 1 = THE HESSA DO NOT COME THIS WEEK - held by weather or by Kolvenn; they come the week after. Skelva leads it. They bring cordage and wood as agreed and nothing else unless asked; they will trade food if asked and paid. Vask has sent word by Skelva that he wants to hear the iron from the jarl himself, not from Ilmo."
inside_agenda = "W14 D1 council: the store about 125 - under half a week at 300 out. VIGMAR lays out what is left that is not the ration: the seed is IN THE GROUND (sown W11); THE BYRE, 17 head - nine ewes near lambing, two rams, four goats, the cow, the heifer calf; the thirteen hens; the Ivven hides (not food). He will not propose; he will say what each costs. The Hessa can be asked for food against oil."
notes = "No test rolls made in advance. Difficulty set AFTER Erik states a plan, said out loud before dice. Difficulties 3/5/7/9/11 only."

[hidden_truths]
the_needle = "Does not point north. Points at a body of sky-iron under the high moor about 22 km inland. Southern make; the makers were following the same thing. THE CREEP IS REAL, ongoing and one-directional: the needle is also being pulled off true by a SECOND, SMALLER, MOVING body of sky-iron, and until it is found this reads exactly like the moor mass waking. Two clean bearings a fortnight apart from two points 6 km apart would cross and give a position. NOBODY HAS THOUGHT TO TRIANGULATE. The sky-iron is worth more than the land, and if Hakvarr learns of it, he comes. Erik has the ground-iron part right, which also means the Needle would never have carried them home."
the_big_one = "The cairn-builders were the Skeldfolk, or the people the Skeldfolk came out of. This land is the old country; Vardmark is the colony. The folk lived here, fenced the hollow, and left across the water. Something drove them out, its name was chiselled off every stone they raised on the far side, speaking it became the worst crime there is, and in four centuries the reason was forgotten and only the taboo survived. THE ELEVENTH CAIRN CARRIES THE STRUCK NAME because the eleventh cairn is the one at the hollow. Vigmar has believed this twenty years and never said it aloud: it makes the folk exiles rather than settlers, and it makes the struck name a thing with a place, and a place can be gone to. Unknown to anyone: whether Skal was a person, a family, or a word."
the_hollow_is_a_fence = "Each cairn has a lump of sky-iron in its lowest course beside a marked slab - black, heavy, strongly lodestone, which is why loose iron turns near them. They are not pointing at the thing, they are FENCING it. The basin leaks heavy gas out of the peat and it pools in the bottom on still days, two or three metres deep, invisible, odourless. Anything that walks in on a windless morning goes to sleep and does not get up; the bones on the floor include people. ON A WINDY DAY IT IS COMPLETELY HARMLESS, which is what makes it lethal, because it teaches you it is safe. Not a curse. A fence, built by people who lost enough of their own to bother. The black mass proud of the peat is the sky-iron itself."
the_door = "SPINE OF THE SUPERNATURAL THREAD. A bare door-frame in falling snow, nothing either side, grey windless daylight beyond, a figure filling it and not crossing. It is not stuck. It is waiting to be asked across; guest-right runs both ways and it knows the form. The hearth-fire on two hulls was THE PRICE PAID for the door, and Ingra paid nothing because Ingra was not the one charged. At the Y1 Turning it came again, nearer, awake, in a room, and NOTHING WAS CHARGED AT ALL - which is worse, because a thing that takes nothing is no longer buying. It is asking. Vetta of the Nine Doors is genuinely in this, and is who Erik prayed to on the cliff twice without deciding to. INGRA WILL BE SHOWN MORE whether anyone wants it or not; the next contact is not on a date, it comes when the settlement stands on a threshold. WHAT CAN STILL BE LEARNED: Fenn, as priest, will name Vetta and say he does not think that is what this is. Ranvi knew of one thing that comes to a threshold, keeps the form and cannot cross, and did not know its name - AND RANVI IS DEAD, so that road is closed unless someone else in the world holds it."
the_debt = "Ranvi's reading was true and she reported it honestly. GM TRUTH SHE COULD NOT SEE: the debt is the fire that went out on the crossing, the price paid for the Door, and the thing standing in the porch. A thing that takes nothing has not presented its bill. Two coals unspent in the basket, and the basket is Ingra's."
the_ember = "The line is genuinely unbroken - Torgest lit that lantern off the Skalgrind hall hearth himself, twice, and complained about it for five weeks. What is still live: Fenn owes Erik his honour and his office and nobody else knows, and he has built Erik's legitimacy on that fire deliberately ever since. The settlement is named after a coal that went out, and Erik was made jarl with his hand on it."
nagholt_and_the_karrsson_strip = "NAGHOLT IS THE KARRSSON STRIP. Gest swore over ember before Hakvarr and two witnesses that no Karrsson claims land in Vardmark again, and signed over the Nagholt strip, to get Erik out of the cell. Erik knew the name instantly as his family ground. HE DOES NOT KNOW IT IS GONE, and Gest is standing in the settlement carrying it. THIS IS THE LOADED GUN AND IT IS ON THE TABLE."
still_open_in_the_ground = "Whether the whole shoulder is built on. Whether more houses lie under the cuttings. Where the dead are - there are no graves in the valley either. And what burned Nagholt."

[npc_truths]
"Vigmar Stenn" = "Nobody sent him; he asked, because he is the only living man in Vardmark who can read the archaic marks. HE CARRIES SEALED ORDERS: if the settlement holds, send word before autumn; the jarl follows with three hulls in spring and takes it; if the leader dies, Vigmar claims authority in Hakvarr's name. HE IS THINNING THE SICK - he held the infant's face down and will do it again. ARC: no ship is going back, so the orders are a problem he has to solve, and he now believes this is the old country, which means reporting it brings Hakvarr to the doorstep of the one thing Vigmar came for. HE HAS CHOSEN THE GROUND OVER THE ORDERS, and he will not tell Erik he chose it. Teaching Tova the marks is him making sure they do not die with him, and it is also a second key to the one lock Erik would rather stayed shut, and she is thirteen years old."
"Enna Softhand" = "THE SECOND WITNESS, and she has never said a word. She examined the infant alive in the morning, failing, days left, then went aft to the old woman. Vigmar came later and told her the boy had gone. She went back and found him dead and still warm, pinpoint bleeds in the whites of his eyes and under the lids, and his mother's blanket folded neatly over his face by a woman who had not moved in two days. She said nothing: 108 people five weeks from anywhere, the man was the reeve and held the stores, the child was dying regardless, and she had no witness. SHE WILL CONFIRM EVERY WORD IF ASKED BY SOMEONE WHO ALREADY KNOWS. She will never volunteer it. She does not know Kelda saw anything."
Kelda = "Saw him do it. Told Solvi once. Will tell one person she trusts, and only if asked something close to the right question."
"Brek Ironarm" = "Exposed by his own mouth, which was the good branch of the fork and was earned - Erik gave him credit, the forge, full days and never once humiliated him. WHAT IS STILL LIVE: Hafli knows the saw half and has said nothing to anyone. The settlement does not know. And the thing Brek cannot do has not changed - no plate, no big weld - so the next job that needs a master will find the same wall."
"Gest One-Ear" = "What he paid to get Erik out of the cell: he swore over ember before Hakvarr and two witnesses that no Karrsson claims land in Vardmark again, ever, and signed over the Nagholt strip. THERE IS NO LEGAL WAY HOME FOR THE FAMILY. Erik does not know. Gest will carry it as long as he can, and he has now heard the name Nagholt read out of the ground."
Ingra = "PAID FOR THE W6 READING WITH THE WARMTH OF HER HANDS, for good. Did not choose the craft; it started the night her husband died. Stronger than Ranvi ever was and Ranvi was frightened of it. There is now nobody alive who can tell her no, and Erik knows it and will be bad at it because he is her brother."
Solvi = "Relieved the marriage collapsed and ashamed of the relief. The most observant person here. Was first to notice Vigmar."
Sigra = "Grief goes wherever it is easiest to put it and will not go on herself. She pushed for the larger take at the reef; Erik ordered the hunt; both are true and both have now been said. Her old play was to split her kin off. She cannot stand for jarl. ULF CAN. Binding the office rather than the man is what she does every time, and it is not concession."
Halvar = "Loyal, and a better war-leader than Erik. Will not move against him. Takes command instantly and legitimately if Erik dies. Genuinely bound by the Shield's oath and knows what it cost."
Torgest = "Mutiny was always conditional on being ignored. Used, credited and valued repeatedly; the window is nearly shut. Only being forgotten reopens it."
Ylva = "Will go inland alone without permission again if fenced off from a question she has asked six times."
Hovard = "Then you'll want ships was an oath in everything but form."
Ormar = "Competent, honest about his limits. Did the Sigra job once and will not be used that way twice."
Hafli = "Will be a better smith than Brek within three years and Brek already knows it."
Gudny = "Took flour and fish for three children under seven during the crossing and stopped the day they landed. She is the second theft. Erik suspects and has not acted."
Vask = "Decided that Haldvik are people who keep a rule, and has traded generously on that read ever since."
the_Hessa_fear = "They know the cairn line. They call the hollow the sleeping ground, they lose someone to it every few years, and they believe the marks were cut by the dead. A boatload of people who cut THE SAME MARKS arriving on that coast is, to them, either ancestors returning or something worse. There are people at Kolvenn who do know about the old people. Skelva is not one and does not want to be, and when she has the words she will be able to say who is."
Kolvenn_has_the_craft = "AILI. The woman Ingra saw gutting salmon is Skelva's sister-in-law, lives in Kolvenn, and LOOKED BACK. Skelva has no craft of her own and does not know any of this. INGRA MET HER Y2 W30, and Aili drew her aside."
the_Ivven_truth = "They avoid the moor entirely and have never built on this land. They will not walk the cairn line and will not name it. They came back the first time because the first visit told them Haldvik does not take, and the second because Vigmar handed them a counted stick. WHAT THEY ARE WORTH IS NOT HIDES. They have walked this peninsula for generations and know where water is, where the deer road runs, what the winters do, and WHAT IS ON THE MOOR. Nobody in Haldvik has thought to ask. If asked directly about the cairn line or the hollow, the scarred man will refuse to answer, and the refusal itself is the answer."

[the_land_truth]
shape = "A peninsula about 65 km long joined at its western root to a larger landmass by a marsh neck."
north_shore = "Deep water, easy landing, fully exposed to winter wind. Looks better than it is."
bog_ore = "Real, good, and in workable quantity in the shoulder peat - enough for nails, hooks, tools and eventually blooms. What it needs to become supply is a proper bloomery, a season of charcoal and four men."
reef_herd = "Left alone after a disturbance the herd resettles at about two thirds and it becomes an annual harvest. HIT TWICE INSIDE THREE WEEKS and they abandon the reef for the outer skerries where no boat can work them. They also pup in spring: approach that rock before W20 and they leave it for good."
winter = "Worse than Vardmark. First snow W37-38, bay ices about W46, thaw about W8."

[recurring_yields]
_ = "COMMITTED CEILINGS, reusable every year. The GM does not fudge these upward."
salmon = "A real run: starts on the first spate after W28, builds W29, PEAKS W30-32 and is enormous, tails off W33, over by W34. With six hands about 3.2 t wet. WITH TWELVE HANDS through the peak about 5 t wet, about 1.2 t dried - and the extra all falls in the same three weeks as the seal cull. The limit is gutting hands and rack space, not fish. RISK: wicker cruives in a spating river hold if pegged and weighted and go downstream if merely set in the gap."
bird_cliffs = "Birds back on the ledges from W22, eggs fresh from W24. Going in early is worth roughly twice a late trip: about 1.6 t of eggs and 400 kg of birds across two trips, three trips proportionally more. THE TRIGGER: IF THE WORK RUNS PAST FOUR CONSECUTIVE DAYS WITHOUT A REST DAY, or is done in wind above a fresh breeze, SOMEBODY FALLS."
seal = "About 40 kg of meat, 16 litres of oil and a hide per bull. Twenty bulls of forty, one morning, from seaward, on the rock and never in deep water, never among the cows. Fat meat does not dry - it must be dry-salted the same afternoon or it goes rancid on a rack and becomes poison."
long_lines_and_racks = "Best sustained rate about 250 kg a week in summer."
hunger_bands = "Against the honest target for any winter: at target everyone lives. A tenth short is hungry and ugly and all but the frailest live. A quarter short and the old and the smallest children go, call it eight to fifteen dead. Half short is a culling, and Vigmar will help it along. DEATHS COME FROM COLD, DAMP AND THE COUGHING BEFORE THEY COME FROM HUNGER, and Enna's five plus the fresh-food rule decide the number."
